<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="system-ui,PingFang SC,sans-serif">
<rect width="720" height="400" fill="#fafafa"/>
<text x="360" y="28" font-weight="bold" fill="#212529" font-size="17" text-anchor="middle">Vue 欢迎页 — "You did it!"</text>

<!-- 浏览器窗口：浅灰边 -->
<rect x="50" y="55" width="620" height="300" fill="#fff" stroke="#adb5bd" rx="4"/>
<rect x="50" y="55" width="620" height="34" fill="#f1f3f5" rx="4"/>
<rect x="50" y="83" width="620" height="6" fill="#f1f3f5"/>
<circle cx="68" cy="72" r="5" fill="#ff5f57"/>
<circle cx="84" cy="72" r="5" fill="#febc2e"/>
<circle cx="100" cy="72" r="5" fill="#28c840"/>

<!-- URL 栏 -->
<rect x="125" y="62" width="510" height="22" fill="#fff" stroke="#dee2e6" rx="11"/>
<text x="145" y="77" fill="#495057" font-size="11" font-family="monospace">🔒 http://localhost:5173/</text>

<!-- Vue Logo -->
<g transform="translate(310, 130)">
<polygon points="0,-36 32,-18 32,18 0,36 -32,18 -32,-18" fill="#42b883"/>
<polygon points="0,-36 32,-18 32,18 0,36" fill="#35495e"/>
</g>

<!-- 欢迎页内容 -->
<text x="360" y="240" fill="#42b883" font-size="34" font-weight="bold" text-anchor="middle">You did it!</text>
<text x="360" y="272" fill="#495057" font-size="13" text-anchor="middle">Welcome to your new Vue app.</text>
<text x="360" y="295" fill="#868e96" font-size="11" text-anchor="middle">Edit &lt;App.vue&gt; to get started.</text>
<text x="360" y="328" fill="#adb5bd" font-size="10" text-anchor="middle" font-family="monospace">[ Vite + Vue 3 ]</text>
</svg>
