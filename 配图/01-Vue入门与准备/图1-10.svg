<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420" font-family="system-ui, -apple-system, sans-serif">
  <rect width="700" height="420" fill="#fff"/>
  <rect width="700" height="420" fill="#f8f9fa" rx="6" stroke="#dee2e6" stroke-width="1"/>
  <text x="30" y="35" fill="#333" font-size="18" font-weight="bold">my-vue-app/  — 完整目录</text>

  <!-- 目录树：每行 = 路径 + 右侧同基线的灰色注释列 -->
  <text x="30"  y="72"  fill="#1971c2" font-size="14" font-family="monospace">├── index.html</text>
  <text x="215" y="72"  fill="#868e96" font-size="10">入口 HTML</text>

  <text x="30"  y="96"  fill="#e8590c" font-size="14" font-family="monospace">├── package.json</text>
  <text x="215" y="96"  fill="#868e96" font-size="10">项目配置 · 依赖列表 · 脚本</text>

  <text x="30"  y="120" fill="#1971c2" font-size="14" font-family="monospace">├── vite.config.js</text>
  <text x="215" y="120" fill="#868e96" font-size="10">Vite 构建配置</text>

  <text x="30"  y="144" fill="#2f9e44" font-size="14" font-family="monospace">├── public/</text>
  <text x="215" y="144" fill="#868e96" font-size="10">静态资源（不编译）</text>

  <text x="30"  y="178" fill="#e8590c" font-size="14" font-family="monospace">├── src/</text>
  <text x="215" y="178" fill="#868e96" font-size="10">源码目录⭐</text>

  <text x="48"  y="202" fill="#333" font-size="13" font-family="monospace">│  ├── App.vue</text>
  <text x="215" y="202" fill="#868e96" font-size="10">根组件</text>

  <text x="48"  y="226" fill="#333" font-size="13" font-family="monospace">│  ├── main.js</text>
  <text x="215" y="226" fill="#868e96" font-size="10">入口 JS</text>

  <text x="48"  y="250" fill="#999" font-size="12" font-family="monospace">│  ├── components/</text>
  <text x="215" y="250" fill="#868e96" font-size="10">子组件</text>

  <text x="48"  y="274" fill="#999" font-size="12" font-family="monospace">│  ├── views/</text>
  <text x="215" y="274" fill="#868e96" font-size="10">页面组件</text>

  <text x="48"  y="298" fill="#999" font-size="12" font-family="monospace">│  └── assets/</text>
  <text x="215" y="298" fill="#868e96" font-size="10">图片/样式</text>

  <text x="30"  y="332" fill="#999" font-size="13" font-family="monospace">├── node_modules/</text>
  <text x="215" y="332" fill="#868e96" font-size="10">依赖（自动生成）</text>

  <text x="30"  y="356" fill="#999" font-size="12" font-family="monospace">└── .gitignore</text>
  <text x="215" y="356" fill="#868e96" font-size="10">Git 忽略规则</text>

  <!-- 右侧：5 个必看文件 -->
  <rect x="500" y="60" width="170" height="320" rx="8" fill="#fff3bf" stroke="#fab005" stroke-width="1"/>
  <text x="585" y="85" fill="#e67700" font-size="12" font-weight="bold" text-anchor="middle">5 个必看文件</text>
  <circle cx="530" cy="110" r="4" fill="#fab005"/><text x="545" y="114" fill="#495057" font-size="11">index.html</text>
  <circle cx="530" cy="135" r="4" fill="#fab005"/><text x="545" y="139" fill="#495057" font-size="11">package.json</text>
  <circle cx="530" cy="160" r="4" fill="#fab005"/><text x="545" y="164" fill="#495057" font-size="11">vite.config.js</text>
  <circle cx="530" cy="185" r="4" fill="#fab005"/><text x="545" y="189" fill="#495057" font-size="11">src/App.vue</text>
  <circle cx="530" cy="210" r="4" fill="#fab005"/><text x="545" y="214" fill="#495057" font-size="11">src/main.js</text>
</svg>