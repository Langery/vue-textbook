<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" font-family="system-ui,PingFang SC,sans-serif">
  <rect width="720" height="520" fill="#fafafa"/>
  <text x="360" y="30" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">全局错误处理：三层兜底，各管一段</text>

  <!-- 第一层：app.config.errorHandler -->
  <rect x="20" y="52" width="680" height="120" fill="#e7f3ff" stroke="#1971c2" stroke-width="1.5" rx="4"/>
  <rect x="20" y="52" width="8" height="120" fill="#1971c2"/>
  <text x="44" y="80" font-weight="bold" fill="#1971c2" font-size="14" text-anchor="start">第 1 层　app.config.errorHandler　—— Vue 内部的错误</text>
  <text x="44" y="104" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#1971c2" text-anchor="start">app.config.errorHandler = (err, instance, info) =&gt; { report(err) }</text>
  <text x="44" y="132" fill="#495057" font-size="11" text-anchor="start">捕获：渲染、更新、生命周期钩子里同步抛出的错误，setup 里直接 throw 也算</text>
  <text x="44" y="154" fill="#868e96" font-size="10" text-anchor="start">在 main.js 里配一次，对整个应用实例生效；异步异常它看不到</text>

  <!-- 第二层：window.onerror -->
  <rect x="20" y="184" width="680" height="120" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
  <rect x="20" y="184" width="8" height="120" fill="#2f9e44"/>
  <text x="44" y="212" font-weight="bold" fill="#2f9e44" font-size="14" text-anchor="start">第 2 层　window.onerror　—— 页面里剩下的同步错误</text>
  <text x="44" y="236" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#2f9e44" text-anchor="start">window.onerror = (msg, src, line, col, err) =&gt; { report(err) }</text>
  <text x="44" y="264" fill="#495057" font-size="11" text-anchor="start">捕获：定时器回调、事件回调、非 Vue 的第三方脚本里没人接的同步错误</text>
  <text x="44" y="286" fill="#868e96" font-size="10" text-anchor="start">还会顺带收到资源加载失败：&lt;img&gt; / &lt;script&gt; 404 时能拿到 src</text>

  <!-- 第三层：unhandledrejection -->
  <rect x="20" y="316" width="680" height="120" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5" rx="4"/>
  <rect x="20" y="316" width="8" height="120" fill="#e8590c"/>
  <text x="44" y="344" font-weight="bold" fill="#e8590c" font-size="14" text-anchor="start">第 3 层　unhandledrejection　—— 漏网的 Promise</text>
  <text x="44" y="368" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#e8590c" text-anchor="start">window.addEventListener('unhandledrejection', e =&gt; report(e.reason))</text>
  <text x="44" y="396" fill="#495057" font-size="11" text-anchor="start">捕获：所有没有 catch 的 Promise 拒绝 —— 接口挂了、忘了 await 的异常</text>
  <text x="44" y="418" fill="#868e96" font-size="10" text-anchor="start">这类错误脱离了 Vue 的调用栈，前两层都接不住；可配 e.preventDefault() 压掉默认提示</text>

  <!-- 关系说明 -->
  <rect x="20" y="448" width="680" height="52" fill="#fff" stroke="#dee2e6" stroke-width="1.5" rx="4"/>
  <text x="34" y="470" font-weight="bold" fill="#495057" font-size="12" text-anchor="start">为什么三层都要：</text>
  <text x="140" y="470" fill="#495057" font-size="11" text-anchor="start">漏掉任何一层，就有一类错误静默丢掉，日志里什么都看不到</text>
  <text x="34" y="490" fill="#868e96" font-size="11" text-anchor="start">接上之后统一上报到监控平台，线上问题才有迹可循</text>
</svg>