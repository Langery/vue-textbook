<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" font-family="system-ui,PingFang SC,sans-serif">
  <rect width="720" height="460" fill="#fafafa"/>
  <text x="360" y="30" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">手写表单验证：从提交到定位第一个错误</text>

  <!-- 起点：用户提交 -->
  <rect x="270" y="48" width="180" height="44" fill="#e7f3ff" stroke="#1971c2" stroke-width="1.5" rx="4"/>
  <text x="360" y="75" font-weight="bold" fill="#1971c2" font-size="13" text-anchor="middle">用户点「提交」</text>

  <line x1="360" y1="92" x2="360" y2="116" stroke="#1971c2" stroke-width="1.5"/>
  <polygon points="360,124 353,110 367,110" fill="#1971c2"/>

  <!-- 逐字段校验 -->
  <rect x="240" y="124" width="240" height="56" fill="#cce5ff" stroke="#1971c2" stroke-width="1.5" rx="4"/>
  <text x="360" y="146" font-weight="bold" fill="#1971c2" font-size="13" text-anchor="middle">逐字段跑校验函数</text>
  <text x="360" y="166" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="middle">validateAll()</text>

  <line x1="360" y1="180" x2="360" y2="204" stroke="#1971c2" stroke-width="1.5"/>
  <polygon points="360,212 353,198 367,198" fill="#1971c2"/>

  <!-- 判断 -->
  <polygon points="360,214 448,250 360,286 272,250" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5"/>
  <text x="360" y="248" font-weight="bold" fill="#e8590c" font-size="13" text-anchor="middle">有错误吗？</text>
  <text x="360" y="266" fill="#868e96" font-size="10" text-anchor="middle">errors 有非空值</text>

  <!-- 失败分支：向左 -->
  <line x1="272" y1="250" x2="196" y2="250" stroke="#c92a2a" stroke-width="1.5"/>
  <polygon points="188,250 202,244 202,256" fill="#c92a2a"/>
  <text x="234" y="240" font-weight="bold" fill="#c92a2a" font-size="11" text-anchor="middle">有</text>

  <rect x="20" y="300" width="330" height="96" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.5" rx="4"/>
  <text x="36" y="324" font-weight="bold" fill="#c92a2a" font-size="13" text-anchor="start">失败路径</text>
  <text x="36" y="345" fill="#495057" font-size="11" text-anchor="start">1. 把错误写进 errors 对象</text>
  <text x="36" y="365" fill="#495057" font-size="11" text-anchor="start">2. 渲染到对应字段下方</text>
  <text x="36" y="385" fill="#495057" font-size="11" text-anchor="start">3. 聚焦到第一个错误项</text>

  <!-- 成功分支：向右 -->
  <line x1="448" y1="250" x2="524" y2="250" stroke="#2f9e44" stroke-width="1.5"/>
  <polygon points="532,250 518,244 518,256" fill="#2f9e44"/>
  <text x="490" y="240" font-weight="bold" fill="#2f9e44" font-size="11" text-anchor="middle">没有</text>

  <rect x="370" y="300" width="330" height="96" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
  <text x="386" y="324" font-weight="bold" fill="#2f9e44" font-size="13" text-anchor="start">通过路径</text>
  <text x="386" y="345" fill="#495057" font-size="11" text-anchor="start">1. 收集到的值就是 form 本身</text>
  <text x="386" y="365" fill="#495057" font-size="11" text-anchor="start">2. 调接口发请求</text>
  <text x="386" y="385" fill="#495057" font-size="11" text-anchor="start">3. 成功后清空或跳转</text>

  <!-- 纵向连线 -->
  <line x1="188" y1="286" x2="188" y2="300" stroke="#c92a2a" stroke-width="1.5"/>
  <polygon points="188,300 182,288 194,288" fill="#c92a2a"/>
  <line x1="532" y1="286" x2="532" y2="300" stroke="#2f9e44" stroke-width="1.5"/>
  <polygon points="532,300 526,288 538,288" fill="#2f9e44"/>

  <!-- 实时验证补充 -->
  <rect x="20" y="410" width="680" height="34" fill="#fff" stroke="#dee2e6" stroke-width="1.5" rx="4"/>
  <text x="360" y="432" font-weight="bold" fill="#495057" font-size="12" text-anchor="middle">补充：失焦时（@blur）也可以只校验单个字段，边填边纠错体验更好</text>
</svg>
