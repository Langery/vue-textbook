<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" font-family="system-ui,PingFang SC,sans-serif">
  <rect width="720" height="480" fill="#fafafa"/>
  <text x="360" y="30" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">注册表单的完整交互流转</text>

  <!-- 1 用户填写 -->
  <rect x="255" y="48" width="210" height="48" fill="#e7f3ff" stroke="#1971c2" stroke-width="1.5" rx="4"/>
  <text x="360" y="70" font-weight="bold" fill="#1971c2" font-size="13" text-anchor="middle">用户填写表单</text>
  <text x="360" y="88" fill="#868e96" font-size="10" text-anchor="middle">v-model 双向绑定到 values</text>

  <line x1="360" y1="96" x2="360" y2="120" stroke="#1971c2" stroke-width="1.5"/>
  <polygon points="360,128 353,114 367,114" fill="#1971c2"/>

  <!-- 2 触发校验 -->
  <rect x="235" y="128" width="250" height="58" fill="#cce5ff" stroke="#1971c2" stroke-width="1.5" rx="4"/>
  <text x="360" y="152" font-weight="bold" fill="#1971c2" font-size="13" text-anchor="middle">触发校验</text>
  <text x="360" y="172" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="middle">validate() / handleSubmit(cb)</text>

  <line x1="360" y1="186" x2="360" y2="210" stroke="#1971c2" stroke-width="1.5"/>
  <polygon points="360,218 353,204 367,204" fill="#1971c2"/>

  <!-- 3 判断 -->
  <polygon points="360,220 452,258 360,296 268,258" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5"/>
  <text x="360" y="255" font-weight="bold" fill="#e8590c" font-size="13" text-anchor="middle">全部通过？</text>
  <text x="360" y="273" fill="#868e96" font-size="10" text-anchor="middle">errors 里有值吗</text>

  <!-- 4 失败分支 -->
  <line x1="268" y1="258" x2="192" y2="258" stroke="#c92a2a" stroke-width="1.5"/>
  <polygon points="184,258 198,252 198,264" fill="#c92a2a"/>
  <text x="226" y="248" font-weight="bold" fill="#c92a2a" font-size="11" text-anchor="middle">否</text>

  <rect x="20" y="316" width="300" height="118" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.5" rx="4"/>
  <text x="36" y="340" font-weight="bold" fill="#c92a2a" font-size="13" text-anchor="start">4. 展示错误</text>
  <text x="36" y="361" fill="#495057" font-size="11" text-anchor="start">写进 errors，字段下方提示</text>
  <text x="36" y="381" fill="#495057" font-size="11" text-anchor="start">聚焦到第一个出错的字段</text>
  <text x="36" y="401" fill="#495057" font-size="11" text-anchor="start">用户照提示修改后重新校验</text>
  <text x="36" y="424" fill="#868e96" font-size="10" text-anchor="start">改过的字段错误会即时清掉</text>

  <!-- 修正回路：沿左侧绕回「触发校验」 -->
  <line x1="170" y1="316" x2="170" y2="157" stroke="#c92a2a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="170" y1="157" x2="225" y2="157" stroke="#c92a2a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="235,157 221,151 221,163" fill="#c92a2a"/>
  <text x="176" y="272" font-size="10" fill="#c92a2a" text-anchor="start">改完</text>
  <text x="176" y="288" font-size="10" fill="#c92a2a" text-anchor="start">再校验</text>

  <!-- 5 成功分支 -->
  <line x1="452" y1="258" x2="528" y2="258" stroke="#2f9e44" stroke-width="1.5"/>
  <polygon points="536,258 522,252 522,264" fill="#2f9e44"/>
  <text x="494" y="248" font-weight="bold" fill="#2f9e44" font-size="11" text-anchor="middle">是</text>

  <rect x="400" y="316" width="300" height="118" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
  <text x="416" y="340" font-weight="bold" fill="#2f9e44" font-size="13" text-anchor="start">5. 通过并提交</text>
  <text x="416" y="361" fill="#495057" font-size="11" text-anchor="start">回调拿到校验后的值对象</text>
  <text x="416" y="381" fill="#495057" font-size="11" text-anchor="start">发请求，按钮进入 submitting</text>
  <text x="416" y="401" fill="#495057" font-size="11" text-anchor="start">成功：提示并跳转 / 清空</text>
  <text x="416" y="424" fill="#868e96" font-size="10" text-anchor="start">失败：保留数据，回到可重试</text>

  <line x1="536" y1="296" x2="536" y2="316" stroke="#2f9e44" stroke-width="1.5"/>
  <polygon points="536,316 530,302 542,302" fill="#2f9e44"/>

  <!-- 底部 -->
  <text x="20" y="462" font-weight="bold" fill="#495057" font-size="12" text-anchor="start">三个体验细节</text>
  <text x="120" y="462" fill="#495057" font-size="11" text-anchor="start">失焦就校验（不用等提交）</text>
  <text x="290" y="462" fill="#495057" font-size="11" text-anchor="start">·</text>
  <text x="304" y="462" fill="#495057" font-size="11" text-anchor="start">错误紧贴字段显示</text>
  <text x="440" y="462" fill="#495057" font-size="11" text-anchor="start">·</text>
  <text x="454" y="462" fill="#495057" font-size="11" text-anchor="start">提交中禁止重复点击</text>
  <text x="20" y="478" fill="#868e96" font-size="11" text-anchor="start">前端验证是体验，后端验证是安全——两道都要有，缺一不可</text>
</svg>
