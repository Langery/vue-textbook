<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" font-family="system-ui,PingFang SC,sans-serif">
  <rect width="720" height="500" fill="#fafafa"/>
  <text x="360" y="30" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">表单提交状态机：五个状态与跳转条件</text>

  <!-- idle -->
  <rect x="30" y="60" width="150" height="76" fill="#fff" stroke="#868e96" stroke-width="1.5" rx="4"/>
  <text x="105" y="86" font-weight="bold" fill="#495057" font-size="13" text-anchor="middle">idle</text>
  <text x="105" y="106" fill="#868e96" font-size="11" text-anchor="middle">就绪待填</text>
  <text x="105" y="124" fill="#868e96" font-size="10" text-anchor="middle">按钮可点</text>

  <!-- validating -->
  <rect x="250" y="60" width="150" height="76" fill="#e7f3ff" stroke="#1971c2" stroke-width="1.5" rx="4"/>
  <text x="325" y="86" font-weight="bold" fill="#1971c2" font-size="13" text-anchor="middle">validating</text>
  <text x="325" y="106" fill="#495057" font-size="11" text-anchor="middle">跑校验规则</text>
  <text x="325" y="124" fill="#868e96" font-size="10" text-anchor="middle">同步，一瞬间</text>

  <!-- submitting -->
  <rect x="490" y="60" width="170" height="76" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5" rx="4"/>
  <text x="575" y="86" font-weight="bold" fill="#e8590c" font-size="13" text-anchor="middle">submitting</text>
  <text x="575" y="106" fill="#495057" font-size="11" text-anchor="middle">发请求中</text>
  <text x="575" y="124" fill="#868e96" font-size="10" text-anchor="middle">按钮必须 disabled</text>

  <!-- error -->
  <rect x="250" y="250" width="150" height="76" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.5" rx="4"/>
  <text x="325" y="276" font-weight="bold" fill="#c92a2a" font-size="13" text-anchor="middle">error</text>
  <text x="325" y="296" fill="#495057" font-size="11" text-anchor="middle">校验或请求失败</text>
  <text x="325" y="314" fill="#868e96" font-size="10" text-anchor="middle">数据保留，可重试</text>

  <!-- success -->
  <rect x="490" y="250" width="170" height="76" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
  <text x="575" y="276" font-weight="bold" fill="#2f9e44" font-size="13" text-anchor="middle">success</text>
  <text x="575" y="296" fill="#495057" font-size="11" text-anchor="middle">提交成功</text>
  <text x="575" y="314" fill="#868e96" font-size="10" text-anchor="middle">清空或跳转</text>
  <text x="575" y="344" fill="#868e96" font-size="10" text-anchor="middle">resetForm() 回到初始态</text>

  <!-- 箭头 idle → validating -->
  <line x1="180" y1="98" x2="242" y2="98" stroke="#1971c2" stroke-width="1.5"/>
  <polygon points="250,98 236,93 236,103" fill="#1971c2"/>
  <text x="215" y="88" font-size="10" fill="#1971c2" text-anchor="middle">点提交</text>

  <!-- 箭头 validating → submitting -->
  <line x1="400" y1="98" x2="482" y2="98" stroke="#2f9e44" stroke-width="1.5"/>
  <polygon points="490,98 476,93 476,103" fill="#2f9e44"/>
  <text x="441" y="88" font-size="10" fill="#2f9e44" text-anchor="middle">全部通过</text>

  <!-- 箭头 validating → error -->
  <line x1="325" y1="136" x2="325" y2="242" stroke="#c92a2a" stroke-width="1.5"/>
  <polygon points="325,250 319,236 331,236" fill="#c92a2a"/>
  <text x="335" y="180" font-size="10" fill="#c92a2a" text-anchor="start">有字段不合法</text>
  <text x="335" y="196" font-size="10" fill="#868e96" text-anchor="start">→ 定位第一个错误</text>

  <!-- 箭头 submitting → success -->
  <line x1="575" y1="136" x2="575" y2="242" stroke="#2f9e44" stroke-width="1.5"/>
  <polygon points="575,250 569,236 581,236" fill="#2f9e44"/>
  <text x="587" y="180" font-size="10" fill="#2f9e44" text-anchor="start">接口返回成功</text>

  <!-- 箭头 submitting → error -->
  <line x1="490" y1="122" x2="410" y2="240" stroke="#c92a2a" stroke-width="1.5"/>
  <polygon points="404,248 404,234 416,242" fill="#c92a2a"/>
  <text x="470" y="180" font-size="10" fill="#c92a2a" text-anchor="end">网络异常 / 接口报错</text>

  <!-- 箭头 error → idle：绕外圈回到起点 -->
  <line x1="325" y1="326" x2="325" y2="398" stroke="#e8590c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="325" y1="398" x2="105" y2="398" stroke="#e8590c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="105" y1="398" x2="105" y2="144" stroke="#e8590c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="105,136 99,150 111,150" fill="#e8590c"/>
  <text x="215" y="390" font-size="10" fill="#e8590c" text-anchor="middle">用户修改后重新提交</text>

  <!-- 底部说明 -->
  <text x="20" y="436" font-weight="bold" fill="#495057" font-size="12" text-anchor="start">三条硬性要求</text>
  <text x="20" y="456" fill="#c92a2a" font-size="11" text-anchor="start">① submitting 期间禁用提交按钮，防止连点发出多个请求</text>
  <text x="20" y="474" fill="#c92a2a" font-size="11" text-anchor="start">② 失败时不要 resetForm，保留用户填的数据方便重试</text>
  <text x="20" y="492" fill="#868e96" font-size="11" text-anchor="start">③ 成功后清空表单或跳转页面，不要停在 submitting 状态</text>
</svg>
