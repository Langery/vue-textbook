<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" font-family="system-ui,PingFang SC,sans-serif">
  <rect width="720" height="520" fill="#fafafa"/>
  <text x="360" y="30" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">重试策略：指数退避 + 只重试值得重试的错误</text>

  <!-- 左：判断 -->
  <rect x="20" y="50" width="330" height="290" fill="#fff" stroke="#adb5bd" stroke-width="1.5" rx="4"/>
  <text x="36" y="74" font-weight="bold" fill="#495057" font-size="13" text-anchor="start">① 先判断：这次错误该重试吗？</text>

  <rect x="34" y="86" width="302" height="46" fill="#f1f3f5" stroke="#dee2e6" stroke-width="1.5" rx="4"/>
  <text x="48" y="104" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="start">catch (err) {</text>
  <text x="48" y="122" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="start">  if (err.response) {</text>

  <rect x="34" y="140" width="302" height="60" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
  <text x="48" y="158" font-weight="bold" fill="#2f9e44" font-size="12" text-anchor="start">✓ 该重试：网络错误、5xx</text>
  <text x="48" y="176" font-size="11" fill="#495057" text-anchor="start">断网、超时、502/503 —— 稍后可能就好了</text>
  <text x="48" y="193" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#868e96" text-anchor="start">err.response == null || status &gt;= 500</text>

  <rect x="34" y="208" width="302" height="60" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5" rx="4"/>
  <text x="48" y="226" font-weight="bold" fill="#e8590c" font-size="12" text-anchor="start">✗ 不该重试：4xx 业务错误</text>
  <text x="48" y="244" font-size="11" fill="#495057" text-anchor="start">参数写错、没登录、没权限 —— 再发也一样</text>
  <text x="48" y="261" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#868e96" text-anchor="start">status &gt;= 400 &amp;&amp; status &lt; 500</text>

  <rect x="34" y="276" width="302" height="50" fill="#f1f3f5" stroke="#dee2e6" stroke-width="1.5" rx="4"/>
  <text x="48" y="294" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="start">  } else {</text>
  <text x="48" y="312" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="start">    throw err  // 直接抛给调用方</text>

  <!-- 右：重试循环 -->
  <rect x="370" y="50" width="330" height="290" fill="#fff" stroke="#1971c2" stroke-width="1.5" rx="4"/>
  <text x="386" y="74" font-weight="bold" fill="#1971c2" font-size="13" text-anchor="start">② 再执行：退避 + 计数 + 上限</text>

  <rect x="384" y="86" width="302" height="112" fill="#e7f3ff" stroke="#74c0fc" stroke-width="1.5" rx="4"/>
  <text x="398" y="104" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#1971c2" text-anchor="start">async function withRetry (fn, retries = 3) {</text>
  <text x="398" y="122" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#1971c2" text-anchor="start">  for (let i = 0; i &lt; retries; i++) {</text>
  <text x="398" y="140" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#1971c2" text-anchor="start">    try { return await fn() }</text>
  <text x="398" y="158" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#1971c2" text-anchor="start">    catch (e) {</text>
  <text x="398" y="176" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#1971c2" text-anchor="start">      if (!shouldRetry(e)) throw e</text>
  <text x="398" y="194" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#1971c2" text-anchor="start">      await sleep(1000 * 2 ** i)  // 退避</text>

  <!-- 退避时间轴 -->
  <text x="386" y="224" font-weight="bold" fill="#495057" font-size="12" text-anchor="start">③ 指数退避：每次失败多等一倍</text>

  <rect x="384" y="234" width="90" height="34" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5" rx="4"/>
  <text x="429" y="255" font-weight="bold" fill="#e8590c" font-size="13" text-anchor="middle">等 1 秒</text>
  <polygon points="482,251 472,246 472,256" fill="#adb5bd"/>
  <rect x="490" y="234" width="90" height="34" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5" rx="4"/>
  <text x="535" y="255" font-weight="bold" fill="#e8590c" font-size="13" text-anchor="middle">等 2 秒</text>
  <polygon points="588,251 578,246 578,256" fill="#adb5bd"/>
  <rect x="596" y="234" width="90" height="34" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5" rx="4"/>
  <text x="641" y="255" font-weight="bold" fill="#e8590c" font-size="13" text-anchor="middle">等 4 秒</text>

  <text x="386" y="290" font-size="11" fill="#495057" text-anchor="start">④ 超过次数上限就放弃，抛出最后一次错误</text>
  <text x="386" y="308" font-size="11" fill="#868e96" text-anchor="start">重试 3 次 = 最多请求 4 次，第 4 次失败才算彻底失败</text>
  <text x="386" y="326" font-size="11" fill="#868e96" text-anchor="start">写请求的接口用重试，提交订单这种 POST 要慎用</text>

  <!-- 底部 -->
  <rect x="20" y="356" width="680" height="148" fill="#fff" stroke="#adb5bd" stroke-width="1.5" rx="4"/>
  <text x="360" y="378" font-weight="bold" fill="#495057" font-size="13" text-anchor="middle">重试的三条纪律</text>

  <rect x="34" y="390" width="212" height="98" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
  <text x="48" y="410" font-weight="bold" fill="#2f9e44" font-size="12" text-anchor="start">退避要够久</text>
  <text x="48" y="430" font-size="11" fill="#495057" text-anchor="start">不能固定等 1 秒就重发</text>
  <text x="48" y="448" font-size="11" fill="#495057" text-anchor="start">要翻倍，避开后端高峰</text>
  <text x="48" y="470" font-size="11" fill="#868e96" text-anchor="start">1s → 2s → 4s → 8s</text>

  <rect x="254" y="390" width="212" height="98" fill="#e7f3ff" stroke="#1971c2" stroke-width="1.5" rx="4"/>
  <text x="268" y="410" font-weight="bold" fill="#1971c2" font-size="12" text-anchor="start">次数要有上限</text>
  <text x="268" y="430" font-size="11" fill="#495057" text-anchor="start">无限重试会把后端压垮</text>
  <text x="268" y="448" font-size="11" fill="#495057" text-anchor="start">一般 3 次就够</text>
  <text x="268" y="470" font-size="11" fill="#868e96" text-anchor="start">超过就交给用户手动重试</text>

  <rect x="474" y="390" width="212" height="98" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5" rx="4"/>
  <text x="488" y="410" font-weight="bold" fill="#e8590c" font-size="12" text-anchor="start">只重试该重试的</text>
  <text x="488" y="430" font-size="11" fill="#495057" text-anchor="start">4xx 重试一万次也是错</text>
  <text x="488" y="448" font-size="11" fill="#495057" text-anchor="start">直接提示用户更快</text>
  <text x="488" y="470" font-size="11" fill="#868e96" text-anchor="start">401 直接跳登录页</text>
</svg>
