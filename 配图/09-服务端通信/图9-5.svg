<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" font-family="system-ui,PingFang SC,sans-serif">
  <rect width="720" height="560" fill="#fafafa"/>
  <text x="360" y="30" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">错误分类处理树：先看 error.response，再看状态码</text>

  <!-- catch -->
  <rect x="255" y="48" width="210" height="40" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.5" rx="4"/>
  <text x="360" y="66" font-size="12" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="middle">catch (err)</text>
  <text x="360" y="82" font-size="11" fill="#868e96" text-anchor="middle">捕获到错误对象</text>
  <line x1="360" y1="88" x2="360" y2="98" stroke="#adb5bd" stroke-width="1.5"/>
  <polygon points="360,104 353,93 367,93" fill="#adb5bd"/>

  <!-- 判断 -->
  <rect x="245" y="104" width="230" height="48" fill="#e7f3ff" stroke="#1971c2" stroke-width="1.5" rx="4"/>
  <text x="360" y="124" font-weight="bold" fill="#1971c2" font-size="13" text-anchor="middle">error.response 存在吗？</text>
  <text x="360" y="142" font-size="11" fill="#868e96" text-anchor="middle">服务器到底有没有回话</text>

  <!-- 分叉线 -->
  <line x1="360" y1="152" x2="360" y2="170" stroke="#adb5bd" stroke-width="1.5"/>
  <line x1="172" y1="170" x2="547" y2="170" stroke="#adb5bd" stroke-width="1.5"/>
  <line x1="172" y1="170" x2="172" y2="190" stroke="#adb5bd" stroke-width="1.5"/>
  <line x1="547" y1="170" x2="547" y2="190" stroke="#adb5bd" stroke-width="1.5"/>
  <text x="186" y="182" font-weight="bold" fill="#2f9e44" font-size="11" text-anchor="start">有</text>
  <text x="558" y="182" font-weight="bold" fill="#e8590c" font-size="11" text-anchor="start">无</text>

  <!-- 两个分支 -->
  <rect x="20" y="190" width="305" height="50" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
  <text x="172" y="212" font-weight="bold" fill="#2f9e44" font-size="13" text-anchor="middle">有 error.response</text>
  <text x="172" y="230" font-size="11" fill="#495057" text-anchor="middle">服务器回了，但状态码不是 2xx</text>

  <rect x="395" y="190" width="305" height="50" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5" rx="4"/>
  <text x="547" y="212" font-weight="bold" fill="#e8590c" font-size="13" text-anchor="middle">无 error.response</text>
  <text x="547" y="230" font-size="11" fill="#495057" text-anchor="middle">请求没到服务器：网络层失败</text>

  <!-- 再分叉 -->
  <line x1="172" y1="240" x2="172" y2="256" stroke="#adb5bd" stroke-width="1.5"/>
  <line x1="97" y1="256" x2="263" y2="256" stroke="#adb5bd" stroke-width="1.5"/>
  <line x1="97" y1="256" x2="97" y2="266" stroke="#adb5bd" stroke-width="1.5"/>
  <line x1="263" y1="256" x2="263" y2="266" stroke="#adb5bd" stroke-width="1.5"/>
  <polygon points="97,272 90,261 104,261" fill="#adb5bd"/>
  <polygon points="263,272 256,261 270,261" fill="#adb5bd"/>

  <line x1="547" y1="240" x2="547" y2="256" stroke="#adb5bd" stroke-width="1.5"/>
  <line x1="459" y1="256" x2="624" y2="256" stroke="#adb5bd" stroke-width="1.5"/>
  <line x1="459" y1="256" x2="459" y2="266" stroke="#adb5bd" stroke-width="1.5"/>
  <line x1="624" y1="256" x2="624" y2="266" stroke="#adb5bd" stroke-width="1.5"/>
  <polygon points="459,272 452,261 466,261" fill="#adb5bd"/>
  <polygon points="624,272 617,261 631,261" fill="#adb5bd"/>

  <!-- 四种错误 -->
  <rect x="20" y="272" width="155" height="50" fill="#fff" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
  <text x="97" y="294" font-weight="bold" fill="#2f9e44" font-size="13" text-anchor="middle">4xx</text>
  <text x="97" y="312" font-size="11" fill="#495057" text-anchor="middle">401 / 403 / 404</text>

  <rect x="190" y="272" width="147" height="50" fill="#fff" stroke="#e8590c" stroke-width="1.5" rx="4"/>
  <text x="263" y="294" font-weight="bold" fill="#e8590c" font-size="13" text-anchor="middle">5xx</text>
  <text x="263" y="312" font-size="11" fill="#495057" text-anchor="middle">500 / 502 / 503</text>

  <rect x="383" y="272" width="152" height="50" fill="#fff" stroke="#e8590c" stroke-width="1.5" rx="4"/>
  <text x="459" y="294" font-weight="bold" fill="#e8590c" font-size="13" text-anchor="middle">断网 / 超时</text>
  <text x="459" y="312" font-size="11" fill="#495057" text-anchor="middle">ERR_NETWORK</text>

  <rect x="548" y="272" width="152" height="50" fill="#fff" stroke="#495057" stroke-width="1.5" rx="4"/>
  <text x="624" y="294" font-weight="bold" fill="#495057" font-size="13" text-anchor="middle">被取消</text>
  <text x="624" y="312" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="middle">CanceledError</text>

  <!-- 处理策略表 -->
  <text x="360" y="342" font-weight="bold" fill="#495057" font-size="13" text-anchor="middle">四种错误分别怎么处理</text>

  <rect x="20" y="352" width="680" height="28" fill="#e7f3ff" stroke="#1971c2" stroke-width="1.5" rx="4"/>
  <text x="32" y="371" font-weight="bold" fill="#1971c2" font-size="12" text-anchor="start">场景</text>
  <text x="157" y="371" font-weight="bold" fill="#1971c2" font-size="12" text-anchor="start">状态码 / 特征</text>
  <text x="312" y="371" font-weight="bold" fill="#1971c2" font-size="12" text-anchor="start">怎么处理</text>
  <text x="592" y="371" font-weight="bold" fill="#1971c2" font-size="12" text-anchor="start">能否重试</text>

  <line x1="20" y1="380" x2="700" y2="380" stroke="#dee2e6" stroke-width="1.5"/>
  <text x="32" y="402" font-weight="bold" fill="#2f9e44" font-size="11" text-anchor="start">4xx 客户端错误</text>
  <text x="157" y="402" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="start">401 / 403 / 404</text>
  <text x="312" y="402" font-size="11" fill="#495057" text-anchor="start">401 清 token 跳登录；403 提示无权限</text>
  <text x="592" y="402" font-size="11" fill="#c92a2a" text-anchor="start">不重试</text>
  <line x1="20" y1="414" x2="700" y2="414" stroke="#dee2e6" stroke-width="1.5"/>

  <text x="32" y="436" font-weight="bold" fill="#e8590c" font-size="11" text-anchor="start">5xx 服务端错误</text>
  <text x="157" y="436" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="start">500 / 502 / 503</text>
  <text x="312" y="436" font-size="11" fill="#495057" text-anchor="start">提示系统繁忙，可退避后重试</text>
  <text x="592" y="436" font-size="11" fill="#2f9e44" text-anchor="start">可重试</text>
  <line x1="20" y1="448" x2="700" y2="448" stroke="#dee2e6" stroke-width="1.5"/>

  <text x="32" y="470" font-weight="bold" fill="#e8590c" font-size="11" text-anchor="start">断网 / 超时</text>
  <text x="157" y="470" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="start">ERR_NETWORK</text>
  <text x="312" y="470" font-size="11" fill="#495057" text-anchor="start">提示检查网络，允许重试</text>
  <text x="592" y="470" font-size="11" fill="#2f9e44" text-anchor="start">可重试</text>
  <line x1="20" y1="482" x2="700" y2="482" stroke="#dee2e6" stroke-width="1.5"/>

  <text x="32" y="504" font-weight="bold" fill="#495057" font-size="11" text-anchor="start">请求被取消</text>
  <text x="157" y="504" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="start">CanceledError</text>
  <text x="312" y="504" font-size="11" fill="#495057" text-anchor="start">静默忽略，不弹错误提示</text>
  <text x="592" y="504" font-size="11" fill="#868e96" text-anchor="start">不重试</text>
  <line x1="20" y1="516" x2="700" y2="516" stroke="#dee2e6" stroke-width="1.5"/>

  <!-- 底部 -->
  <text x="360" y="536" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#1971c2" text-anchor="middle">if (err.response) { /* 看状态码 */ } else { /* 网络层 */ }</text>
  <text x="360" y="552" font-size="11" fill="#868e96" text-anchor="middle">response 不存在 = 请求没发出去或没回来；存在 = 服务器回了但状态码非 2xx</text>
</svg>
