<text x="110" y="280" font-weight="bold" fill="#c92a2a" font-size="11" text-anchor="middle">:is 绑定值</text>

<text x="235" y="170" font-weight="bold" fill="#666" font-size="14" text-anchor="middle">→ 切换 →</text>

<!-- Screen showing active component -->
<rect x="310" y="55" width="380" height="260" fill="#fff" stroke="#333" stroke-width="1.5" rx="8"/>
<text x="500" y="82"  fill="#7048e8" font-size="12" text-anchor="middle">&lt;component :is=&quot;currentTab&quot; /&gt;</text>
<rect x="335" y="100" width="330" height="100" fill="#e7f3ff" stroke="#1971c2" rx="4"/>
<text x="500" y="135" font-weight="bold" fill="#1971c2" font-size="14" text-anchor="middle">当前激活：HomePage.vue</text>
<text x="500" y="155"  fill="#868e96" font-size="11" text-anchor="middle">其他组件被销毁/缓存</text>

<rect x="335" y="220" width="70" height="30" fill="#e7f3ff" stroke="#1971c2" stroke-width="1.5" rx="4"/>
