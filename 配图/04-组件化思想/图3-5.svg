<rect x="55" y="176" width="110" height="28" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5" rx="4"/>
<text x="110" y="195"  fill="#e8590c" font-size="11" text-anchor="middle">AV 信号</text>
<rect x="55" y="220" width="110" height="28" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.5" rx="4"/>
