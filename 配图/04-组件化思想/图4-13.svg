<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="system-ui,PingFang SC,sans-serif">
  <rect width="720" height="420" fill="#fafafa"/>
  <text x="360" y="30" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">一个 .vue 文件的三段结构与各自职责</text>

  <!-- 左侧：文件外观 -->
  <text x="20" y="58" font-weight="bold" fill="#1971c2" font-size="13" text-anchor="start">文件长这样</text>

  <rect x="20" y="70" width="300" height="300" fill="#fff" stroke="#dee2e6" stroke-width="1.5" rx="4"/>
  <rect x="20" y="70" width="300" height="30" fill="#e7f3ff" stroke="#dee2e6" stroke-width="1.5" rx="4"/>
  <text x="170" y="90" font-size="12" font-family="ui-monospace,Menlo,monospace" fill="#1971c2" text-anchor="middle">UserCard.vue</text>

  <rect x="20" y="100" width="300" height="90" fill="#e7f3ff" stroke="#dee2e6" stroke-width="1"/>
  <text x="34" y="122" font-size="12" font-family="ui-monospace,Menlo,monospace" fill="#1971c2" text-anchor="start">&lt;script setup&gt;</text>
  <text x="34" y="142" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="start">import { ref } from 'vue'</text>
  <text x="34" y="160" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="start">const props = defineProps(['user'])</text>
  <text x="34" y="178" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="start">const emit = defineEmits(['select'])</text>

  <rect x="20" y="190" width="300" height="90" fill="#f0f9e8" stroke="#dee2e6" stroke-width="1"/>
  <text x="34" y="212" font-size="12" font-family="ui-monospace,Menlo,monospace" fill="#2f9e44" text-anchor="start">&lt;template&gt;</text>
  <text x="34" y="232" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="start">&lt;div class="card"&gt;</text>
  <text x="34" y="250" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="start">  {{ user.name }}</text>
  <text x="34" y="268" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="start">&lt;/div&gt;</text>

  <rect x="20" y="280" width="300" height="90" fill="#fff4e6" stroke="#dee2e6" stroke-width="1"/>
  <text x="34" y="302" font-size="12" font-family="ui-monospace,Menlo,monospace" fill="#e8590c" text-anchor="start">&lt;style scoped&gt;</text>
  <text x="34" y="322" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="start">.card {</text>
  <text x="34" y="340" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="start">  padding: 12px;</text>
  <text x="34" y="358" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="start">}</text>

  <!-- 右侧：三段职责 -->
  <text x="350" y="58" font-weight="bold" fill="#1971c2" font-size="13" text-anchor="start">每一段负责什么</text>

  <rect x="350" y="70" width="350" height="90" fill="#e7f3ff" stroke="#1971c2" stroke-width="1.5" rx="4"/>
  <text x="366" y="94" font-weight="bold" fill="#1971c2" font-size="13" text-anchor="start">① &lt;script setup&gt; — 逻辑段</text>
  <text x="366" y="115" fill="#495057" font-size="11" text-anchor="start">导入、props / emits 声明</text>
  <text x="366" y="133" fill="#495057" font-size="11" text-anchor="start">响应式数据、计算属性、方法</text>
  <text x="366" y="151" fill="#868e96" font-size="11" text-anchor="start">不放 return，变量直接暴露给模板</text>

  <rect x="350" y="170" width="350" height="90" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
  <text x="366" y="194" font-weight="bold" fill="#2f9e44" font-size="13" text-anchor="start">② &lt;template&gt; — 结构段</text>
  <text x="366" y="215" fill="#495057" font-size="11" text-anchor="start">HTML + Vue 指令，决定长什么样</text>
  <text x="366" y="233" fill="#495057" font-size="11" text-anchor="start">v-if / v-for / v-model / 事件绑定</text>
  <text x="366" y="251" fill="#868e96" font-size="11" text-anchor="start">写死结构、没数据也能先摆出来</text>

  <rect x="350" y="270" width="350" height="100" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5" rx="4"/>
  <text x="366" y="294" font-weight="bold" fill="#e8590c" font-size="13" text-anchor="start">③ &lt;style scoped&gt; — 样式段</text>
  <text x="366" y="315" fill="#495057" font-size="11" text-anchor="start">普通 CSS，scoped 编译后加属性选择器</text>
  <text x="366" y="333" fill="#495057" font-size="11" text-anchor="start">只作用到当前组件，不污染全局</text>
  <text x="366" y="351" fill="#868e96" font-size="11" text-anchor="start">也能用 &lt;style&gt; 写全局样式</text>
  <text x="366" y="365" fill="#868e96" font-size="10" text-anchor="start">深度选择器要配合 :deep() 使用</text>

  <!-- 底部 -->
  <text x="360" y="398" font-weight="bold" fill="#495057" font-size="12" text-anchor="middle">三段都是可选的：纯展示组件可以只写 template，逻辑多时也不必拆文件</text>
</svg>
