<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="system-ui,PingFang SC,sans-serif">
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#666"/></marker></defs>
<rect width="720" height="380" fill="#fafafa"/>
<text x="360" y="30" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">受控组件 vs 非受控组件</text>

<!-- 受控 -->
<rect x="30" y="55" width="315" height="300" fill="#f0f9e8" stroke="#2f9e44" rx="6"/>
<text x="187" y="80" font-weight="bold" fill="#2f9e44" font-size="14" text-anchor="middle">受控组件 (Controlled)</text>
<rect x="55" y="95" width="120" height="40" fill="#d8f5cc" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
<text x="115" y="120" font-weight="bold" fill="#2f9e44" font-size="14" text-anchor="middle">父组件</text>
<rect x="220" y="200" width="100" height="40" fill="#fff" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
<text x="270" y="220" font-weight="bold" fill="#2f9e44" font-size="13" text-anchor="middle">子组件</text>
<text x="270" y="238"  fill="#999" font-size="10" text-anchor="middle">(无内部状态)</text>
<line x1="175" y1="115" x2="220" y2="205" stroke="#2f9e44" stroke-width="2" marker-end="url(#arrowhead)"/>
<text x="240" y="150"  fill="#2f9e44" font-size="10" text-anchor="middle">Props ↓</text>
<text x="240" y="168"  fill="#2f9e44" font-size="9" text-anchor="middle">数据</text>
<line x1="270" y1="240" x2="180" y2="255" stroke="#2f9e44" stroke-width="2" marker-end="url(#arrowhead)"/>
<text x="220" y="275"  fill="#2f9e44" font-size="10" text-anchor="middle">Emit ↑</text>
<text x="220" y="293"  fill="#2f9e44" font-size="9" text-anchor="middle">事件</text>
<text x="187" y="335"  fill="#495057" font-size="11" text-anchor="middle">数据在父组件，子组件只负责展示</text>

<!-- 分隔 -->
<line x1="360" y1="55" x2="360" y2="355" stroke="#dee2e6" stroke-width="1.5" stroke-dasharray="5,5"/>

<!-- 非受控 -->
<rect x="375" y="55" width="315" height="300" fill="#fff4e6" stroke="#e8590c" rx="6"/>
<text x="532" y="80" font-weight="bold" fill="#e8590c" font-size="14" text-anchor="middle">非受控组件 (Uncontrolled)</text>
<rect x="400" y="200" width="100" height="40" fill="#fff3e0" stroke="#e8590c" stroke-width="1.5" rx="4"/>
<text x="450" y="220" font-weight="bold" fill="#e8590c" font-size="13" text-anchor="middle">子组件</text>
<text x="450" y="238"  fill="#999" font-size="10" text-anchor="middle">(自带状态)</text>
<rect x="400" y="270" width="100" height="40" fill="#fff3e0" stroke="#e8590c" stroke-width="1.5" rx="4"/>
<text x="450" y="295" font-weight="bold" fill="#e8590c" font-size="13" text-anchor="middle">ref()</text>
<text x="450" y="315"  fill="#999" font-size="10" text-anchor="middle">内部数据</text>
<line x1="450" y1="240" x2="450" y2="265" stroke="#e8590c" stroke-width="2" marker-end="url(#arrowhead)"/>
<rect x="545" y="95" width="120" height="40" fill="#fff3e0" stroke="#e8590c" stroke-width="1.5" rx="4"/>
<text x="605" y="120" font-weight="bold" fill="#e8590c" font-size="14" text-anchor="middle">父组件</text>
<line x1="605" y1="140" x2="500" y2="195" stroke="#e8590c" stroke-width="2" marker-end="url(#arrowhead)"/>
<text x="585" y="175"  fill="#e8590c" font-size="10" text-anchor="middle">ref 引用</text>
<text x="532" y="335"  fill="#495057" font-size="11" text-anchor="middle">数据在子组件，父组件不关心内部实现</text>

</svg>