<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" font-family="system-ui,PingFang SC,sans-serif">
  <rect width="720" height="480" fill="#fafafa"/>
  <text x="360" y="30" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">Pinia Setup Store vs Vuex：结构对比</text>

  <!-- 左：Vuex -->
  <rect x="20" y="46" width="330" height="336" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.5" rx="4"/>
  <text x="185" y="70" font-weight="bold" fill="#495057" font-size="14" text-anchor="middle">Vuex 4：一个 store 拆成五块</text>

  <rect x="36" y="84" width="298" height="46" fill="#fff" stroke="#dee2e6" stroke-width="1.5" rx="4"/>
  <text x="52" y="103" font-weight="bold" fill="#1971c2" font-size="12">state</text>
  <text x="52" y="121" fill="#495057" font-size="11">存数据的对象</text>
  <text x="318" y="103" fill="#868e96" font-size="11" text-anchor="end">.js</text>
  <text x="318" y="121" fill="#868e96" font-size="11" text-anchor="end">state.js</text>

  <rect x="36" y="136" width="298" height="46" fill="#fff" stroke="#dee2e6" stroke-width="1.5" rx="4"/>
  <text x="52" y="155" font-weight="bold" fill="#1971c2" font-size="12">getters</text>
  <text x="52" y="173" fill="#495057" font-size="11">派生计算值</text>
  <text x="318" y="173" fill="#868e96" font-size="11" text-anchor="end">getters.js</text>

  <rect x="36" y="188" width="298" height="46" fill="#fff" stroke="#dee2e6" stroke-width="1.5" rx="4"/>
  <text x="52" y="207" font-weight="bold" fill="#e8590c" font-size="12">mutations</text>
  <text x="52" y="225" fill="#495057" font-size="11">唯一改 state 的入口</text>
  <text x="318" y="225" fill="#868e96" font-size="11" text-anchor="end">mutations.js</text>

  <rect x="36" y="240" width="298" height="46" fill="#fff" stroke="#dee2e6" stroke-width="1.5" rx="4"/>
  <text x="52" y="259" font-weight="bold" fill="#e8590c" font-size="12">actions</text>
  <text x="52" y="277" fill="#495057" font-size="11">异步逻辑与副作用</text>
  <text x="318" y="277" fill="#868e96" font-size="11" text-anchor="end">actions.js</text>

  <rect x="36" y="292" width="298" height="46" fill="#fff" stroke="#dee2e6" stroke-width="1.5" rx="4"/>
  <text x="52" y="311" font-weight="bold" fill="#1971c2" font-size="12">modules</text>
  <text x="52" y="329" fill="#495057" font-size="11">大项目再拆子模块</text>
  <text x="318" y="329" fill="#868e96" font-size="11" text-anchor="end">modules/*.js</text>

  <text x="185" y="356" font-weight="bold" fill="#c92a2a" font-size="11" text-anchor="middle">文件多、样板多，this.$store 满天飞</text>
  <text x="185" y="372" font-weight="bold" fill="#c92a2a" font-size="11" text-anchor="middle">改个字段要在五个文件之间来回跳</text>

  <!-- 右：Pinia -->
  <rect x="370" y="46" width="330" height="336" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
  <text x="535" y="70" font-weight="bold" fill="#2f9e44" font-size="14" text-anchor="middle">Pinia Setup Store：一个文件写完</text>

  <rect x="386" y="84" width="298" height="176" fill="#fff" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
  <text x="400" y="104" font-weight="bold" fill="#2f9e44" font-size="12">stores/cart.js</text>
  <text x="400" y="126" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#1971c2">export const useCartStore =</text>
  <text x="400" y="142" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#1971c2">  defineStore('cart', () =&gt; {</text>
  <text x="400" y="162" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#2f9e44">  const items = ref([])</text>
  <text x="400" y="178" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#868e96">  // state：普通 ref</text>
  <text x="400" y="198" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#e8590c">  const total = computed(...)</text>
  <text x="400" y="214" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#868e96">  // getter：computed</text>
  <text x="400" y="234" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#c92a2a">  function add(id) {...}</text>
  <text x="400" y="250" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#868e96">  // action：普通函数</text>

  <rect x="386" y="272" width="298" height="46" fill="#d8f5cc" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
  <text x="400" y="291" font-weight="bold" fill="#2f9e44" font-size="12">return { items, total, add }</text>
  <text x="400" y="309" fill="#495057" font-size="11">写在最后，导出什么由你决定</text>

  <text x="535" y="336" font-weight="bold" fill="#2f9e44" font-size="11" text-anchor="middle">没有 mutations，没有 module 嵌套</text>
  <text x="535" y="356" font-weight="bold" fill="#2f9e44" font-size="11" text-anchor="middle">函数内部直接赋值即可改 state</text>
  <text x="535" y="372" font-weight="bold" fill="#c92a2a" font-size="11" text-anchor="middle">代价：DevTools 时间旅行不再可用</text>

  <!-- 底部对照 -->
  <rect x="20" y="394" width="680" height="76" fill="#fff" stroke="#dee2e6" stroke-width="1.5" rx="4"/>
  <text x="360" y="416" font-weight="bold" fill="#495057" font-size="13" text-anchor="middle">一句话记住两种心智模型</text>
  <text x="185" y="440" font-weight="bold" fill="#495057" font-size="12" text-anchor="middle">Vuex：改数据 = 走完两个流程</text>
  <text x="185" y="460" fill="#868e96" font-size="11" text-anchor="middle">dispatch(action) → commit(mutation)</text>
  <text x="535" y="440" font-weight="bold" fill="#2f9e44" font-size="12" text-anchor="middle">Pinia：改数据 = 调一个函数</text>
  <text x="535" y="460" fill="#868e96" font-size="11" text-anchor="middle">cart.add(id)，和调普通方法一样</text>
</svg>
