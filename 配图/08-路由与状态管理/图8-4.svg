<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" font-family="system-ui,PingFang SC,sans-serif">
  <rect width="720" height="450" fill="#fafafa"/>
  <text x="360" y="30" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">嵌套路由：子组件渲染在父组件的 &lt;router-view&gt; 里</text>

  <!-- 外层：父组件布局 -->
  <rect x="30" y="48" width="660" height="248" fill="#e7f3ff" stroke="#1971c2" stroke-width="2" rx="4"/>
  <text x="50" y="72" font-weight="bold" fill="#1971c2" font-size="13">Layout.vue — 父路由组件</text>
  <text x="670" y="72" fill="#1971c2" font-size="11" text-anchor="end">外层 &lt;router-view&gt; 写在 Layout 里</text>

  <!-- 父组件的公共区域 -->
  <rect x="46" y="84" width="628" height="30" fill="#cce5ff" stroke="#1971c2" stroke-width="1.5" rx="4"/>
  <text x="360" y="104" fill="#1971c2" font-size="12" text-anchor="middle">公共布局：顶部导航 + 侧边栏（切换子路由时不销毁、不重建）</text>

  <!-- 中层：子组件 -->
  <rect x="62" y="126" width="596" height="156" fill="#fff" stroke="#1971c2" stroke-width="1.5" rx="4"/>
  <text x="78" y="148" font-weight="bold" fill="#1971c2" font-size="12">GoodsDetail.vue — 子路由组件</text>
  <text x="642" y="148" fill="#868e96" font-size="11" text-anchor="end">/goods/:id</text>

  <!-- 内层：孙组件 -->
  <rect x="94" y="160" width="532" height="104" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
  <text x="110" y="182" font-weight="bold" fill="#2f9e44" font-size="12">Reviews.vue — 孙路由组件</text>
  <text x="610" y="182" fill="#868e96" font-size="11" text-anchor="end">/goods/:id/reviews</text>
  <text x="110" y="208" fill="#495057" font-size="11">每个子组件模板里要再写一个 &lt;router-view&gt;，子路由才有地方渲染</text>
  <text x="110" y="232" fill="#495057" font-size="11">子路径写在 children 里，不带开头斜杠，以父路径为前缀</text>
  <text x="110" y="254" fill="#495057" font-size="11">路径层级 ↔ outlet 嵌套层级一一对应，缺一层就渲染不出来</text>

  <!-- 底部要点 -->
  <rect x="30" y="308" width="325" height="128" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
  <text x="192" y="332" font-weight="bold" fill="#2f9e44" font-size="13" text-anchor="middle">三条硬规则</text>
  <text x="192" y="358" fill="#495057" font-size="12" text-anchor="middle">父组件要有 &lt;router-view&gt;</text>
  <text x="192" y="382" fill="#495057" font-size="12" text-anchor="middle">子路径写在 children 里</text>
  <text x="192" y="406" fill="#495057" font-size="12" text-anchor="middle">子路径不带开头斜杠</text>
  <text x="192" y="428" fill="#2f9e44" font-size="11" text-anchor="middle">少写一层 → 子页面一片空白</text>

  <rect x="365" y="308" width="325" height="128" fill="#fff" stroke="#e8590c" stroke-width="1.5" rx="4"/>
  <text x="527" y="332" font-weight="bold" fill="#e8590c" font-size="13" text-anchor="middle">为什么要有嵌套</text>
  <text x="527" y="358" fill="#495057" font-size="12" text-anchor="middle">父级 UI 只渲染一次</text>
  <text x="527" y="382" fill="#495057" font-size="12" text-anchor="middle">侧边栏不必跟着重绘</text>
  <text x="527" y="406" fill="#495057" font-size="12" text-anchor="middle">详情 / 评价 / 规格各占一层</text>
  <text x="527" y="428" fill="#e8590c" font-size="11" text-anchor="middle">路径层级 ↔ 界面层级对应</text>
</svg>
