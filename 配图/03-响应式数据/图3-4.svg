<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="system-ui,PingFang SC,sans-serif">
  <rect width="720" height="360" fill="#fafafa"/>
  <text x="360" y="30" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">不可变原则：改属性还是换对象，结局完全不同</text>

  <!-- 左：改属性 -->
  <rect x="20" y="50" width="330" height="230" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
  <text x="185" y="76" font-weight="bold" fill="#2f9e44" font-size="14" text-anchor="middle">改属性 ✅ 响应式保持</text>

  <rect x="36" y="90" width="298" height="36" fill="#d8f5cc" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
  <text x="50" y="112" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#2f9e44" text-anchor="start">state.count = 1</text>

  <rect x="36" y="132" width="298" height="36" fill="#d8f5cc" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
  <text x="50" y="154" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#2f9e44" text-anchor="start">Object.assign(state, newData)</text>

  <text x="36" y="194" fill="#495057" font-size="12" text-anchor="start">代理的还是同一个对象，引用没变</text>
  <text x="36" y="214" fill="#495057" font-size="12" text-anchor="start">Proxy 依然拦得到这次修改</text>
  <text x="36" y="234" fill="#2f9e44" font-size="12" text-anchor="start" font-weight="bold">页面正常更新 ✅</text>

  <rect x="36" y="248" width="298" height="20" fill="#fff" stroke="#dee2e6" stroke-width="1" rx="4"/>
  <text x="185" y="262" font-size="10" fill="#868e96" text-anchor="middle">同一条数据通路，依赖表始终有效</text>

  <!-- 右：换整个对象 -->
  <rect x="370" y="50" width="330" height="230" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.5" rx="4"/>
  <text x="535" y="76" font-weight="bold" fill="#c92a2a" font-size="14" text-anchor="middle">换整个对象 ❌ 断开 Proxy</text>

  <rect x="386" y="90" width="298" height="36" fill="#ffe3e3" stroke="#e03131" stroke-width="1.5" rx="4"/>
  <text x="400" y="112" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#c92a2a" text-anchor="start">state = { count: 1 }</text>

  <rect x="386" y="132" width="298" height="36" fill="#fff" stroke="#dee2e6" stroke-width="1.5" rx="4"/>
  <text x="400" y="154" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#2f9e44" text-anchor="start">state.value = { count: 1 }  // ref 可以</text>

  <text x="386" y="194" fill="#495057" font-size="12" text-anchor="start">变量指向了新对象，模板还握着旧的</text>
  <text x="386" y="214" fill="#495057" font-size="12" text-anchor="start">Proxy 代理的是旧引用，改多少都没用</text>
  <text x="386" y="234" fill="#c92a2a" font-size="12" text-anchor="start" font-weight="bold">页面永远不更新 ❌</text>

  <rect x="386" y="248" width="298" height="20" fill="#fff" stroke="#dee2e6" stroke-width="1" rx="4"/>
  <text x="535" y="262" font-size="10" fill="#868e96" text-anchor="middle">ref 整体替换 .value 是安全的，reactive 不是</text>

  <!-- 底部 -->
  <rect x="20" y="296" width="680" height="30" fill="#fff" stroke="#dee2e6" stroke-width="1.5" rx="4"/>
  <text x="360" y="316" font-weight="bold" fill="#495057" font-size="12" text-anchor="middle">铁律：reactive 对象只改属性、不换引用；ref 可以整体替换 .value</text>

  <text x="360" y="344" fill="#868e96" font-size="11" text-anchor="middle">原因：模板绑定的是 Proxy 的引用，换掉引用就等于换掉了被代理的那一个</text>
</svg>
