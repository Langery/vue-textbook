<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="system-ui,PingFang SC,sans-serif">
<rect width="720" height="400" fill="#fafafa"/>
<text x="360" y="30" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">watchEffect 的执行时机：何时跑、何时清理</text>

<!-- 时间轴 -->
<line x1="60" y1="150" x2="665" y2="150" stroke="#adb5bd" stroke-width="2"/>
<polygon points="675,150 663,144 663,156" fill="#adb5bd"/>
<text x="40" y="155" fill="#868e96" font-size="11" text-anchor="middle">时间</text>

<!-- 阶段 1：组件创建 -->
<circle cx="110" cy="150" r="11" fill="#1971c2"/>
<circle cx="110" cy="150" r="4" fill="#fff"/>
<text x="110" y="90" font-weight="bold" fill="#1971c2" font-size="13" text-anchor="middle">组件创建</text>
<text x="110" y="110" fill="#868e96" font-size="11" text-anchor="middle">setup() 执行</text>
<rect x="45" y="185" width="130" height="52" fill="#e7f3ff" stroke="#1971c2" stroke-width="1.5" rx="4"/>
<text x="110" y="206" font-weight="bold" fill="#1971c2" font-size="12" text-anchor="middle">① 立即执行一次</text>
<text x="110" y="225" fill="#495057" font-size="11" text-anchor="middle">收集依赖</text>
<line x1="110" y1="163" x2="110" y2="183" stroke="#1971c2" stroke-width="1.5"/>

<!-- 阶段 2：挂载 -->
<circle cx="280" cy="150" r="11" fill="#adb5bd"/>
<circle cx="280" cy="150" r="4" fill="#fff"/>
<text x="280" y="90" font-weight="bold" fill="#495057" font-size="13" text-anchor="middle">挂载完成</text>
<text x="280" y="110" fill="#868e96" font-size="11" text-anchor="middle">onMounted</text>
<rect x="215" y="185" width="130" height="52" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.5" rx="4"/>
<text x="280" y="206" font-weight="bold" fill="#495057" font-size="12" text-anchor="middle">不会重新执行</text>
<text x="280" y="225" fill="#868e96" font-size="11" text-anchor="middle">除非依赖变了</text>
<line x1="280" y1="163" x2="280" y2="183" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="4 3"/>

<!-- 阶段 3：数据变化 -->
<circle cx="450" cy="150" r="11" fill="#e8590c"/>
<circle cx="450" cy="150" r="4" fill="#fff"/>
<text x="450" y="90" font-weight="bold" fill="#e8590c" font-size="13" text-anchor="middle">数据变化</text>
<text x="450" y="110" fill="#868e96" font-size="11" text-anchor="middle">count.value++</text>
<rect x="370" y="185" width="160" height="52" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5" rx="4"/>
<text x="450" y="206" font-weight="bold" fill="#e8590c" font-size="12" text-anchor="middle">② 重跑 + 重新收集</text>
<text x="450" y="225" fill="#495057" font-size="11" text-anchor="middle">默认是异步批处理</text>
<line x1="450" y1="163" x2="450" y2="183" stroke="#e8590c" stroke-width="1.5"/>

<!-- 阶段 4：卸载 -->
<circle cx="620" cy="150" r="11" fill="#c92a2a"/>
<circle cx="620" cy="150" r="4" fill="#fff"/>
<text x="620" y="90" font-weight="bold" fill="#c92a2a" font-size="13" text-anchor="middle">组件卸载</text>
<text x="620" y="110" fill="#868e96" font-size="11" text-anchor="middle">onUnmounted</text>
<rect x="545" y="185" width="150" height="52" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.5" rx="4"/>
<text x="620" y="206" font-weight="bold" fill="#c92a2a" font-size="12" text-anchor="middle">③ 自动停止</text>
<text x="620" y="225" fill="#495057" font-size="11" text-anchor="middle">清理函数先跑一次</text>
<line x1="620" y1="163" x2="620" y2="183" stroke="#c92a2a" stroke-width="1.5"/>

<!-- 底部对比 -->
<rect x="20" y="265" width="330" height="115" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
<text x="185" y="290" font-weight="bold" fill="#2f9e44" font-size="13" text-anchor="middle">watchEffect（默认）</text>
<text x="185" y="315" fill="#495057" font-size="12" text-anchor="middle">创建时立刻跑一次</text>
<text x="185" y="338" fill="#495057" font-size="12" text-anchor="middle">依赖变化后重跑</text>
<text x="185" y="365" font-weight="bold" fill="#2f9e44" font-size="11" text-anchor="middle">即时响应，不用记「要不要先手动跑一次」</text>

<rect x="370" y="265" width="330" height="115" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.5" rx="4"/>
<text x="535" y="290" font-weight="bold" fill="#495057" font-size="13" text-anchor="middle">watch（默认）</text>
<text x="535" y="315" fill="#495057" font-size="12" text-anchor="middle">创建时不跑（惰性）</text>
<text x="535" y="338" fill="#495057" font-size="12" text-anchor="middle">依赖变化后才跑</text>
<text x="535" y="365" font-weight="bold" fill="#e8590c" font-size="11" text-anchor="middle">想首屏就跑，得写 immediate: true</text>
</svg>