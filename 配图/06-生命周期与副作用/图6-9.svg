<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="system-ui,PingFang SC,sans-serif">
<rect width="720" height="420" fill="#fafafa"/>
<text x="360" y="30" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">什么时候不该用 watch</text>

<!-- 上半：应该用 -->
<rect x="20" y="48" width="680" height="160" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
<text x="360" y="72" font-weight="bold" fill="#2f9e44" font-size="14" text-anchor="middle">✓ 该用 watch：状态变化必须驱动「外部世界」</text>

<rect x="40" y="86" width="200" height="42" fill="#fff" stroke="#a9e095" stroke-width="1.5" rx="4"/>
<text x="140" y="104" font-weight="bold" fill="#2f9e44" font-size="12" text-anchor="middle">数据 → 网络请求</text>
<text x="140" y="121" fill="#495057" font-size="11" text-anchor="middle">筛选条件变，重新拉列表</text>

<rect x="260" y="86" width="200" height="42" fill="#fff" stroke="#a9e095" stroke-width="1.5" rx="4"/>
<text x="360" y="104" font-weight="bold" fill="#2f9e44" font-size="12" text-anchor="middle">数据 → DOM / 第三方库</text>
<text x="360" y="121" fill="#495057" font-size="11" text-anchor="middle">图表、地图、编辑器初始化</text>

<rect x="480" y="86" width="200" height="42" fill="#fff" stroke="#a9e095" stroke-width="1.5" rx="4"/>
<text x="580" y="104" font-weight="bold" fill="#2f9e44" font-size="12" text-anchor="middle">数据 → 本地存储 / URL</text>
<text x="580" y="121" fill="#495057" font-size="11" text-anchor="middle">草稿自动保存、同步查询串</text>

<rect x="40" y="138" width="640" height="58" fill="#d8f5cc" stroke="#a9e095" stroke-width="1.5" rx="4"/>
<text x="360" y="162" font-weight="bold" fill="#2f9e44" font-size="12" text-anchor="middle">共同点：这次执行带来了「一个新值 / 新状态」到 Vue 管不到的地方</text>
<text x="360" y="183" fill="#495057" font-size="11" text-anchor="middle">服务器、浏览器存储、DOM、路由 —— 都靠 watch 帮你在依赖变化的那一刻同步过去</text>

<!-- 下半：不该用 -->
<rect x="20" y="222" width="680" height="178" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.5" rx="4"/>
<text x="360" y="246" font-weight="bold" fill="#c92a2a" font-size="14" text-anchor="middle">✕ 不该用 watch：这三类各有更好的写法</text>

<rect x="40" y="260" width="200" height="126" fill="#fff" stroke="#ffc9c9" stroke-width="1.5" rx="4"/>
<text x="140" y="282" font-weight="bold" fill="#c92a2a" font-size="12" text-anchor="middle">响应用户操作</text>
<text x="52" y="304" fill="#868e96" font-size="11" text-anchor="start">想改成：点击按钮时</text>
<text x="52" y="324" fill="#495057" font-size="11" text-anchor="start">重新拉数据</text>
<text x="52" y="352" fill="#868e96" font-size="11" text-anchor="start">→ 用 @click 直接调</text>
<text x="52" y="374" font-weight="bold" fill="#2f9e44" font-size="11" text-anchor="start">@click="load"</text>

<rect x="260" y="260" width="200" height="126" fill="#fff" stroke="#ffc9c9" stroke-width="1.5" rx="4"/>
<text x="360" y="282" font-weight="bold" fill="#c92a2a" font-size="12" text-anchor="middle">派生出一个新值</text>
<text x="272" y="304" fill="#868e96" font-size="11" text-anchor="start">想改成：总价、筛选结果</text>
<text x="272" y="324" fill="#495057" font-size="11" text-anchor="start">跟着源数据自动更新</text>
<text x="272" y="352" fill="#868e96" font-size="11" text-anchor="start">→ 用 computed（有缓存）</text>
<text x="272" y="374" font-weight="bold" fill="#2f9e44" font-size="11" text-anchor="start">computed(() =&gt; ...)</text>

<rect x="480" y="260" width="200" height="126" fill="#fff" stroke="#ffc9c9" stroke-width="1.5" rx="4"/>
<text x="580" y="282" font-weight="bold" fill="#c92a2a" font-size="12" text-anchor="middle">只是想要一份快照</text>
<text x="492" y="304" fill="#868e96" font-size="11" text-anchor="start">想改成：每次变化记一条日志</text>
<text x="492" y="324" fill="#495057" font-size="11" text-anchor="start">或存进历史数组</text>
<text x="492" y="352" fill="#868e96" font-size="11" text-anchor="start">→ watchEffect 更短，不用写源</text>
<text x="492" y="374" font-weight="bold" fill="#2f9e44" font-size="11" text-anchor="start">watchEffect(() =&gt; ...)</text>
</svg>