<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="system-ui,PingFang SC,sans-serif">
<rect width="720" height="400" fill="#fafafa"/>
<text x="360" y="30" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">清理问题：忘记清理 vs onWatcherCleanup</text>

<!-- 左：忘记清理 -->
<rect x="20" y="52" width="330" height="270" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.5" rx="4"/>
<text x="185" y="78" font-weight="bold" fill="#c92a2a" font-size="14" text-anchor="middle">✕ 忘记清理</text>

<rect x="34" y="90" width="302" height="66" fill="#fff" stroke="#ffc9c9" stroke-width="1.5" rx="4"/>
<text x="46" y="110" fill="#495057" font-size="11" font-family="ui-monospace,Menlo,monospace" text-anchor="start">watchEffect(() =&gt; {</text>
<text x="46" y="128" fill="#495057" font-size="11" font-family="ui-monospace,Menlo,monospace" text-anchor="start">  setInterval(poll, 1000)</text>
<text x="46" y="146" fill="#495057" font-size="11" font-family="ui-monospace,Menlo,monospace" text-anchor="start">})</text>

<text x="185" y="180" font-weight="bold" fill="#c92a2a" font-size="12" text-anchor="middle">count 变了 3 次</text>

<rect x="34" y="192" width="90" height="42" fill="#fff" stroke="#e03131" stroke-width="1.5" rx="4"/>
<text x="79" y="212" fill="#c92a2a" font-size="11" text-anchor="middle">timer①</text>
<text x="79" y="228" fill="#868e96" font-size="10" text-anchor="middle">运行中</text>
<rect x="132" y="192" width="90" height="42" fill="#fff" stroke="#e03131" stroke-width="1.5" rx="4"/>
<text x="177" y="212" fill="#c92a2a" font-size="11" text-anchor="middle">timer②</text>
<text x="177" y="228" fill="#868e96" font-size="10" text-anchor="middle">运行中</text>
<rect x="230" y="192" width="90" height="42" fill="#fff" stroke="#e03131" stroke-width="1.5" rx="4"/>
<text x="275" y="212" fill="#c92a2a" font-size="11" text-anchor="middle">timer③</text>
<text x="275" y="228" fill="#868e96" font-size="10" text-anchor="middle">运行中</text>

<text x="185" y="258" font-weight="bold" fill="#c92a2a" font-size="12" text-anchor="middle">3 个定时器同时在跑</text>
<text x="185" y="278" fill="#495057" font-size="11" text-anchor="middle">请求翻 3 倍，组件卸载后还在跑</text>
<rect x="34" y="288" width="302" height="22" fill="#ffe3e3" stroke="#ffc9c9" rx="4"/>
<text x="185" y="303" fill="#c92a2a" font-size="11" font-weight="bold" text-anchor="middle">内存泄漏 + 逻辑错乱</text>

<!-- 右：用 onWatcherCleanup -->
<rect x="370" y="52" width="330" height="270" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
<text x="535" y="78" font-weight="bold" fill="#2f9e44" font-size="14" text-anchor="middle">✓ onWatcherCleanup（Vue 3.5+）</text>

<rect x="384" y="90" width="302" height="82" fill="#fff" stroke="#a9e095" stroke-width="1.5" rx="4"/>
<text x="396" y="110" fill="#2f9e44" font-size="11" font-family="ui-monospace,Menlo,monospace" text-anchor="start">import { onWatcherCleanup } from 'vue'</text>
<text x="396" y="128" fill="#2f9e44" font-size="11" font-family="ui-monospace,Menlo,monospace" text-anchor="start">watchEffect(() =&gt; {</text>
<text x="396" y="146" fill="#2f9e44" font-size="11" font-family="ui-monospace,Menlo,monospace" text-anchor="start">  const t = setInterval(poll, 1000)</text>
<text x="396" y="164" fill="#2f9e44" font-size="11" font-family="ui-monospace,Menlo,monospace" text-anchor="start">  onWatcherCleanup(() =&gt; clearInterval(t))</text>

<text x="535" y="196" font-weight="bold" fill="#2f9e44" font-size="12" text-anchor="middle">count 又变了 3 次</text>

<rect x="384" y="208" width="302" height="42" fill="#d8f5cc" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
<text x="535" y="228" font-weight="bold" fill="#2f9e44" font-size="12" text-anchor="middle">始终只有 1 个 timer 在跑</text>
<text x="535" y="245" fill="#495057" font-size="11" text-anchor="middle">重跑前先执行上一次的清理函数</text>

<text x="535" y="276" fill="#495057" font-size="11" text-anchor="middle">旧 timer 被 clearInterval 后才创建新的</text>
<rect x="384" y="288" width="302" height="22" fill="#d8f5cc" stroke="#a9e095" rx="4"/>
<text x="535" y="303" fill="#2f9e44" font-size="11" font-weight="bold" text-anchor="middle">无泄漏 · 卸载时也会自动清理</text>

<!-- 底部：三种清理时机 -->
<rect x="20" y="335" width="680" height="50" fill="#fff" stroke="#adb5bd" stroke-width="1.5" rx="4"/>
<text x="360" y="356" font-weight="bold" fill="#333" font-size="12" text-anchor="middle">清理函数会在两个时机被调用</text>
<text x="360" y="376" fill="#495057" font-size="11" text-anchor="middle">① 每次重跑之前（自动）   ② 组件卸载 / 手动 stop 时（自动）</text>
</svg>