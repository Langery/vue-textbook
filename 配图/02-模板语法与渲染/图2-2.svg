<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="system-ui,PingFang SC,sans-serif">
<rect width="720" height="400" fill="#fafafa"/>
<text x="360" y="28" font-weight="bold" fill="#212529" font-size="17" text-anchor="middle">模板拆解：HTML 部分 vs Vue 指令部分</text>

<!-- 代码块 -->
<rect x="40" y="55" width="640" height="290" fill="#1e1e1e" rx="6"/>

<!-- 行号 + 代码 -->
<g font-family="monospace" font-size="12">
<text x="55" y="80" fill="#858585">1</text>
<text x="75" y="80" fill="#d4d4d4">&lt;</text><text x="83" y="80" fill="#4ec9b0">template</text><text x="143" y="80" fill="#d4d4d4">&gt;</text>

<text x="55" y="100" fill="#858585">2</text>
<text x="75" y="100" fill="#d4d4d4">  &lt;</text><text x="83" y="100" fill="#569cd6">div</text><text x="112" y="100" fill="#9cdcfe"> class</text><text x="157" y="100" fill="#d4d4d4">=</text><text x="167" y="100" fill="#ce9178">"card"</text><text x="212" y="100" fill="#d4d4d4">&gt;</text>

<text x="55" y="120" fill="#858585">3</text>
<text x="75" y="120" fill="#d4d4d4">    &lt;</text><text x="83" y="120" fill="#569cd6">h1</text><text x="112" y="120" fill="#d4d4d4">&gt;{{ </text><text x="138" y="120" fill="#4fc1ff">title</text><text x="178" y="120" fill="#d4d4d4"> }}&lt;/</text><text x="213" y="120" fill="#569cd6">h1</text><text x="242" y="120" fill="#d4d4d4">&gt;</text>

<text x="55" y="140" fill="#858585">4</text>
<text x="75" y="140" fill="#d4d4d4">    &lt;</text><text x="83" y="140" fill="#569cd6">button</text>
<text x="140" y="140" fill="#d4d4d4"> @</text><text x="153" y="140" fill="#4fc1ff">click</text><text x="192" y="140" fill="#d4d4d4">=</text><text x="201" y="140" fill="#ce9178">"handleClick"</text><text x="302" y="140" fill="#d4d4d4">&gt;</text>

<text x="55" y="160" fill="#858585">5</text>
<text x="75" y="160" fill="#d4d4d4">      点击 +{{ </text><text x="153" y="160" fill="#4fc1ff">count</text><text x="193" y="160" fill="#d4d4d4"> }} 次</text>

<text x="55" y="180" fill="#858585">6</text>
<text x="75" y="180" fill="#d4d4d4">    &lt;/</text><text x="98" y="180" fill="#569cd6">button</text><text x="148" y="180" fill="#d4d4d4">&gt;</text>

<text x="55" y="200" fill="#858585">7</text>
<text x="75" y="200" fill="#d4d4d4">    &lt;</text><text x="83" y="200" fill="#569cd6">p</text><text x="102" y="200" fill="#d4d4d4"> v-</text><text x="122" y="200" fill="#4fc1ff">if</text><text x="145" y="200" fill="#d4d4d4">=</text><text x="155" y="200" fill="#ce9178">"visible"</text><text x="222" y="200" fill="#d4d4d4">&gt;显示&lt;/</text><text x="287" y="200" fill="#569cd6">p</text><text x="302" y="200" fill="#d4d4d4">&gt;</text>

<text x="55" y="220" fill="#858585">8</text>
<text x="75" y="220" fill="#d4d4d4">  &lt;/</text><text x="98" y="220" fill="#569cd6">div</text><text x="125" y="220" fill="#d4d4d4">&gt;</text>

<text x="55" y="240" fill="#858585">9</text>
<text x="75" y="240" fill="#d4d4d4">&lt;/</text><text x="92" y="240" fill="#4ec9b0">template</text><text x="155" y="240" fill="#d4d4d4">&gt;</text>
</g>

<!-- 注解框（HTML 部分 浅蓝高亮） -->
<rect x="40" y="272" width="14" height="14" fill="#e7f3ff" stroke="#1971c2" rx="2"/>
<text x="60" y="284" fill="#1971c2" font-size="11" font-weight="bold">HTML 部分</text>
<text x="160" y="284" fill="#868e96" font-size="10">— 标准 HTML 标签（template / div / h1 / button / p）</text>

<rect x="40" y="295" width="14" height="14" fill="#fff5f5" stroke="#c92a2a" rx="2"/>
<text x="60" y="307" fill="#c92a2a" font-size="11" font-weight="bold">Vue 指令</text>
<text x="140" y="307" fill="#868e96" font-size="10">— {{ }} 插值 / @click 事件 / v-if 条件</text>

<!-- 底部 -->
<rect x="40" y="325" width="640" height="20" fill="#f1f3f5" stroke="#dee2e6" rx="3"/>
<text x="360" y="339" fill="#495057" font-size="11" font-weight="bold" text-anchor="middle">HTML 是骨架，Vue 指令让它"活"起来</text>
</svg>
