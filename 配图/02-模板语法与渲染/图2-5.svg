<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="system-ui,PingFang SC,sans-serif">
<rect width="720" height="400" fill="#fafafa"/>
<text x="360" y="28" font-weight="bold" fill="#212529" font-size="17" text-anchor="middle">三种"把数据放进模板"的方式</text>

<!-- {{ }} 插值 -->
<rect x="40" y="55" width="210" height="320" fill="#fff" stroke="#adb5bd" rx="4"/>
<text x="145" y="84" font-weight="bold" fill="#495057" font-size="13" text-anchor="middle">{{ }} 插值</text>
<rect x="56" y="100" width="178" height="50" fill="#f8f9fa" stroke="#dee2e6" rx="3"/>
<text x="145" y="118" fill="#495057" font-size="11" font-family="monospace" text-anchor="middle">&lt;p&gt;{{ msg }}&lt;/p&gt;</text>
<text x="145" y="135" fill="#868e96" font-size="10" text-anchor="middle">msg = "&lt;b&gt;Hi&lt;/b&gt;"</text>
<text x="145" y="172" fill="#495057" font-size="11" font-weight="bold" text-anchor="middle">渲染结果：</text>
<rect x="56" y="180" width="178" height="36" fill="#fff" stroke="#dee2e6" rx="3"/>
<text x="145" y="203" fill="#495057" font-size="13" text-anchor="middle">&lt;b&gt;Hi&lt;/b></text>
<text x="145" y="240" fill="#868e96" font-size="10">✓ 显示原文（安全）</text>
<text x="145" y="258" fill="#868e96" font-size="10">✓ 保留子节点</text>
<rect x="56" y="320" width="178" height="32" fill="#ebfbee" stroke="#b2f2bb" rx="3"/>
<text x="145" y="340" fill="#2b8a3e" font-size="11" font-weight="bold" text-anchor="middle">推荐 99% 场景</text>

<!-- v-text -->
<rect x="260" y="55" width="200" height="320" fill="#fff" stroke="#adb5bd" rx="4"/>
<text x="360" y="84" font-weight="bold" fill="#495057" font-size="13" text-anchor="middle">v-text</text>
<rect x="276" y="100" width="168" height="50" fill="#f8f9fa" stroke="#dee2e6" rx="3"/>
<text x="360" y="118" fill="#495057" font-size="11" font-family="monospace" text-anchor="middle">&lt;p v-text="msg"&gt;</text>
<text x="360" y="135" fill="#495057" font-size="10" font-family="monospace" text-anchor="middle">原内容&lt;/p&gt;</text>
<text x="360" y="172" fill="#495057" font-size="11" font-weight="bold" text-anchor="middle">渲染结果：</text>
<rect x="276" y="180" width="168" height="36" fill="#fff" stroke="#dee2e6" rx="3"/>
<text x="360" y="203" fill="#495057" font-size="13" text-anchor="middle">&lt;b&gt;Hi&lt;/b></text>
<text x="360" y="240" fill="#868e96" font-size="10">⚠ 子节点被覆盖</text>
<text x="360" y="258" fill="#868e96" font-size="10">⚠ 整块替换</text>
<rect x="276" y="320" width="168" height="32" fill="#fff8db" stroke="#ffe066" rx="3"/>
<text x="360" y="340" fill="#e67700" font-size="11" font-weight="bold" text-anchor="middle">基本不用</text>

<!-- v-html -->
<rect x="470" y="55" width="210" height="320" fill="#fff" stroke="#adb5bd" rx="4"/>
<text x="575" y="84" font-weight="bold" fill="#495057" font-size="13" text-anchor="middle">v-html</text>
<rect x="486" y="100" width="178" height="50" fill="#f8f9fa" stroke="#dee2e6" rx="3"/>
<text x="575" y="118" fill="#495057" font-size="11" font-family="monospace" text-anchor="middle">&lt;p v-html="msg"&gt;&lt;/p&gt;</text>
<text x="575" y="135" fill="#868e96" font-size="10" text-anchor="middle">msg = "&lt;b&gt;Hi&lt;/b&gt;"</text>
<text x="575" y="172" fill="#495057" font-size="11" font-weight="bold" text-anchor="middle">渲染结果：</text>
<rect x="486" y="180" width="178" height="36" fill="#fff" stroke="#dee2e6" rx="3"/>
<text x="575" y="205" fill="#c92a2a" font-size="16" font-weight="bold" text-anchor="middle">Hi</text>
<text x="575" y="240" fill="#868e96" font-size="10">⚠ 解析 HTML</text>
<text x="575" y="258" fill="#868e96" font-size="10">⚠ XSS 风险</text>
<rect x="486" y="320" width="178" height="32" fill="#fff5f5" stroke="#ffc9c9" rx="3"/>
<text x="575" y="340" fill="#c92a2a" font-size="11" font-weight="bold" text-anchor="middle">渲染 Markdown 用</text>
</svg>
