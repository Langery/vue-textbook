<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="system-ui,PingFang SC,sans-serif">
<defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#868e96"/></marker>
</defs>
<rect width="720" height="400" fill="#fafafa"/>
<text x="360" y="28" font-weight="bold" fill="#212529" font-size="17" text-anchor="middle">Vue 模板编译与渲染的完整流程</text>

<!-- 步骤1：模板源码 -->
<rect x="40" y="80" width="200" height="60" fill="#fff" stroke="#adb5bd" rx="4"/>
<text x="140" y="105" font-weight="bold" fill="#495057" font-size="12" text-anchor="middle">① 模板（template）</text>
<text x="140" y="125" fill="#868e96" font-size="10" font-family="monospace" text-anchor="middle">&lt;div&gt;{{ msg }}&lt;/div&gt;</text>

<!-- 步骤2：render function -->
<rect x="260" y="80" width="200" height="60" fill="#fff" stroke="#adb5bd" rx="4"/>
<text x="360" y="105" font-weight="bold" fill="#495057" font-size="12" text-anchor="middle">② render 函数</text>
<text x="360" y="125" fill="#868e96" font-size="10" font-family="monospace" text-anchor="middle">h('div', msg)</text>

<!-- 步骤3：VNode -->
<rect x="480" y="80" width="200" height="60" fill="#fff" stroke="#adb5bd" rx="4"/>
<text x="580" y="105" font-weight="bold" fill="#495057" font-size="12" text-anchor="middle">③ VNode（虚拟 DOM）</text>
<text x="580" y="125" fill="#868e96" font-size="10" font-family="monospace" text-anchor="middle">{ tag: 'div', ... }</text>

<!-- 步骤4：真实 DOM -->
<rect x="260" y="220" width="200" height="60" fill="#fff" stroke="#adb5bd" rx="4"/>
<text x="360" y="245" font-weight="bold" fill="#495057" font-size="12" text-anchor="middle">④ 真实 DOM</text>
<text x="360" y="265" fill="#868e96" font-size="10" font-family="monospace" text-anchor="middle">&lt;div&gt;Hello&lt;/div&gt;</text>

<!-- 箭头 -->
<line x1="242" y1="110" x2="258" y2="110" stroke="#868e96" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="462" y1="110" x2="478" y2="110" stroke="#868e96" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 580 142 Q 580 180 460 220" fill="none" stroke="#868e96" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- 阶段标签 -->
<rect x="40" y="170" width="200" height="22" fill="#f1f3f5" stroke="#dee2e6" rx="3"/>
<text x="140" y="185" fill="#495057" font-size="10" font-weight="bold" text-anchor="middle">⚙ 编译器处理</text>

<rect x="480" y="170" width="200" height="22" fill="#f1f3f5" stroke="#dee2e6" rx="3"/>
<text x="580" y="185" fill="#495057" font-size="10" font-weight="bold" text-anchor="middle">⚙ Vue 内部执行</text>

<rect x="260" y="305" width="200" height="22" fill="#f1f3f5" stroke="#dee2e6" rx="3"/>
<text x="360" y="320" fill="#495057" font-size="10" font-weight="bold" text-anchor="middle">🖥 浏览器渲染</text>

<!-- 底部说明 -->
<rect x="40" y="350" width="640" height="34" fill="#f1f3f5" stroke="#dee2e6" rx="4"/>
<text x="360" y="372" fill="#495057" font-size="12" font-weight="bold" text-anchor="middle">模板 → JS 函数 → 描述对象 → 真实 DOM（4 步走完，才到页面）</text>
</svg>
