<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="system-ui,PingFang SC,sans-serif">
<rect width="720" height="400" fill="#fafafa"/>
<text x="360" y="28" font-weight="bold" fill="#212529" font-size="17" text-anchor="middle">没 key vs 有 key：Vue 怎么 diff？</text>

<!-- ===== 左侧：没 key ===== -->
<rect x="20" y="55" width="330" height="320" fill="#fff" stroke="#adb5bd" rx="4"/>
<text x="185" y="80" font-weight="bold" fill="#495057" font-size="13" text-anchor="middle">❌ 没 key（按位置对比）</text>

<text x="185" y="105" fill="#868e96" font-size="10" font-weight="bold" text-anchor="middle">旧列表</text>
<rect x="40" y="115" width="50" height="28" fill="#f8f9fa" stroke="#adb5bd" rx="3"/>
<text x="65" y="134" fill="#495057" font-size="13" font-weight="bold" text-anchor="middle">A</text>
<rect x="100" y="115" width="50" height="28" fill="#f8f9fa" stroke="#adb5bd" rx="3"/>
<text x="125" y="134" fill="#495057" font-size="13" font-weight="bold" text-anchor="middle">B</text>
<rect x="160" y="115" width="50" height="28" fill="#f8f9fa" stroke="#adb5bd" rx="3"/>
<text x="185" y="134" fill="#495057" font-size="13" font-weight="bold" text-anchor="middle">C</text>

<line x1="125" y1="165" x2="125" y2="200" stroke="#868e96" stroke-width="1.5" stroke-dasharray="3,2"/>
<text x="135" y="187" fill="#868e96" font-size="10">Vue 按"位置"对比</text>

<text x="185" y="220" fill="#868e96" font-size="10" font-weight="bold" text-anchor="middle">新列表</text>
<rect x="40" y="225" width="50" height="28" fill="#f8f9fa" stroke="#adb5bd" rx="3"/>
<text x="65" y="244" fill="#495057" font-size="13" font-weight="bold" text-anchor="middle">A</text>
<rect x="100" y="225" width="50" height="28" fill="#fff8db" stroke="#fab005" rx="3"/>
<text x="125" y="244" fill="#e67700" font-size="13" font-weight="bold" text-anchor="middle">D</text>
<rect x="160" y="225" width="50" height="28" fill="#f8f9fa" stroke="#adb5bd" rx="3"/>
<text x="185" y="244" fill="#495057" font-size="13" font-weight="bold" text-anchor="middle">C</text>

<text x="185" y="280" fill="#868e96" font-size="10" text-anchor="middle">位置 2 原来是 B → 现在是 D</text>
<text x="185" y="297" fill="#868e96" font-size="10" text-anchor="middle">Vue 错把 B 当 D 用</text>

<rect x="40" y="320" width="290" height="32" fill="#fff5f5" stroke="#ffc9c9" rx="3"/>
<text x="185" y="340" fill="#c92a2a" font-size="11" font-weight="bold" text-anchor="middle">⚠ 组件状态错位、Bug 难调</text>

<!-- ===== 右侧：有 key ===== -->
<rect x="370" y="55" width="330" height="320" fill="#fff" stroke="#adb5bd" rx="4"/>
<text x="535" y="80" font-weight="bold" fill="#495057" font-size="13" text-anchor="middle">✅ 有 key（按标识对比）</text>

<text x="535" y="105" fill="#868e96" font-size="10" font-weight="bold" text-anchor="middle">旧列表</text>
<rect x="390" y="115" width="80" height="28" fill="#f8f9fa" stroke="#adb5bd" rx="3"/>
<text x="430" y="134" fill="#495057" font-size="11" font-weight="bold" text-anchor="middle">key=1 A</text>
<rect x="478" y="115" width="80" height="28" fill="#f8f9fa" stroke="#adb5bd" rx="3"/>
<text x="518" y="134" fill="#495057" font-size="11" font-weight="bold" text-anchor="middle">key=2 B</text>
<rect x="566" y="115" width="80" height="28" fill="#f8f9fa" stroke="#adb5bd" rx="3"/>
<text x="606" y="134" fill="#495057" font-size="11" font-weight="bold" text-anchor="middle">key=3 C</text>

<line x1="535" y1="165" x2="535" y2="200" stroke="#868e96" stroke-width="1.5"/>
<text x="545" y="187" fill="#868e96" font-size="10">Vue 按 key 匹配</text>

<text x="535" y="220" fill="#868e96" font-size="10" font-weight="bold" text-anchor="middle">新列表</text>
<rect x="390" y="225" width="80" height="28" fill="#f8f9fa" stroke="#adb5bd" rx="3"/>
<text x="430" y="244" fill="#495057" font-size="11" font-weight="bold" text-anchor="middle">key=1 A</text>
<rect x="478" y="225" width="80" height="28" fill="#fff8db" stroke="#fab005" rx="3"/>
<text x="518" y="244" fill="#e67700" font-size="11" font-weight="bold" text-anchor="middle">key=4 D ✨新</text>
<rect x="566" y="225" width="80" height="28" fill="#f8f9fa" stroke="#adb5bd" rx="3"/>
<text x="606" y="244" fill="#495057" font-size="11" font-weight="bold" text-anchor="middle">key=2 B</text>
<rect x="654" y="225" width="35" height="28" fill="#f8f9fa" stroke="#adb5bd" rx="3"/>
<text x="672" y="244" fill="#495057" font-size="9" font-weight="bold" text-anchor="middle">C</text>

<text x="535" y="280" fill="#868e96" font-size="10" text-anchor="middle">A、B、C 各自匹配 → 复用</text>
<text x="535" y="297" fill="#868e96" font-size="10" text-anchor="middle">D 是新插入的元素</text>

<rect x="390" y="320" width="290" height="32" fill="#ebfbee" stroke="#b2f2bb" rx="3"/>
<text x="535" y="340" fill="#2b8a3e" font-size="11" font-weight="bold" text-anchor="middle">✓ 组件状态保留、性能更好</text>
</svg>
