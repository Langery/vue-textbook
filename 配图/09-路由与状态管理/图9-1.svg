<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" font-family="system-ui,PingFang SC,sans-serif"><rect width="720" height="310" fill="#fafafa"/><text x="360" y="28" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">SPA vs MPA：单页应用与多页应用的本质差异</text><rect x="20" y="50" width="330" height="240" fill="#fff5f5" stroke="#e03131" stroke-width="1.5" rx="4"/><text x="185" y="75" font-weight="bold" fill="#e03131" font-size="14" text-anchor="middle">MPA — 多页应用（传统）</text><text x="185" y="105"  fill="#495057" font-size="12" text-anchor="middle">每次点击链接 → 浏览器加载新页面</text><text x="185" y="130"  fill="#495057" font-size="12" text-anchor="middle">HTML 由服务端渲染，整页刷新</text><text x="185" y="160" font-weight="bold" fill="#e03131" font-size="12" text-anchor="middle">缺点：</text><text x="185" y="185"  fill="#c92a2a" font-size="10" text-anchor="middle">  页面切换白屏 / 重复加载相同资源</text><text x="185" y="210"  fill="#c92a2a" font-size="10" text-anchor="middle">  前后端耦合 / SEO 天然友好</text><text x="185" y="245" font-weight="bold" fill="#e03131" font-size="11" text-anchor="middle">适用：官网 / 内容型网站</text><text x="185" y="275"  fill="#495057" font-size="10" text-anchor="middle">例：PHP 网站 / 博客</text><rect x="370" y="50" width="330" height="240" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/><text x="535" y="75" font-weight="bold" fill="#2f9e44" font-size="14" text-anchor="middle">SPA — 单页应用（Vue）</text><text x="535" y="105"  fill="#495057" font-size="12" text-anchor="middle">首次加载一个 HTML，之后 JS 接管路由</text><text x="535" y="130"  fill="#495057" font-size="12" text-anchor="middle">切换页面 = 替换组件，不刷新浏览器</text><text x="535" y="160" font-weight="bold" fill="#2f9e44" font-size="12" text-anchor="middle">优点：</text><text x="535" y="185"  fill="#2f9e44" font-size="10" text-anchor="middle">  丝滑切换 / 可做过渡动画</text><text x="535" y="210"  fill="#2f9e44" font-size="10" text-anchor="middle">  前后端分离 / 组件复用</text><text x="535" y="245" font-weight="bold" fill="#2f9e44" font-size="11" text-anchor="middle">适用：管理后台 / SaaS 工具</text><text x="535" y="275"  fill="#495057" font-size="10" text-anchor="middle">例：GitHub / Gmail / 飞书</text></svg>