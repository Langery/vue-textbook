<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="system-ui,PingFang SC,sans-serif">
  <rect width="720" height="420" fill="#fafafa"/>
  <text x="360" y="30" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">defineEmits + $emit：把值从子组件传回父组件</text>

  <!-- 子组件 -->
  <rect x="20" y="48" width="270" height="196" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
  <text x="155" y="72" font-weight="bold" fill="#2f9e44" font-size="14" text-anchor="middle">子组件 RateInput.vue</text>

  <rect x="34" y="86" width="242" height="86" fill="#fff" stroke="#a9e095" stroke-width="1.5" rx="4"/>
  <text x="46" y="106" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#2f9e44" text-anchor="start">const emit = defineEmits(['change'])</text>
  <text x="46" y="126" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="start">function setRate(n) {</text>
  <text x="46" y="144" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="start">  emit('change', n)</text>
  <text x="46" y="162" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="start">}</text>

  <text x="34" y="196" fill="#495057" font-size="11" text-anchor="start">第 1 个参数是事件名</text>
  <text x="34" y="216" fill="#495057" font-size="11" text-anchor="start">第 2 个起全部传给父组件</text>
  <text x="34" y="236" fill="#868e96" font-size="11" text-anchor="start">不需要 import，是编译器宏</text>

  <!-- 父组件 -->
  <rect x="430" y="48" width="270" height="196" fill="#e7f3ff" stroke="#1971c2" stroke-width="1.5" rx="4"/>
  <text x="565" y="72" font-weight="bold" fill="#1971c2" font-size="14" text-anchor="middle">父组件 App.vue</text>

  <rect x="444" y="86" width="242" height="86" fill="#fff" stroke="#74c0fc" stroke-width="1.5" rx="4"/>
  <text x="456" y="106" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="start">&lt;RateInput @change="onChange" /&gt;</text>
  <text x="456" y="126" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#1971c2" text-anchor="start">function onChange(v) {</text>
  <text x="456" y="144" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#1971c2" text-anchor="start">  score.value = v</text>
  <text x="456" y="162" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="start">}</text>

  <text x="444" y="196" fill="#495057" font-size="11" text-anchor="start">方法名写法：参数自动传进形参</text>
  <text x="444" y="216" fill="#495057" font-size="11" text-anchor="start">v 就是子组件 emit 过来的值</text>
  <text x="444" y="236" fill="#868e96" font-size="11" text-anchor="start">多参数就按顺序写多个形参</text>

  <!-- 中间：向上的箭头 -->
  <line x1="300" y1="140" x2="420" y2="140" stroke="#2f9e44" stroke-width="2"/>
  <polygon points="430,140 414,133 414,147" fill="#2f9e44"/>
  <text x="360" y="128" font-weight="bold" fill="#2f9e44" font-size="12" text-anchor="middle">emit('change', 42)</text>
  <text x="360" y="162" fill="#868e96" font-size="11" text-anchor="middle">子 → 父</text>

  <!-- 三种接收方式 -->
  <text x="20" y="278" font-weight="bold" fill="#495057" font-size="13" text-anchor="start">父组件接收参数的三种写法</text>

  <rect x="20" y="292" width="218" height="86" fill="#fff" stroke="#dee2e6" stroke-width="1.5" rx="4"/>
  <text x="129" y="312" font-weight="bold" fill="#1971c2" font-size="12" text-anchor="middle">① 用 $event（单参数）</text>
  <rect x="30" y="320" width="198" height="30" fill="#e7f3ff" stroke="#74c0fc" stroke-width="1.5" rx="4"/>
  <text x="129" y="340" font-size="9" font-family="ui-monospace,Menlo,monospace" fill="#1971c2" text-anchor="middle">@change="score = $event"</text>
  <text x="129" y="368" fill="#868e96" font-size="10" text-anchor="middle">最简洁，只能接第一个参数</text>

  <rect x="251" y="292" width="218" height="86" fill="#fff" stroke="#dee2e6" stroke-width="1.5" rx="4"/>
  <text x="360" y="312" font-weight="bold" fill="#1971c2" font-size="12" text-anchor="middle">② 箭头函数内联</text>
  <rect x="261" y="320" width="198" height="30" fill="#e7f3ff" stroke="#74c0fc" stroke-width="1.5" rx="4"/>
  <text x="360" y="340" font-size="9" font-family="ui-monospace,Menlo,monospace" fill="#1971c2" text-anchor="middle">@change="(v) =&gt; score = v"</text>
  <text x="360" y="368" fill="#868e96" font-size="10" text-anchor="middle">多个参数时用这个</text>

  <rect x="482" y="292" width="218" height="86" fill="#fff" stroke="#dee2e6" stroke-width="1.5" rx="4"/>
  <text x="591" y="312" font-weight="bold" fill="#1971c2" font-size="12" text-anchor="middle">③ 直接写方法名（推荐）</text>
  <rect x="492" y="320" width="198" height="30" fill="#e7f3ff" stroke="#74c0fc" stroke-width="1.5" rx="4"/>
  <text x="591" y="340" font-size="9" font-family="ui-monospace,Menlo,monospace" fill="#1971c2" text-anchor="middle">@change="onChange"</text>
  <text x="591" y="368" fill="#868e96" font-size="10" text-anchor="middle">最常用，参数自动传入</text>

  <!-- 底部 -->
  <text x="360" y="402" font-weight="bold" fill="#495057" font-size="12" text-anchor="middle">传参的意义：父组件不只知道「出事了」，还知道「发生了什么」</text>
</svg>
