<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" font-family="system-ui,PingFang SC,sans-serif">
  <rect width="720" height="520" fill="#fafafa"/>
  <text x="360" y="30" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">VueUse 生态总览：200+ 个开箱即用的 composable</text>

  <!-- 顶部说明 -->
  <rect x="20" y="46" width="680" height="46" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.5" rx="4"/>
  <text x="360" y="66" font-weight="bold" fill="#495057" font-size="12" text-anchor="middle">npm i @vueuse/core — 核心团队维护，类型完整，按需导入可 tree-shaking</text>
  <text x="360" y="84" fill="#868e96" font-size="11" text-anchor="middle">import { useDark, useClipboard } from '@vueuse/core'  // 没用到的不会打进包</text>

  <!-- 响应式 -->
  <rect x="20" y="110" width="220" height="164" fill="#e7f3ff" stroke="#1971c2" stroke-width="1.5" rx="4"/>
  <text x="130" y="134" font-weight="bold" fill="#1971c2" font-size="13" text-anchor="middle">响应式 / 状态</text>
  <rect x="34" y="146" width="192" height="112" fill="#fff" stroke="#74c0fc" stroke-width="1.5" rx="4"/>
  <text x="46" y="166" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#1971c2" text-anchor="start">useStorage</text>
  <text x="46" y="186" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#1971c2" text-anchor="start">useLocalStorage</text>
  <text x="46" y="206" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#1971c2" text-anchor="start">useSessionStorage</text>
  <text x="46" y="226" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#1971c2" text-anchor="start">useToggle / useCounter</text>
  <text x="46" y="248" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#1971c2" text-anchor="start">useCycle</text>

  <!-- 浏览器 -->
  <rect x="250" y="110" width="220" height="164" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
  <text x="360" y="134" font-weight="bold" fill="#2f9e44" font-size="13" text-anchor="middle">浏览器 API</text>
  <rect x="264" y="146" width="192" height="112" fill="#fff" stroke="#a9e095" stroke-width="1.5" rx="4"/>
  <text x="276" y="166" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#2f9e44" text-anchor="start">useDark</text>
  <text x="276" y="186" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#2f9e44" text-anchor="start">useClipboard</text>
  <text x="276" y="206" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#2f9e44" text-anchor="start">useTitle / useFavicon</text>
  <text x="276" y="226" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#2f9e44" text-anchor="start">useFullscreen</text>
  <text x="276" y="248" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#2f9e44" text-anchor="start">usePermission</text>

  <!-- 元素 -->
  <rect x="480" y="110" width="220" height="164" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5" rx="4"/>
  <text x="590" y="134" font-weight="bold" fill="#e8590c" font-size="13" text-anchor="middle">元素 / DOM</text>
  <rect x="494" y="146" width="192" height="112" fill="#fff" stroke="#ffc078" stroke-width="1.5" rx="4"/>
  <text x="506" y="166" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#e8590c" text-anchor="start">useMouse</text>
  <text x="506" y="186" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#e8590c" text-anchor="start">useElementSize</text>
  <text x="506" y="206" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#e8590c" text-anchor="start">useIntersectionObserver</text>
  <text x="506" y="226" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#e8590c" text-anchor="start">onClickOutside</text>
  <text x="506" y="248" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#e8590c" text-anchor="start">useInfiniteScroll</text>

  <!-- 时间 / 防抖 -->
  <rect x="20" y="288" width="220" height="164" fill="#fff" stroke="#1971c2" stroke-width="1.5" rx="4"/>
  <text x="130" y="312" font-weight="bold" fill="#1971c2" font-size="13" text-anchor="middle">时间 / 流控</text>
  <rect x="34" y="324" width="192" height="112" fill="#fff" stroke="#74c0fc" stroke-width="1.5" rx="4"/>
  <text x="46" y="344" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#1971c2" text-anchor="start">useDebounceFn</text>
  <text x="46" y="364" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#1971c2" text-anchor="start">useThrottleFn</text>
  <text x="46" y="384" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#1971c2" text-anchor="start">useIntervalFn</text>
  <text x="46" y="404" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#1971c2" text-anchor="start">useTimeoutFn</text>
  <text x="46" y="426" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#1971c2" text-anchor="start">useNow / useDateFormat</text>

  <!-- 网络 -->
  <rect x="250" y="288" width="220" height="164" fill="#fff" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
  <text x="360" y="312" font-weight="bold" fill="#2f9e44" font-size="13" text-anchor="middle">网络 / 请求</text>
  <rect x="264" y="324" width="192" height="112" fill="#fff" stroke="#a9e095" stroke-width="1.5" rx="4"/>
  <text x="276" y="344" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#2f9e44" text-anchor="start">useFetch</text>
  <text x="276" y="364" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#2f9e44" text-anchor="start">useAxios</text>
  <text x="276" y="384" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#2f9e44" text-anchor="start">useWebSocket</text>
  <text x="276" y="404" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#2f9e44" text-anchor="start">useEventSource</text>
  <text x="276" y="426" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#2f9e44" text-anchor="start">useAsyncState</text>

  <!-- 动画 / 传感器 -->
  <rect x="480" y="288" width="220" height="164" fill="#fff" stroke="#e8590c" stroke-width="1.5" rx="4"/>
  <text x="590" y="312" font-weight="bold" fill="#e8590c" font-size="13" text-anchor="middle">动画 / 传感器</text>
  <rect x="494" y="324" width="192" height="112" fill="#fff" stroke="#ffc078" stroke-width="1.5" rx="4"/>
  <text x="506" y="344" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#e8590c" text-anchor="start">useTransition</text>
  <text x="506" y="364" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#e8590c" text-anchor="start">useAnimate</text>
  <text x="506" y="384" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#e8590c" text-anchor="start">useScroll</text>
  <text x="506" y="404" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#e8590c" text-anchor="start">useMediaQuery</text>
  <text x="506" y="426" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#e8590c" text-anchor="start">useGeolocation</text>

  <!-- 底部 -->
  <rect x="20" y="466" width="680" height="34" fill="#fff" stroke="#dee2e6" stroke-width="1.5" rx="4"/>
  <text x="360" y="488" font-weight="bold" fill="#495057" font-size="12" text-anchor="middle">先手写、再拥抱工具：看懂原理，才知道该拿工具还是自己焊一把</text>
</svg>