<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410" font-family="system-ui,PingFang SC,sans-serif">
  <rect width="720" height="410" fill="#fafafa"/>
  <text x="360" y="30" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">shallowRef vs ref：响应式的作用范围不一样</text>

  <!-- 左栏：ref -->
  <rect x="20" y="48" width="330" height="270" fill="#e7f3ff" stroke="#1971c2" stroke-width="1.5" rx="4"/>
  <text x="185" y="74" font-weight="bold" fill="#1971c2" font-size="14" text-anchor="middle">ref() — 深层响应式</text>

  <rect x="36" y="88" width="298" height="42" fill="#cce5ff" stroke="#74c0fc" stroke-width="1.5" rx="4"/>
  <text x="185" y="106" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#1971c2" text-anchor="middle">const state = ref({ list: [1,2] })</text>
  <text x="185" y="126" fill="#495057" font-size="11" text-anchor="middle">外层和里层都被 Proxy 包住</text>

  <rect x="52" y="144" width="266" height="38" fill="#fff" stroke="#1971c2" stroke-width="1.5" rx="4"/>
  <text x="185" y="168" fill="#1971c2" font-size="11" text-anchor="middle">第 1 层 state → 响应式 ✓</text>
  <rect x="68" y="190" width="234" height="38" fill="#fff" stroke="#1971c2" stroke-width="1.5" rx="4"/>
  <text x="185" y="204" fill="#1971c2" font-size="11" text-anchor="middle">第 2 层 state.list → 响应式 ✓</text>
  <rect x="84" y="236" width="202" height="38" fill="#fff" stroke="#1971c2" stroke-width="1.5" rx="4"/>
  <text x="185" y="260" fill="#1971c2" font-size="11" text-anchor="middle">第 3 层 state.list[0] → 响应式 ✓</text>

  <text x="185" y="296" font-weight="bold" fill="#1971c2" font-size="11" text-anchor="middle">改到第 3 层，视图照样更新</text>

  <!-- 右栏：shallowRef -->
  <rect x="370" y="48" width="330" height="270" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
  <text x="535" y="74" font-weight="bold" fill="#2f9e44" font-size="14" text-anchor="middle">shallowRef() — 只有第一层</text>

  <rect x="386" y="88" width="298" height="42" fill="#d8f5cc" stroke="#a9e095" stroke-width="1.5" rx="4"/>
  <text x="535" y="106" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#2f9e44" text-anchor="middle">const state = shallowRef({</text>
  <text x="535" y="126" fill="#495057" font-size="11" text-anchor="middle">只有外层是响应式的</text>

  <rect x="402" y="144" width="266" height="38" fill="#fff" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
  <text x="535" y="168" fill="#2f9e44" font-size="11" text-anchor="middle">第 1 层 state → 响应式 ✓</text>
  <rect x="418" y="190" width="234" height="38" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1.5" rx="4"/>
  <text x="535" y="214" fill="#868e96" font-size="11" text-anchor="middle">第 2 层 → 普通对象 ✗</text>
  <rect x="434" y="236" width="202" height="38" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1.5" rx="4"/>
  <text x="535" y="260" fill="#868e96" font-size="11" text-anchor="middle">第 3 层 → 普通值 ✗</text>

  <text x="535" y="296" font-weight="bold" fill="#c92a2a" font-size="11" text-anchor="middle">改深层不触发，要手动 triggerRef</text>

  <!-- 底部说明 -->
  <text x="360" y="344" font-weight="bold" fill="#495057" font-size="12" text-anchor="middle">shallowRef 用在哪：大数组 / 第三方实例 / 深层追踪没意义的场景</text>
  <text x="360" y="368" fill="#868e96" font-size="11" text-anchor="middle">嵌套结构固定、只会整体替换（比如切换整份配置）时，shallowRef 更省性能</text>
  <text x="360" y="392" fill="#c92a2a" font-size="11" text-anchor="middle">深层改了界面却没动 → triggerRef(state) 手动触发一次更新</text>
</svg>