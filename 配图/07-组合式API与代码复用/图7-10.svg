<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="system-ui,PingFang SC,sans-serif">
  <rect width="720" height="420" fill="#fafafa"/>
  <text x="360" y="30" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">useDebounce 时序：连打 4 次，只在停下来后触发 1 次</text>

  <!-- 时间轴 -->
  <line x1="70" y1="132" x2="660" y2="132" stroke="#adb5bd" stroke-width="2"/>
  <polygon points="670,132 658,126 658,138" fill="#adb5bd"/>
  <text x="46" y="137" fill="#868e96" font-size="11" text-anchor="middle">时间</text>

  <!-- 输入事件 -->
  <circle cx="130" cy="132" r="9" fill="#e8590c"/>
  <text x="130" y="98" font-weight="bold" fill="#e8590c" font-size="12" text-anchor="middle">v</text>
  <text x="130" y="162" fill="#868e96" font-size="10" text-anchor="middle">t=0</text>

  <circle cx="230" cy="132" r="9" fill="#e8590c"/>
  <text x="230" y="98" font-weight="bold" fill="#e8590c" font-size="12" text-anchor="middle">vu</text>
  <text x="230" y="162" fill="#868e96" font-size="10" text-anchor="middle">t=120ms</text>

  <circle cx="330" cy="132" r="9" fill="#e8590c"/>
  <text x="330" y="98" font-weight="bold" fill="#e8590c" font-size="12" text-anchor="middle">vue</text>
  <text x="330" y="162" fill="#868e96" font-size="10" text-anchor="middle">t=260ms</text>

  <circle cx="430" cy="132" r="9" fill="#e8590c"/>
  <text x="430" y="98" font-weight="bold" fill="#e8590c" font-size="12" text-anchor="middle">vue3</text>
  <text x="430" y="162" fill="#868e96" font-size="10" text-anchor="middle">t=400ms</text>

  <!-- 等待段 -->
  <line x1="440" y1="132" x2="545" y2="132" stroke="#2f9e44" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="492" y="98" font-weight="bold" fill="#2f9e44" font-size="11" text-anchor="middle">安静 500ms</text>

  <!-- 触发 -->
  <circle cx="555" cy="132" r="11" fill="#2f9e44"/>
  <text x="555" y="136" font-weight="bold" fill="#fff" font-size="11" text-anchor="middle">✓</text>
  <text x="612" y="137" font-weight="bold" fill="#2f9e44" font-size="12" text-anchor="middle">发请求</text>

  <line x1="555" y1="146" x2="555" y2="196" stroke="#2f9e44" stroke-width="1.5"/>
  <polygon points="555,204 549,192 561,192" fill="#2f9e44"/>

  <!-- 触发结果 -->
  <rect x="360" y="206" width="330" height="52" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
  <text x="525" y="228" font-weight="bold" fill="#2f9e44" font-size="12" text-anchor="middle">只触发 1 次，参数是最后一次的值</text>
  <text x="525" y="248" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="middle">watch 回调收到 "vue3"，发一次请求</text>

  <!-- 实现 -->
  <rect x="20" y="206" width="316" height="112" fill="#fff" stroke="#dee2e6" stroke-width="1.5" rx="4"/>
  <text x="178" y="230" font-weight="bold" fill="#495057" font-size="13" text-anchor="middle">为什么只触发一次</text>
  <text x="36" y="254" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="start">watch(source, (v) =&gt; {</text>
  <text x="36" y="272" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="start">  clearTimeout(timer)</text>
  <text x="36" y="290" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="start">  timer = setTimeout(() =&gt;</text>
  <text x="36" y="306" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="start">    run(v), delay)</text>

  <!-- 底部对照 -->
  <rect x="20" y="334" width="330" height="66" fill="#e7f3ff" stroke="#1971c2" stroke-width="1.5" rx="4"/>
  <text x="185" y="358" font-weight="bold" fill="#1971c2" font-size="12" text-anchor="middle">防抖 debounce</text>
  <text x="185" y="380" fill="#495057" font-size="11" text-anchor="middle">停下来才执行，适合搜索联想</text>
  <text x="185" y="396" fill="#868e96" font-size="10" text-anchor="middle">连续触发只算最后一次</text>

  <rect x="370" y="334" width="330" height="66" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5" rx="4"/>
  <text x="535" y="358" font-weight="bold" fill="#e8590c" font-size="12" text-anchor="middle">节流 throttle</text>
  <text x="535" y="380" fill="#495057" font-size="11" text-anchor="middle">每隔一段时间就执行一次</text>
  <text x="535" y="396" fill="#868e96" font-size="10" text-anchor="middle">适合滚动、resize 监听</text>
</svg>