<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="system-ui,PingFang SC,sans-serif">
  <rect width="720" height="420" fill="#fafafa"/>
  <text x="360" y="30" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">Symbol 作key：让两个 'theme' 互不打架</text>

  <!-- 左：字符串 key 撞车 -->
  <rect x="20" y="48" width="330" height="262" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.5" rx="4"/>
  <text x="185" y="76" font-weight="bold" fill="#c92a2a" font-size="14" text-anchor="middle">字符串 key：会撞车</text>

  <rect x="36" y="90" width="298" height="56" fill="#fff" stroke="#ffc9c9" stroke-width="1.5" rx="4"/>
  <text x="48" y="110" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057">provide('theme', themeA)</text>
  <text x="48" y="130" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057">provide('theme', themeB)</text>

  <rect x="36" y="160" width="145" height="44" fill="#fff" stroke="#dee2e6" stroke-width="1.5" rx="4"/>
  <text x="108" y="180" font-weight="bold" fill="#495057" font-size="11" text-anchor="middle">组件库 A</text>
  <text x="108" y="196" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#868e96" text-anchor="middle">key: 'theme'</text>

  <rect x="189" y="160" width="145" height="44" fill="#fff" stroke="#dee2e6" stroke-width="1.5" rx="4"/>
  <text x="261" y="180" font-weight="bold" fill="#495057" font-size="11" text-anchor="middle">组件库 B</text>
  <text x="261" y="196" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#868e96" text-anchor="middle">key: 'theme'</text>

  <rect x="36" y="222" width="298" height="40" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.5" rx="4"/>
  <text x="185" y="247" fill="#c92a2a" font-size="12" text-anchor="middle">inject('theme') 只命中最近的那个</text>

  <text x="185" y="288" fill="#c92a2a" font-size="11" text-anchor="middle">库 A 的子组件可能拿到库 B 的主题</text>

  <!-- 右：Symbol key 隔离 -->
  <rect x="370" y="48" width="330" height="262" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
  <text x="535" y="76" font-weight="bold" fill="#2f9e44" font-size="14" text-anchor="middle">Symbol key：天然隔离</text>

  <rect x="386" y="90" width="298" height="56" fill="#fff" stroke="#a9e095" stroke-width="1.5" rx="4"/>
  <text x="398" y="110" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057">const A = Symbol('theme')</text>
  <text x="398" y="130" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057">const B = Symbol('theme')</text>

  <rect x="386" y="160" width="145" height="44" fill="#fff" stroke="#a9e095" stroke-width="1.5" rx="4"/>
  <text x="458" y="180" font-weight="bold" fill="#2f9e44" font-size="11" text-anchor="middle">库 A 专用</text>
  <text x="458" y="196" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#868e96" text-anchor="middle">key: Symbol A</text>

  <rect x="539" y="160" width="145" height="44" fill="#fff" stroke="#a9e095" stroke-width="1.5" rx="4"/>
  <text x="611" y="180" font-weight="bold" fill="#2f9e44" font-size="11" text-anchor="middle">库 B 专用</text>
  <text x="611" y="196" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#868e96" text-anchor="middle">key: Symbol B</text>

  <rect x="386" y="222" width="298" height="40" fill="#d8f5cc" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
  <text x="535" y="247" font-weight="bold" fill="#2f9e44" font-size="12" text-anchor="middle">inject(A) 和 inject(B) 各取各的</text>

  <text x="535" y="288" fill="#2f9e44" font-size="11" text-anchor="middle">Symbol 是唯一身份，谁也覆盖不了谁</text>

  <!-- 写法 -->
  <rect x="20" y="330" width="680" height="70" fill="#fff" stroke="#dee2e6" stroke-width="1.5" rx="4"/>
  <text x="360" y="356" font-weight="bold" fill="#495057" font-size="12" text-anchor="middle">写法：export const ThemeKey = Symbol('theme')，配 InjectionKey 还有类型提示</text>
  <text x="360" y="380" fill="#868e96" font-size="11" text-anchor="middle">同一文件里 import 同一个 Symbol，provide 和 inject 才算同一个 key</text>
</svg>