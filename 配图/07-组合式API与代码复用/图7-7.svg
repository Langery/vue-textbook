<svg xmlns="http://www.w3.org/2000/svg" width="720" height="492" viewBox="0 0 720 492" font-family="system-ui,PingFang SC,sans-serif">
  <rect width="720" height="492" fill="#fafafa"/>
  <text x="360" y="30" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">provide / inject：把「逐级转发」变成「跨层直达」</text>

  <!-- 上半：props 逐级传递 -->
  <rect x="20" y="46" width="680" height="178" fill="#fff5f5" stroke="#e03131" stroke-width="1.5" rx="4"/>
  <text x="360" y="72" font-weight="bold" fill="#c92a2a" font-size="14" text-anchor="middle">方式一：props 逐级传递</text>

  <rect x="60" y="96" width="160" height="68" fill="#fff" stroke="#e03131" stroke-width="1.5" rx="4"/>
  <text x="140" y="124" font-weight="bold" fill="#c92a2a" font-size="12" text-anchor="middle">祖父 App</text>
  <text x="140" y="146" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="middle">props: user</text>

  <line x1="220" y1="130" x2="270" y2="130" stroke="#e03131" stroke-width="1.5"/>
  <polygon points="278,130 266,125 266,135" fill="#e03131"/>

  <rect x="280" y="96" width="160" height="68" fill="#fff" stroke="#e03131" stroke-width="1.5" rx="4"/>
  <text x="360" y="124" font-weight="bold" fill="#c92a2a" font-size="12" text-anchor="middle">父组件 Layout</text>
  <text x="360" y="146" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="middle">props: user</text>

  <line x1="440" y1="130" x2="490" y2="130" stroke="#e03131" stroke-width="1.5"/>
  <polygon points="498,130 486,125 486,135" fill="#e03131"/>

  <rect x="500" y="96" width="160" height="68" fill="#fff" stroke="#e03131" stroke-width="1.5" rx="4"/>
  <text x="580" y="124" font-weight="bold" fill="#c92a2a" font-size="12" text-anchor="middle">子组件 Header</text>
  <text x="580" y="146" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="middle">props: user</text>

  <text x="360" y="192" fill="#c92a2a" font-size="11" text-anchor="middle">改一个 user 字段，三个文件的 props 定义都要跟着改</text>
  <text x="360" y="214" fill="#868e96" font-size="11" text-anchor="middle">中间层其实用不上这个值，只是被迫当二传手</text>

  <!-- 下半：provide / inject -->
  <rect x="20" y="240" width="680" height="186" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
  <text x="360" y="266" font-weight="bold" fill="#2f9e44" font-size="14" text-anchor="middle">方式二：provide / inject 跨层直达</text>

  <!-- 跨层箭头 -->
  <line x1="140" y1="292" x2="140" y2="280" stroke="#2f9e44" stroke-width="1.5"/>
  <line x1="140" y1="280" x2="286" y2="280" stroke="#2f9e44" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="434" y1="280" x2="580" y2="280" stroke="#2f9e44" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="580" y1="280" x2="580" y2="290" stroke="#2f9e44" stroke-width="1.5"/>
  <polygon points="580,292 574,280 586,280" fill="#2f9e44"/>
  <text x="360" y="285" font-weight="bold" fill="#2f9e44" font-size="10" text-anchor="middle">跨层直达，中间层零参与</text>

  <rect x="60" y="292" width="160" height="68" fill="#d8f5cc" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
  <text x="140" y="320" font-weight="bold" fill="#2f9e44" font-size="12" text-anchor="middle">祖父 App</text>
  <text x="140" y="342" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="middle">provide('user')</text>

  <rect x="280" y="292" width="160" height="68" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.5" rx="4"/>
  <text x="360" y="320" font-weight="bold" fill="#868e96" font-size="12" text-anchor="middle">父组件 Layout</text>
  <text x="360" y="342" fill="#868e96" font-size="11" text-anchor="middle">完全不用管</text>

  <rect x="500" y="292" width="160" height="68" fill="#d8f5cc" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
  <text x="580" y="320" font-weight="bold" fill="#2f9e44" font-size="12" text-anchor="middle">子组件 Header</text>
  <text x="580" y="342" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="middle">inject('user')</text>

  <text x="360" y="392" fill="#2f9e44" font-size="11" text-anchor="middle">provide 的值要是 ref / reactive / computed，后代才能跟着更新</text>
  <text x="360" y="414" fill="#868e96" font-size="11" text-anchor="middle">provide 普通值 = 后代拿到一份快照，不会更新</text>

  <!-- 结论 -->
  <rect x="20" y="442" width="680" height="34" fill="#fff" stroke="#dee2e6" stroke-width="1.5" rx="4"/>
  <text x="360" y="464" font-weight="bold" fill="#495057" font-size="12" text-anchor="middle">props 是常规武器，provide / inject 是特快专递——层级深或组件库里才用</text>
</svg>