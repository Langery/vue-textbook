<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" font-family="system-ui,PingFang SC,sans-serif">
  <rect width="720" height="480" fill="#fafafa"/>
  <text x="360" y="30" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">useDark 工作原理：系统偏好 → 手动覆盖 → 切class</text>

  <!-- 步骤 1：读偏好 -->
  <rect x="20" y="52" width="200" height="96" fill="#e7f3ff" stroke="#1971c2" stroke-width="1.5" rx="4"/>
  <text x="120" y="76" font-weight="bold" fill="#1971c2" font-size="13" text-anchor="middle">① 读偏好</text>
  <text x="120" y="98" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="middle">localStorage 先读</text>
  <text x="120" y="118" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="middle">matchMedia 后备</text>
  <text x="120" y="138" fill="#868e96" font-size="10" text-anchor="middle">prefers-color-scheme</text>

  <line x1="222" y1="100" x2="250" y2="100" stroke="#adb5bd" stroke-width="1.5"/>
  <polygon points="258,100 246,95 246,105" fill="#adb5bd"/>

  <!-- 步骤 2：isDark ref -->
  <rect x="260" y="52" width="200" height="96" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
  <text x="360" y="76" font-weight="bold" fill="#2f9e44" font-size="13" text-anchor="middle">② isDark ref</text>
  <rect x="274" y="88" width="172" height="28" fill="#d8f5cc" stroke="#a9e095" stroke-width="1.5" rx="4"/>
  <text x="360" y="107" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#2f9e44" text-anchor="middle">const isDark = useDark()</text>
  <text x="360" y="136" fill="#495057" font-size="11" text-anchor="middle">初始值来自上一步</text>

  <line x1="462" y1="100" x2="490" y2="100" stroke="#adb5bd" stroke-width="1.5"/>
  <polygon points="498,100 486,95 486,105" fill="#adb5bd"/>

  <!-- 步骤 3：写 class -->
  <rect x="500" y="52" width="200" height="96" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5" rx="4"/>
  <text x="600" y="76" font-weight="bold" fill="#e8590c" font-size="13" text-anchor="middle">③ 改 html class</text>
  <rect x="514" y="88" width="172" height="28" fill="#fff" stroke="#ffc078" stroke-width="1.5" rx="4"/>
  <text x="600" y="107" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#e8590c" text-anchor="middle">classList.add('dark')</text>
  <text x="600" y="136" fill="#495057" font-size="11" text-anchor="middle">变亮就 remove 掉</text>

  <!-- 手动覆盖 -->
  <rect x="130" y="176" width="460" height="90" fill="#fff" stroke="#dee2e6" stroke-width="1.5" rx="4"/>
  <text x="360" y="200" font-weight="bold" fill="#495057" font-size="13" text-anchor="middle">手动覆盖：系统偏好只在「用户没表过态」时说话</text>

  <rect x="150" y="214" width="140" height="38" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.5" rx="4"/>
  <text x="220" y="238" font-size="11" fill="#495057" text-anchor="middle">系统：偏好深色</text>

  <rect x="330" y="214" width="60" height="38" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5" rx="4"/>
  <text x="360" y="238" font-weight="bold" fill="#e8590c" font-size="12" text-anchor="middle">优先</text>

  <rect x="430" y="214" width="140" height="38" fill="#e7f3ff" stroke="#1971c2" stroke-width="1.5" rx="4"/>
  <text x="500" y="238" font-size="11" fill="#495057" text-anchor="middle">用户点了切换</text>

  <text x="360" y="264" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#1971c2" text-anchor="middle">vueuse-color-scheme 有值 → 用它；没有 → 听系统的</text>

  <!-- CSS 变量 -->
  <rect x="20" y="290" width="330" height="170" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
  <text x="185" y="314" font-weight="bold" fill="#2f9e44" font-size="13" text-anchor="middle">④ CSS 变量跟着切</text>

  <rect x="34" y="326" width="302" height="54" fill="#fff" stroke="#a9e095" stroke-width="1.5" rx="4"/>
  <text x="46" y="346" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="start">:root { --bg: #fff; }</text>
  <text x="46" y="366" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="start">.dark { --bg: #1a1a1a; }</text>

  <rect x="34" y="390" width="302" height="54" fill="#fff" stroke="#a9e095" stroke-width="1.5" rx="4"/>
  <text x="46" y="410" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="start">.card {</text>
  <text x="46" y="430" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="start">  background: var(--bg);</text>

  <!-- Tailwind -->
  <rect x="370" y="290" width="330" height="170" fill="#e7f3ff" stroke="#1971c2" stroke-width="1.5" rx="4"/>
  <text x="535" y="314" font-weight="bold" fill="#1971c2" font-size="13" text-anchor="middle">配 Tailwind 直接用前缀</text>

  <rect x="384" y="326" width="302" height="54" fill="#fff" stroke="#74c0fc" stroke-width="1.5" rx="4"/>
  <text x="396" y="346" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="start">&lt;div class="bg-white</text>
  <text x="396" y="366" font-size="10" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="start">  dark:bg-gray-900"&gt;</text>

  <text x="535" y="404" fill="#495057" font-size="11" text-anchor="middle">html 上有 class="dark"，</text>
  <text x="535" y="424" fill="#495057" font-size="11" text-anchor="middle">dark: 前缀的样式全部生效</text>
  <text x="535" y="448" fill="#868e96" font-size="10" text-anchor="middle">切换只是一次 class 增删，不用重渲染</text>
</svg>