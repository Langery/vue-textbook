<svg xmlns="http://www.w3.org/2000/svg" width="720" height="510" viewBox="0 0 720 510" font-family="system-ui,PingFang SC,sans-serif">
  <rect width="720" height="510" fill="#fafafa"/>
  <text x="360" y="30" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">前台首页筛选流水线：四个条件，全部收进一个 computed</text>

  <!-- ===== 四个筛选条件 ===== -->
  <text x="20" y="52" font-weight="bold" fill="#1971c2" font-size="13" text-anchor="start">用户能改的四个条件：每个都是一个 ref</text>

  <rect x="20" y="60" width="160" height="54" fill="#e7f3ff" stroke="#1971c2" stroke-width="1.5" rx="4"/>
  <text x="100" y="82" font-weight="bold" fill="#1971c2" font-size="12" font-family="ui-monospace,Menlo,monospace" text-anchor="middle">keyword</text>
  <text x="100" y="101" font-size="11" fill="#495057" text-anchor="middle">搜索关键词</text>

  <rect x="193" y="60" width="160" height="54" fill="#e7f3ff" stroke="#1971c2" stroke-width="1.5" rx="4"/>
  <text x="273" y="82" font-weight="bold" fill="#1971c2" font-size="12" font-family="ui-monospace,Menlo,monospace" text-anchor="middle">category</text>
  <text x="273" y="101" font-size="11" fill="#495057" text-anchor="middle">商品分类</text>

  <rect x="366" y="60" width="160" height="54" fill="#e7f3ff" stroke="#1971c2" stroke-width="1.5" rx="4"/>
  <text x="446" y="82" font-weight="bold" fill="#1971c2" font-size="12" font-family="ui-monospace,Menlo,monospace" text-anchor="middle">priceRange</text>
  <text x="446" y="101" font-size="11" fill="#495057" text-anchor="middle">价格区间</text>

  <rect x="539" y="60" width="160" height="54" fill="#e7f3ff" stroke="#1971c2" stroke-width="1.5" rx="4"/>
  <text x="619" y="82" font-weight="bold" fill="#1971c2" font-size="12" font-family="ui-monospace,Menlo,monospace" text-anchor="middle">sortBy</text>
  <text x="619" y="101" font-size="11" fill="#495057" text-anchor="middle">排序方式</text>

  <!-- 数据源 -->
  <rect x="20" y="128" width="180" height="34" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.5" rx="4"/>
  <text x="110" y="150" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="middle">goods（后端原始列表）</text>

  <!-- 汇聚线 -->
  <line x1="100" y1="114" x2="100" y2="130" stroke="#1971c2" stroke-width="1.5"/>
  <line x1="273" y1="114" x2="273" y2="130" stroke="#1971c2" stroke-width="1.5"/>
  <line x1="446" y1="114" x2="446" y2="130" stroke="#1971c2" stroke-width="1.5"/>
  <line x1="619" y1="114" x2="619" y2="130" stroke="#1971c2" stroke-width="1.5"/>
  <line x1="100" y1="130" x2="619" y2="130" stroke="#1971c2" stroke-width="1.5"/>
  <line x1="210" y1="162" x2="210" y2="130" stroke="#adb5bd" stroke-width="1.5"/>
  <line x1="360" y1="130" x2="360" y2="172" stroke="#e8590c" stroke-width="2"/>
  <polygon points="360,180 353,166 367,166" fill="#e8590c"/>

  <!-- ===== computed 流水线 ===== -->
  <rect x="20" y="180" width="680" height="212" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5" rx="4"/>
  <text x="36" y="204" font-weight="bold" fill="#e8590c" font-size="14" text-anchor="start">唯一的出口：computed filteredGoods</text>
  <text x="684" y="204" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#868e96" text-anchor="end">const filteredGoods = computed(() =&gt; { ... })</text>

  <!-- 步骤 1 -->
  <rect x="36" y="216" width="648" height="38" fill="#fff" stroke="#ffc078" stroke-width="1.5" rx="4"/>
  <circle cx="56" cy="235" r="10" fill="#e8590c"/>
  <text x="56" y="240" font-weight="bold" fill="#fff" font-size="11" text-anchor="middle">1</text>
  <text x="76" y="240" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="start">g.title.includes(kw)</text>
  <text x="330" y="240" font-size="11" fill="#868e96" text-anchor="start">关键词为空则整条通过（!kw || ...）</text>

  <!-- 步骤 2 -->
  <rect x="36" y="260" width="648" height="38" fill="#fff" stroke="#ffc078" stroke-width="1.5" rx="4"/>
  <circle cx="56" cy="279" r="10" fill="#e8590c"/>
  <text x="56" y="284" font-weight="bold" fill="#fff" font-size="11" text-anchor="middle">2</text>
  <text x="76" y="284" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="start">g.category === category</text>
  <text x="330" y="284" font-size="11" fill="#868e96" text-anchor="start">分类为空同样放行；四项是与的关系</text>

  <!-- 步骤 3 -->
  <rect x="36" y="304" width="648" height="38" fill="#fff" stroke="#ffc078" stroke-width="1.5" rx="4"/>
  <circle cx="56" cy="323" r="10" fill="#e8590c"/>
  <text x="56" y="328" font-weight="bold" fill="#fff" font-size="11" text-anchor="middle">3</text>
  <text x="76" y="328" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="start">p.min &lt;= g.price &amp;&amp; g.price &lt;= p.max</text>
  <text x="330" y="328" font-size="11" fill="#868e96" text-anchor="start">区间用闭区间，两端相等也要命中</text>

  <!-- 步骤 4 -->
  <rect x="36" y="348" width="648" height="38" fill="#fff" stroke="#ffc078" stroke-width="1.5" rx="4"/>
  <circle cx="56" cy="367" r="10" fill="#e8590c"/>
  <text x="56" y="372" font-weight="bold" fill="#fff" font-size="11" text-anchor="middle">4</text>
  <text x="76" y="372" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#495057" text-anchor="start">res.sort(cmp)</text>
  <text x="330" y="372" font-size="11" fill="#868e96" text-anchor="start">先过滤后排序，别对原数组直接 sort</text>

  <!-- ===== 出口 ===== -->
  <line x1="360" y1="392" x2="360" y2="406" stroke="#e8590c" stroke-width="2"/>
  <polygon points="360,414 353,400 367,400" fill="#e8590c"/>

  <rect x="20" y="414" width="330" height="58" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
  <text x="185" y="436" font-weight="bold" fill="#2f9e44" font-size="13" text-anchor="middle">有结果：渲染 GoodsCard 列表</text>
  <text x="185" y="458" font-size="11" fill="#495057" text-anchor="middle">模板只写 filteredGoods 一个名字</text>

  <rect x="370" y="414" width="330" height="58" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.5" rx="4"/>
  <text x="535" y="436" font-weight="bold" fill="#495057" font-size="13" text-anchor="middle">没结果：显示 EmptyState</text>
  <text x="535" y="458" font-size="11" fill="#868e96" text-anchor="middle">filteredGoods.length === 0</text>

  <text x="360" y="492" font-size="11" fill="#c92a2a" text-anchor="middle">✗ 别用 4 个 watch 手动同步列表：改一个条件要等一拍才刷新，还容易漏</text>
  <text x="360" y="508" font-size="11" fill="#868e96" text-anchor="middle">✓ computed 在这里的位置：四步过滤排序全在里面，对外只暴露一个结果</text>
</svg>