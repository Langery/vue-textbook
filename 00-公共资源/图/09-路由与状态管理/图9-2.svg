<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" font-family="system-ui,PingFang SC,sans-serif"><rect width="720" height="310" fill="#fafafa"/><text x="360" y="28" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">Vuex vs Pinia：Vue 状态管理的进化</text><rect x="20" y="50" width="330" height="240" fill="#fff5f5" stroke="#e03131" stroke-width="1.5" rx="4"/><text x="185" y="75" font-weight="bold" fill="#e03131" font-size="14" text-anchor="middle">Vuex 4（旧）</text><text x="185" y="105"  fill="#495057" font-size="11" text-anchor="middle">state / mutations / actions / getters</text><text x="185" y="135"  fill="#c92a2a" font-size="12" text-anchor="middle">繁琐：修改 state 必须通过 mutation</text><text x="185" y="160"  fill="#c92a2a" font-size="12" text-anchor="middle">module 嵌套，TypeScript 类型推导差</text><text x="185" y="195"  fill="#c92a2a" font-size="12" text-anchor="middle">大量模板代码</text><text x="185" y="230" font-weight="bold" fill="#e03131" font-size="11" text-anchor="middle">仍在 Vue 2 生态广泛使用</text><text x="185" y="260"  fill="#495057" font-size="10" text-anchor="middle">文件多：state.js / mutations.js / ...</text><rect x="370" y="50" width="330" height="240" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/><text x="535" y="75" font-weight="bold" fill="#2f9e44" font-size="14" text-anchor="middle">Pinia（新，官方推荐）</text><text x="535" y="105"  fill="#495057" font-size="11" text-anchor="middle">defineStore() → state / getters / actions</text><text x="535" y="135"  fill="#2f9e44" font-size="12" text-anchor="middle">简洁：直接赋值修改 state</text><text x="535" y="160"  fill="#2f9e44" font-size="12" text-anchor="middle">完美 TypeScript 支持</text><text x="535" y="195"  fill="#2f9e44" font-size="12" text-anchor="middle">无 mutations / 无 module 嵌套</text><text x="535" y="230" font-weight="bold" fill="#2f9e44" font-size="11" text-anchor="middle">Vue 3 官方推荐状态管理库</text><text x="535" y="260"  fill="#495057" font-size="10" text-anchor="middle">支持 DevTools / SSR / 插件系统</text></svg>