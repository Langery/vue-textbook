<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="system-ui,PingFang SC,sans-serif"><rect width="720" height="300" fill="#fafafa"/><text x="360" y="28" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">v-model 表单绑定全景：修饰符 + 绑定类型</text><rect x="20" y="50" width="330" height="230" fill="#e7f3ff" stroke="#1971c2" stroke-width="1.5" rx="4"/><text x="185" y="75" font-weight="bold" fill="#1971c2" font-size="14" text-anchor="middle">表单元素 & v-model 修饰符</text><rect x="35" y="95" width="300" height="30" fill="#cce5ff" stroke="#74c0fc" stroke-width="1.5" rx="4"/><text x="185" y="115"  fill="#1971c2" font-size="10" text-anchor="middle"><input v-model.lazy="name">  — .lazy</text><rect x="35" y="132" width="300" height="30" fill="#cce5ff" stroke="#74c0fc" stroke-width="1.5" rx="4"/><text x="185" y="152"  fill="#1971c2" font-size="10" text-anchor="middle"><input v-model.number="age"> — .number</text><rect x="35" y="169" width="300" height="30" fill="#cce5ff" stroke="#74c0fc" stroke-width="1.5" rx="4"/><text x="185" y="189"  fill="#1971c2" font-size="10" text-anchor="middle"><input v-model.trim="text">  — .trim</text><rect x="35" y="206" width="300" height="30" fill="#cce5ff" stroke="#74c0fc" stroke-width="1.5" rx="4"/><text x="185" y="226"  fill="#1971c2" font-size="10" text-anchor="middle"><select v-model="selected"></text><text x="185" y="246"  fill="#1971c2" font-size="10" text-anchor="middle"><textarea v-model="desc"></text><text x="185" y="266"  fill="#1971c2" font-size="9" text-anchor="middle"><input type="checkbox" v-model="ok"></text><rect x="370" y="50" width="330" height="230" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/><text x="535" y="75" font-weight="bold" fill="#2f9e44" font-size="14" text-anchor="middle">表单验证流程</text><rect x="385" y="95" width="300" height="30" fill="#d8f5cc" stroke="#a9e095" stroke-width="1.5" rx="4"/><text x="535" y="115"  fill="#2f9e44" font-size="11" text-anchor="middle">用户输入 → 触发规则校验</text><rect x="385" y="132" width="300" height="30" fill="#d8f5cc" stroke="#a9e095" stroke-width="1.5" rx="4"/><text x="535" y="152"  fill="#2f9e44" font-size="10" text-anchor="middle">规则：required / minLength / email...</text><rect x="385" y="169" width="300" height="30" fill="#d8f5cc" stroke="#a9e095" stroke-width="1.5" rx="4"/><text x="535" y="189"  fill="#c92a2a" font-size="11" text-anchor="middle">错误 → 显示错误提示 message</text><rect x="385" y="206" width="300" height="30" fill="#d8f5cc" stroke="#a9e095" stroke-width="1.5" rx="4"/><text x="535" y="226"  fill="#2f9e44" font-size="11" text-anchor="middle">全部通过 → 提交数据</text><rect x="385" y="243" width="300" height="30" fill="#d8f5cc" stroke="#a9e095" stroke-width="1.5" rx="4"/><text x="535" y="263"  fill="#2f9e44" font-size="10" text-anchor="middle">VeeValidate / 自定义规则 / Yup schema</text></svg>