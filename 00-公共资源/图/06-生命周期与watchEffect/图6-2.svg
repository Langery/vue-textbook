<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="system-ui,PingFang SC,sans-serif"><rect width="720" height="300" fill="#fafafa"/><text x="360" y="30" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">watchEffect vs watch：自动依赖追踪</text><rect x="20" y="55" width="330" height="225" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/><text x="185" y="80" font-weight="bold" fill="#2f9e44" font-size="14" text-anchor="middle">watchEffect() — 自动追踪</text><text x="185" y="110"  fill="#495057" font-size="12" text-anchor="middle">不需要手动指定依赖</text><text x="185" y="135"  fill="#2f9e44" font-size="11" text-anchor="middle">watchEffect(() => {</text><text x="185" y="155"  fill="#2f9e44" font-size="11" text-anchor="middle">  console.log(count.value)</text><text x="185" y="180"  fill="#495057" font-size="11" text-anchor="middle">自动追踪回调里访问的所有响应式数据</text><text x="185" y="210" font-weight="bold" fill="#2f9e44" font-size="11" text-anchor="middle">立即执行一次 + 依赖变化就执行</text><text x="185" y="245" font-weight="bold" fill="#2f9e44" font-size="11" text-anchor="middle">适合：简单的副作用 / 调试日志</text><rect x="370" y="55" width="330" height="225" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5" rx="4"/><text x="535" y="80" font-weight="bold" fill="#e8590c" font-size="14" text-anchor="middle">watch() — 精确控制</text><text x="535" y="110"  fill="#495057" font-size="12" text-anchor="middle">需要显式指定监听源</text><text x="535" y="135"  fill="#e8590c" font-size="11" text-anchor="middle">watch(count, (newVal, oldVal) => {</text><text x="535" y="155"  fill="#e8590c" font-size="11" text-anchor="middle">  fetchData(newVal)</text><text x="535" y="180"  fill="#495057" font-size="11" text-anchor="middle">可拿到新旧值、支持 immediate/deep</text><text x="535" y="210" font-weight="bold" fill="#e8590c" font-size="11" text-anchor="middle">默认不立即执行（除非 immediate: true）</text><text x="535" y="245" font-weight="bold" fill="#e8590c" font-size="11" text-anchor="middle">适合：API 请求 / 需要旧值对比</text></svg>