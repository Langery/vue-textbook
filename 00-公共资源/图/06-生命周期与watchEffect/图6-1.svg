<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="system-ui,PingFang SC,sans-serif"><rect width="720" height="400" fill="#fafafa"/><text x="360" y="28" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">Vue 组件生命周期全景图（组合式 API）</text><line x1="80" y1="60" x2="80" y2="370" stroke="#1971c2" stroke-width="3"/><circle cx="80" cy="60" r="12" fill="#1971c2"/><circle cx="80" cy="60" r="5" fill="white"/><text x="110" y="57" font-weight="bold" fill="#1971c2" font-size="13" text-anchor="start">setup() — 组件创建</text><text x="110" y="78"  fill="#495057" font-size="11" text-anchor="start">初始化响应式数据 / 计算属性 / 方法</text><circle cx="80" cy="130" r="10" fill="#2f9e44"/><circle cx="80" cy="130" r="4" fill="white"/><text x="110" y="127" font-weight="bold" fill="#2f9e44" font-size="13" text-anchor="start">onBeforeMount — 即将挂载</text><text x="110" y="148"  fill="#495057" font-size="11" text-anchor="start">此时 DOM 还不存在，无法操作</text><circle cx="80" cy="200" r="14" fill="#e8590c"/><circle cx="80" cy="200" r="6" fill="white"/><text x="110" y="197" font-weight="bold" fill="#e8590c" font-size="14" text-anchor="start">onMounted — 挂载完成（重要！）</text><text x="110" y="218"  fill="#c92a2a" font-size="11" text-anchor="start">DOM 已可用！适合发 API 请求 / 初始化第三方库</text><circle cx="80" cy="270" r="10" fill="#7048e8"/><circle cx="80" cy="270" r="4" fill="white"/><text x="110" y="267" font-weight="bold" fill="#7048e8" font-size="13" text-anchor="start">onBeforeUpdate — 数据变但 DOM 未更新</text><text x="110" y="288"  fill="#495057" font-size="11" text-anchor="start">可拿到更新前的 DOM 状态</text><circle cx="80" cy="320" r="10" fill="#f08c00"/><circle cx="80" cy="320" r="4" fill="white"/><text x="110" y="317" font-weight="bold" fill="#f08c00" font-size="13" text-anchor="start">onUpdated — DOM 更新完成</text><text x="110" y="338"  fill="#495057" font-size="11" text-anchor="start">DOM 已是最新，适合依赖 DOM 的操作</text><circle cx="80" cy="370" r="8" fill="#c92a2a"/><circle cx="80" cy="370" r="3" fill="white"/><text x="110" y="367" font-weight="bold" fill="#c92a2a" font-size="12" text-anchor="start">onBeforeUnmount — 即将销毁</text><text x="110" y="383"  fill="#c92a2a" font-size="10" text-anchor="start">清理定时器 / 取消订阅 / 移除事件监听</text><rect x="380" y="55" width="310" height="330" fill="#1e2128" stroke="#333" stroke-width="1.5" rx="4"/><text x="400" y="85"  fill="#81c784" font-size="11" text-anchor="start">import { onMounted,</text><text x="400" y="105"  fill="#81c784" font-size="11" text-anchor="start">  onBeforeUnmount }</text><text x="400" y="125"  fill="#81c784" font-size="11" text-anchor="start">from 'vue'</text><text x="400" y="160"  fill="#ffcc80" font-size="11" text-anchor="start">onMounted(() => {</text><text x="420" y="180"  fill="#aaa" font-size="10" text-anchor="start">// API 请求 / DOM 操作</text><text x="420" y="200"  fill="#fff" font-size="11" text-anchor="start">const timer = setInterval(...)</text><text x="400" y="225"  fill="#ffcc80" font-size="11" text-anchor="start">})</text><text x="400" y="260"  fill="#ffcc80" font-size="11" text-anchor="start">onBeforeUnmount(() => {</text><text x="420" y="280"  fill="#fff" font-size="11" text-anchor="start">clearInterval(timer)</text><text x="420" y="300"  fill="#aaa" font-size="10" text-anchor="start">// 清理副作用</text><text x="400" y="325"  fill="#ffcc80" font-size="11" text-anchor="start">})</text></svg>