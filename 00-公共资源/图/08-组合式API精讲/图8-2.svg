<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" font-family="system-ui,PingFang SC,sans-serif"><rect width="720" height="340" fill="#fafafa"/><text x="360" y="28" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">Composables：真正的逻辑复用</text><rect x="20" y="55" width="210" height="265" fill="#fff5f5" stroke="#e03131" stroke-width="1.5" rx="4"/><text x="125" y="80" font-weight="bold" fill="#e03131" font-size="14" text-anchor="middle">Mixin（过去）</text><text x="125" y="110"  fill="#c92a2a" font-size="12" text-anchor="middle">命名冲突风险</text><text x="125" y="140"  fill="#c92a2a" font-size="12" text-anchor="middle">属性来源不透明</text><text x="125" y="170"  fill="#c92a2a" font-size="12" text-anchor="middle">多个 mixin 相互覆盖</text><text x="125" y="200"  fill="#c92a2a" font-size="12" text-anchor="middle">难以 TypeScript 类型推导</text><text x="125" y="240"  fill="#c92a2a" font-size="12" text-anchor="middle">隐式依赖，阅读成本高</text><text x="125" y="280" font-weight="bold" fill="#e03131" font-size="11" text-anchor="middle">Vue 2 时代的痛</text><rect x="260" y="180" width="60" height="30" fill="#2f9e44" stroke="none" stroke-width="1.5" rx="4"/><text x="290" y="200" font-weight="bold" fill="#2f9e44" font-size="16" text-anchor="middle">-></text><rect x="310" y="55" width="390" height="265" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/><text x="505" y="80" font-weight="bold" fill="#2f9e44" font-size="14" text-anchor="middle">Composable（现在）</text><rect x="330" y="105" width="350" height="60" fill="#d8f5cc" stroke="#a9e095" stroke-width="1.5" rx="4"/><text x="505" y="125"  fill="#2f9e44" font-size="11" text-anchor="middle">// useMouse.js</text><text x="505" y="145"  fill="#2f9e44" font-size="11" text-anchor="middle">export function useMouse() {</text><text x="505" y="175" font-weight="bold" fill="#2f9e44" font-size="12" text-anchor="middle">显式 import，来源可知</text><text x="505" y="205" font-weight="bold" fill="#2f9e44" font-size="12" text-anchor="middle">命名空间隔离，无冲突</text><text x="505" y="235" font-weight="bold" fill="#2f9e44" font-size="12" text-anchor="middle">TypeScript 完美支持</text><text x="505" y="265" font-weight="bold" fill="#2f9e44" font-size="12" text-anchor="middle">可测试 / 可树摇优化</text><text x="505" y="300" font-weight="bold" fill="#1971c2" font-size="11" text-anchor="middle">VueUse: 200+ 现成 composables</text></svg>