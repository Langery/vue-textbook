<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" font-family="system-ui,PingFang SC,sans-serif"><rect width="720" height="340" fill="#fafafa"/><text x="360" y="28" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">组合式 API：从选项式的混乱到按功能组合</text><rect x="20" y="55" width="330" height="270" fill="#fff5f5" stroke="#e03131" stroke-width="1.5" rx="4"/><text x="185" y="80" font-weight="bold" fill="#e03131" font-size="14" text-anchor="middle">选项式 API（Vue 2 风格）</text><text x="185" y="110"  fill="#c92a2a" font-size="11" text-anchor="middle">data / methods / computed / watch</text><text x="185" y="135"  fill="#c92a2a" font-size="11" text-anchor="middle">同一功能的代码分散在多处</text><text x="185" y="165" font-weight="bold" fill="#e03131" font-size="12" text-anchor="middle">缺点：</text><text x="185" y="190"  fill="#c92a2a" font-size="10" text-anchor="middle">  功能改一处，要翻 data+methods+watch</text><text x="185" y="215"  fill="#c92a2a" font-size="10" text-anchor="middle">  大组件 500+ 行，后期难以维护</text><text x="185" y="240"  fill="#c92a2a" font-size="10" text-anchor="middle">  Mixin 命名冲突，来源不明</text><text x="185" y="285" font-weight="bold" fill="#e03131" font-size="11" text-anchor="middle">适合：小型/简单组件</text><rect x="370" y="55" width="330" height="270" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/><text x="535" y="80" font-weight="bold" fill="#2f9e44" font-size="14" text-anchor="middle">组合式 API（Vue 3）</text><text x="535" y="110"  fill="#2f9e44" font-size="11" text-anchor="middle">setup() / <script setup></text><text x="535" y="135"  fill="#2f9e44" font-size="11" text-anchor="middle">同一功能的代码写在一起</text><text x="535" y="165" font-weight="bold" fill="#2f9e44" font-size="12" text-anchor="middle">优点：</text><text x="535" y="190"  fill="#2f9e44" font-size="10" text-anchor="middle">  相关逻辑聚集，便于理解和维护</text><text x="535" y="215"  fill="#2f9e44" font-size="10" text-anchor="middle">  Composables 真正逻辑复用</text><text x="535" y="240"  fill="#2f9e44" font-size="10" text-anchor="middle">  TypeScript 完美支持，按需引入</text><text x="535" y="285" font-weight="bold" fill="#2f9e44" font-size="11" text-anchor="middle">适合：中大型/复杂组件</text></svg>