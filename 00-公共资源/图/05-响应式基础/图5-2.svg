<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" font-family="system-ui,PingFang SC,sans-serif"><rect width="720" height="340" fill="#fafafa"/><text x="360" y="30" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">computed vs watch：该用哪个？</text><rect x="20" y="55" width="330" height="265" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/><text x="185" y="80" font-weight="bold" fill="#2f9e44" font-size="14" text-anchor="middle">computed() — 计算属性</text><text x="185" y="110"  fill="#495057" font-size="12" text-anchor="middle">有缓存，依赖不变不重算</text><text x="185" y="140"  fill="#2f9e44" font-size="11" text-anchor="middle">const full = computed(() =></text><text x="185" y="158"  fill="#2f9e44" font-size="11" text-anchor="middle">  first + ' ' + last)</text><text x="185" y="190"  fill="#495057" font-size="11" text-anchor="middle">场景：过滤 / 排序 / 格式化 / 拼接</text><text x="185" y="215"  fill="#495057" font-size="11" text-anchor="middle">基于已有数据派生新值</text><text x="185" y="250" font-weight="bold" fill="#2f9e44" font-size="12" text-anchor="middle">决策: 需要"得到"一个值时</text><text x="185" y="280" font-weight="bold" fill="#2f9e44" font-size="13" text-anchor="middle">首选 computed</text><rect x="370" y="55" width="330" height="265" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5" rx="4"/><text x="535" y="80" font-weight="bold" fill="#e8590c" font-size="14" text-anchor="middle">watch() — 侦听器</text><text x="535" y="110"  fill="#495057" font-size="12" text-anchor="middle">无缓存，依赖变化就执行回调</text><text x="535" y="140"  fill="#e8590c" font-size="11" text-anchor="middle">watch(search, (new, old) => {</text><text x="535" y="158"  fill="#e8590c" font-size="11" text-anchor="middle">  fetchResults(new) })</text><text x="535" y="190"  fill="#495057" font-size="11" text-anchor="middle">场景：API 请求 / 路由变化 / 副作用</text><text x="535" y="215"  fill="#495057" font-size="11" text-anchor="middle">localStorage 同步 / 复杂异步逻辑</text><text x="535" y="250" font-weight="bold" fill="#e8590c" font-size="12" text-anchor="middle">决策: 需要"做"一件事时</text><text x="535" y="280" font-weight="bold" fill="#e8590c" font-size="13" text-anchor="middle">用 watch</text></svg>