<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" font-family="system-ui,PingFang SC,sans-serif"><rect width="720" height="340" fill="#fafafa"/><text x="360" y="30" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">ref() vs reactive()：两种响应式 API 对比</text><rect x="20" y="55" width="330" height="265" fill="#e7f3ff" stroke="#1971c2" stroke-width="1.5" rx="4"/><text x="185" y="80" font-weight="bold" fill="#1971c2" font-size="14" text-anchor="middle">ref() — 包装基本类型</text><rect x="35" y="100" width="300" height="40" fill="#cce5ff" stroke="#74c0fc" stroke-width="1.5" rx="4"/><text x="185" y="125"  fill="#1971c2" font-size="12" text-anchor="middle">const count = ref(0)</text><text x="185" y="155"  fill="#495057" font-size="12" text-anchor="middle">count.value++  // .value 访问</text><text x="185" y="185"  fill="#1971c2" font-size="12" text-anchor="middle">模板中自动解包：{{ count }}</text><text x="185" y="220" font-weight="bold" fill="#1971c2" font-size="11" text-anchor="middle">适用：String / Number / Boolean</text><text x="185" y="245" font-weight="bold" fill="#1971c2" font-size="11" text-anchor="middle">      单值 / 独立值</text><text x="185" y="280" font-weight="bold" fill="#2f9e44" font-size="12" text-anchor="middle">原则：不确定就用 ref()</text><rect x="370" y="55" width="330" height="265" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/><text x="535" y="80" font-weight="bold" fill="#2f9e44" font-size="14" text-anchor="middle">reactive() — 包装对象</text><rect x="385" y="100" width="300" height="40" fill="#d8f5cc" stroke="#a9e095" stroke-width="1.5" rx="4"/><text x="535" y="125"  fill="#2f9e44" font-size="11" text-anchor="middle">const state = reactive({ name: '...' })</text><text x="535" y="155"  fill="#495057" font-size="12" text-anchor="middle">state.count++  // 直接访问，无需 .value</text><text x="535" y="185"  fill="#2f9e44" font-size="12" text-anchor="middle">深层响应式：嵌套对象也自动追踪</text><text x="535" y="220" font-weight="bold" fill="#2f9e44" font-size="11" text-anchor="middle">适用：Object / Array / Map / Set</text><text x="535" y="245" font-weight="bold" fill="#2f9e44" font-size="11" text-anchor="middle">      表单 / 复杂状态对象</text><text x="535" y="280" font-weight="bold" fill="#c92a2a" font-size="12" text-anchor="middle">注意：不可替换整个对象</text></svg>