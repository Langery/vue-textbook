<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="system-ui,PingFang SC,sans-serif">
<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#666"/></marker></defs>
<rect width="720" height="400" fill="#fafafa"/>
<text x="360" y="30" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">高耦合 vs 低耦合的数据流对比</text>

<!-- 高耦合 -->
<text x="185" y="65" font-weight="bold" fill="#e03131" font-size="14" text-anchor="middle">高耦合 (Tight Coupling)</text>
<rect x="30" y="80" width="70" height="50" fill="#ffe3e3" stroke="#e03131" stroke-width="1.5" rx="4"/>
<text x="65" y="97"  fill="#c92a2a" font-size="11" text-anchor="middle">组件</text>
<text x="65" y="115" font-weight="bold" fill="#c92a2a" font-size="14" text-anchor="middle">A</text>
<rect x="160" y="80" width="70" height="50" fill="#ffe3e3" stroke="#e03131" stroke-width="1.5" rx="4"/>
<text x="195" y="97"  fill="#c92a2a" font-size="11" text-anchor="middle">组件</text>
<text x="195" y="115" font-weight="bold" fill="#c92a2a" font-size="14" text-anchor="middle">B</text>
<rect x="290" y="80" width="70" height="50" fill="#ffe3e3" stroke="#e03131" stroke-width="1.5" rx="4"/>
<text x="325" y="97"  fill="#c92a2a" font-size="11" text-anchor="middle">组件</text>
<text x="325" y="115" font-weight="bold" fill="#c92a2a" font-size="14" text-anchor="middle">C</text>
<!-- cross arrows for tight coupling -->
<line x1="100" y1="105" x2="155" y2="105" stroke="#e03131" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="230" y1="105" x2="285" y2="105" stroke="#e03131" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="65" y1="135" x2="320" y2="185" stroke="#e03131" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="325" y1="135" x2="70" y2="185" stroke="#e03131" stroke-width="2" marker-end="url(#arrowhead)"/>
<text x="195" y="170"  fill="#c92a2a" font-size="11" text-anchor="middle">互相知道内部细节</text>
<text x="195" y="190"  fill="#c92a2a" font-size="11" text-anchor="middle">改 A 就要改 B、C</text>

<!-- 低耦合 -->
<text x="535" y="65" font-weight="bold" fill="#2f9e44" font-size="14" text-anchor="middle">低耦合 (Loose Coupling)</text>
<rect x="420" y="80" width="70" height="50" fill="#d8f5cc" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
<text x="455" y="97"  fill="#2f9e44" font-size="11" text-anchor="middle">父组件</text>
<text x="455" y="115" font-weight="bold" fill="#2f9e44" font-size="12" text-anchor="middle">Parent</text>
<rect x="510" y="200" width="70" height="50" fill="#d8f5cc" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
<text x="545" y="217"  fill="#2f9e44" font-size="11" text-anchor="middle">组件</text>
<text x="545" y="235" font-weight="bold" fill="#2f9e44" font-size="14" text-anchor="middle">A</text>
<rect x="600" y="200" width="70" height="50" fill="#d8f5cc" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
<text x="635" y="217"  fill="#2f9e44" font-size="11" text-anchor="middle">组件</text>
<text x="635" y="235" font-weight="bold" fill="#2f9e44" font-size="14" text-anchor="middle">B</text>
<rect x="420" y="310" width="70" height="50" fill="#d8f5cc" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
<text x="455" y="327"  fill="#2f9e44" font-size="11" text-anchor="middle">组件</text>
<text x="455" y="345" font-weight="bold" fill="#2f9e44" font-size="14" text-anchor="middle">C</text>
<line x1="455" y1="130" x2="545" y2="195" stroke="#2f9e44" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="455" y1="130" x2="635" y2="195" stroke="#2f9e44" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="545" y1="250" x2="455" y2="305" stroke="#2f9e44" stroke-width="2" marker-end="url(#arrowhead)"/>
<line x1="635" y1="250" x2="455" y2="305" stroke="#2f9e44" stroke-width="2" marker-end="url(#arrowhead)"/>
<text x="550" y="160"  fill="#2f9e44" font-size="11" text-anchor="middle">Props ↓</text>
<text x="550" y="285"  fill="#2f9e44" font-size="11" text-anchor="middle">Emit ↑</text>
<text x="535" y="380" font-weight="bold" fill="#2f9e44" font-size="11" text-anchor="middle">组件之间互不知道对方存在</text>

</svg>