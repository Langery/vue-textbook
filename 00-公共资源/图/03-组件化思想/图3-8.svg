<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="system-ui,PingFang SC,sans-serif">
<rect width="720" height="400" fill="#fafafa"/>
<text x="360" y="28" font-weight="bold" fill="#212529" font-size="17" text-anchor="middle">Vue 应用是一棵组件树</text>

<!-- 根 -->
<rect x="305" y="55" width="110" height="34" fill="#fff" stroke="#1971c2" stroke-width="1.5" rx="4"/>
<text x="360" y="77" fill="#1971c2" font-size="13" font-weight="bold" text-anchor="middle">App.vue</text>
<text x="360" y="103" fill="#868e96" font-size="10" text-anchor="middle">根组件（树干）</text>

<!-- 一级子组件 -->
<rect x="80" y="155" width="110" height="32" fill="#fff" stroke="#adb5bd" rx="4"/>
<text x="135" y="175" fill="#495057" font-size="12" font-weight="bold" text-anchor="middle">Header.vue</text>

<rect x="305" y="155" width="110" height="32" fill="#fff" stroke="#adb5bd" rx="4"/>
<text x="360" y="175" fill="#495057" font-size="12" font-weight="bold" text-anchor="middle">HomePage.vue</text>

<rect x="530" y="155" width="110" height="32" fill="#fff" stroke="#adb5bd" rx="4"/>
<text x="585" y="175" fill="#495057" font-size="12" font-weight="bold" text-anchor="middle">Footer.vue</text>

<!-- 连线 App→Header / HomePage / Footer -->
<line x1="340" y1="89" x2="135" y2="155" stroke="#adb5bd" stroke-width="1"/>
<line x1="360" y1="89" x2="360" y2="155" stroke="#adb5bd" stroke-width="1"/>
<line x1="380" y1="89" x2="585" y2="155" stroke="#adb5bd" stroke-width="1"/>

<!-- 二级子组件 -->
<rect x="240" y="245" width="130" height="32" fill="#fff" stroke="#adb5bd" rx="4"/>
<text x="305" y="265" fill="#495057" font-size="12" font-weight="bold" text-anchor="middle">ProductList.vue</text>

<rect x="395" y="245" width="110" height="32" fill="#fff" stroke="#adb5bd" rx="4"/>
<text x="450" y="265" fill="#495057" font-size="12" font-weight="bold" text-anchor="middle">Sidebar.vue</text>

<line x1="335" y1="187" x2="305" y2="245" stroke="#adb5bd" stroke-width="1"/>
<line x1="385" y1="187" x2="450" y2="245" stroke="#adb5bd" stroke-width="1"/>

<!-- 三级子组件（叶子） -->
<rect x="160" y="330" width="100" height="28" fill="#f8f9fa" stroke="#adb5bd" rx="3"/>
<text x="210" y="349" fill="#495057" font-size="11" font-weight="bold" text-anchor="middle">ProductCard</text>

<rect x="280" y="330" width="100" height="28" fill="#f8f9fa" stroke="#adb5bd" rx="3"/>
<text x="330" y="349" fill="#495057" font-size="11" font-weight="bold" text-anchor="middle">ProductCard</text>

<text x="430" y="349" fill="#868e96" font-size="13" text-anchor="middle">......</text>

<line x1="280" y1="277" x2="210" y2="330" stroke="#adb5bd" stroke-width="1"/>
<line x1="330" y1="277" x2="330" y2="330" stroke="#adb5bd" stroke-width="1"/>

<!-- 注释：树干 / 主枝 / 侧枝 / 叶子 -->
<text x="40" y="260" fill="#868e96" font-size="10">🌿 树干 / 主枝 / 侧枝 / 叶子</text>
<text x="40" y="275" fill="#868e96" font-size="10">结构层次分明</text>
</svg>
