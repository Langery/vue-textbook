<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="system-ui,PingFang SC,sans-serif">

<rect width="720" height="380" fill="#fafafa"/>
<text x="360" y="30" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">过粗 vs 过细 vs 适中：组件粒度三问</text>

<!-- 过粗 -->
<rect x="20" y="55" width="210" height="305" fill="#fff5f5" stroke="#e03131" rx="6"/>
<text x="125" y="80" font-weight="bold" fill="#e03131" font-size="14" text-anchor="middle">过粗（神组件）</text>
<rect x="35" y="95" width="180" height="50" fill="#ffe3e3" stroke="#ffa8a8" stroke-width="1.5" rx="4"/>
<text x="125" y="115" font-weight="bold" fill="#c92a2a" font-size="12" text-anchor="middle">ProductPage.vue</text>
<text x="125" y="135"  fill="#c92a2a" font-size="10" text-anchor="middle">500+ 行 / 一个文件管全部</text>
<text x="125" y="175" font-weight="bold" fill="#e03131" font-size="12" text-anchor="middle">复用：0%</text>
<text x="125" y="200"  fill="#c92a2a" font-size="11" text-anchor="middle">测试：几乎不可能</text>
<text x="125" y="230"  fill="#c92a2a" font-size="11" text-anchor="middle">修改：牵一发动全身</text>
<text x="125" y="265"  fill="#c92a2a" font-size="11" text-anchor="middle">新人接手：看不懂</text>
<text x="125" y="310" font-weight="bold" fill="#e03131" font-size="12" text-anchor="middle">粒度三问：否否否</text>

<!-- 适中 -->
<rect x="255" y="55" width="210" height="305" fill="#f0f9e8" stroke="#2f9e44" rx="6"/>
<text x="360" y="80" font-weight="bold" fill="#2f9e44" font-size="14" text-anchor="middle">适中（推荐）</text>
<rect x="270" y="95" width="180" height="50" fill="#d8f5cc" stroke="#a9e095" stroke-width="1.5" rx="4"/>
<text x="360" y="113"  fill="#2f9e44" font-size="11" text-anchor="middle">ProductCard /</text>
<text x="360" y="131"  fill="#2f9e44" font-size="10" text-anchor="middle">ProductList / PriceTag</text>
<text x="360" y="175" font-weight="bold" fill="#2f9e44" font-size="12" text-anchor="middle">复用：高</text>
<text x="360" y="200"  fill="#2f9e44" font-size="11" text-anchor="middle">测试：独立可测</text>
<text x="360" y="230"  fill="#2f9e44" font-size="11" text-anchor="middle">修改：只改一个组件</text>
<text x="360" y="265"  fill="#2f9e44" font-size="11" text-anchor="middle">新人接手：自解释</text>
<text x="360" y="310" font-weight="bold" fill="#2f9e44" font-size="12" text-anchor="middle">粒度三问：是是是</text>

<!-- 过细 -->
<rect x="490" y="55" width="210" height="305" fill="#fff9db" stroke="#f08c00" rx="6"/>
<text x="595" y="80" font-weight="bold" fill="#f08c00" font-size="14" text-anchor="middle">过细（组件地狱）</text>
<rect x="505" y="95" width="180" height="50" fill="#fff3bf" stroke="#ffd43b" stroke-width="1.5" rx="4"/>
<text x="595" y="113"  fill="#f08c00" font-size="10" text-anchor="middle">ProductImage /</text>
<text x="595" y="131"  fill="#f08c00" font-size="9" text-anchor="middle">ProductName / Price / ...</text>
<text x="595" y="175" font-weight="bold" fill="#f08c00" font-size="12" text-anchor="middle">复用：低（太专一）</text>
<text x="595" y="200"  fill="#f08c00" font-size="11" text-anchor="middle">调试：数据传递地狱</text>
<text x="595" y="230"  fill="#f08c00" font-size="11" text-anchor="middle">修改：props 链断裂</text>
<text x="595" y="265"  fill="#f08c00" font-size="11" text-anchor="middle">维护：30+ 组件文件</text>
<text x="595" y="310" font-weight="bold" fill="#f08c00" font-size="12" text-anchor="middle">粒度三问：是是否</text>

<!-- Rule of thumb -->
<text x="360" y="370" font-weight="bold" fill="#495057" font-size="12" text-anchor="middle">粒度三问：① 能复用吗？ ② 有独立复杂度吗？ ③ 变化频率不同吗？</text>

</svg>