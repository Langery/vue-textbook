<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="system-ui,PingFang SC,sans-serif">
<rect width="720" height="400" fill="#fafafa"/>
<text x="360" y="28" font-weight="bold" fill="#212529" font-size="17" text-anchor="middle">终端验证 Node.js 和 npm</text>

<!-- 终端窗口：白边深底 -->
<rect x="80" y="55" width="560" height="290" fill="#1e1e1e" rx="6"/>
<rect x="80" y="55" width="560" height="30" fill="#3c3c3c" rx="6"/>
<rect x="80" y="79" width="560" height="6" fill="#3c3c3c"/>
<circle cx="100" cy="70" r="5" fill="#ff5f57"/>
<circle cx="118" cy="70" r="5" fill="#febc2e"/>
<circle cx="136" cy="70" r="5" fill="#28c840"/>
<text x="360" y="74" fill="#cccccc" font-size="11" font-family="monospace" text-anchor="middle">zsh — node -v</text>

<!-- 终端内容 -->
<g font-family="monospace" font-size="13" fill="#d4d4d4">
<text x="100" y="115">$ node -v</text>
<text x="100" y="142" fill="#7ec699">v20.11.1</text>
<text x="100" y="180">$ npm -v</text>
<text x="100" y="207" fill="#7ec699">10.2.4</text>
<text x="100" y="255">$ <tspan fill="#ffffff">▌</tspan></text>
</g>

<!-- 注解（用浅色，灰色边）-->
<rect x="220" y="128" width="80" height="22" fill="#fff" stroke="#adb5bd" rx="3"/>
<text x="260" y="143" fill="#495057" font-size="10" font-family="monospace" text-anchor="middle">v20.11.1</text>

<rect x="220" y="193" width="60" height="22" fill="#fff" stroke="#adb5bd" rx="3"/>
<text x="250" y="208" fill="#495057" font-size="10" font-family="monospace" text-anchor="middle">10.2.4</text>

<!-- 注解说明 -->
<text x="320" y="143" fill="#868e96" font-size="10">← Node.js 版本（应 ≥ v18）</text>
<text x="300" y="208" fill="#868e96" font-size="10">← npm 版本（应 ≥ 9.0）</text>

<!-- 底部说明框 -->
<rect x="80" y="305" width="560" height="28" fill="#ebfbee" stroke="#b2f2bb" rx="4"/>
<text x="360" y="323" fill="#2b8a3e" font-size="11" font-weight="bold" text-anchor="middle">✓ 都显示版本号 → Node.js + npm 装好了</text>
</svg>
