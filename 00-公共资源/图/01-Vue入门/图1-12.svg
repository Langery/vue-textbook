<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="system-ui,PingFang SC,sans-serif">
<rect width="720" height="400" fill="#fafafa"/>
<text x="360" y="28" font-weight="bold" fill="#212529" font-size="17" text-anchor="middle">第一个组件运行效果</text>

<!-- 浏览器窗口 -->
<rect x="180" y="55" width="360" height="290" fill="#fff" stroke="#adb5bd" rx="4"/>
<rect x="180" y="55" width="360" height="34" fill="#f1f3f5" rx="4"/>
<rect x="180" y="83" width="360" height="6" fill="#f1f3f5"/>
<circle cx="198" cy="72" r="5" fill="#ff5f57"/>
<circle cx="214" cy="72" r="5" fill="#febc2e"/>
<circle cx="230" cy="72" r="5" fill="#28c840"/>
<rect x="250" y="62" width="240" height="20" fill="#fff" stroke="#dee2e6" rx="10"/>
<text x="370" y="76" fill="#495057" font-size="11" font-family="monospace" text-anchor="middle">http://localhost:5173/</text>

<!-- 内容 -->
<text x="360" y="190" fill="#42b883" font-size="44" font-weight="bold" text-anchor="middle">你好，Vue！</text>
<text x="360" y="280" fill="#868e96" font-size="11" text-anchor="middle">— 居中显示，距顶 100px —</text>

<!-- 注解：左 -->
<rect x="20" y="160" width="148" height="46" fill="#f8f9fa" stroke="#dee2e6" rx="3"/>
<text x="94" y="180" fill="#495057" font-size="11" font-weight="bold" text-anchor="middle">居中 + 距顶 100px</text>
<text x="94" y="196" fill="#868e96" font-size="10" text-anchor="middle" font-family="monospace">margin-top: 100px</text>
<line x1="170" y1="183" x2="280" y2="183" stroke="#adb5bd" stroke-width="1" stroke-dasharray="3,2"/>

<!-- 注解：右 -->
<rect x="552" y="160" width="148" height="46" fill="#f8f9fa" stroke="#dee2e6" rx="3"/>
<text x="626" y="180" fill="#495057" font-size="11" font-weight="bold" text-anchor="middle">颜色 #42b883</text>
<text x="626" y="196" fill="#868e96" font-size="10" text-anchor="middle">Vue 官方绿</text>
<line x1="552" y1="183" x2="450" y2="183" stroke="#adb5bd" stroke-width="1" stroke-dasharray="3,2"/>

<!-- 底部 -->
<rect x="180" y="365" width="360" height="22" fill="#fff8db" stroke="#ffe066" rx="3"/>
<text x="360" y="380" fill="#e67700" font-size="11" text-anchor="middle">💡 保存 .vue 文件后浏览器自动刷新（Vite HMR 热更新）</text>
</svg>
