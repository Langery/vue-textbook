<!DOCTYPE html>
<!--
  figure-1-2 v1 — Vue 时代只需要"声明"，不用"操作"
  风格：左→中→右 三段式，单向清晰
  模板：dataflow
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>图 1-2 Vue 时代你只需要"声明"，不用"操作"</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #fffaf0;
    font-family: "Comic Sans MS", "Marker Felt", "STXingkai", "华文行楷", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  #capture { width: 900px; padding: 24px 40px 30px; background: #fffaf0; }
  .figure-title {
    font-size: 26px; font-weight: bold; color: #2c2c2c;
    text-align: center; margin-bottom: 26px; letter-spacing: 0.5px;
  }
  .canvas {
    display: flex; align-items: center; justify-content: center;
    gap: 30px; margin: 20px 0;
  }
  .node {
    border: 2.5px solid #1e1e1e; border-radius: 14px;
    padding: 20px 24px; text-align: center;
    font-weight: bold; box-shadow: 4px 5px 0 rgba(0,0,0,0.15);
  }
  /* 左侧：数据 */
  .node-data {
    background: #b2f2bb; width: 200px;
  }
  .node-data .code {
    font-family: "Courier New", "Menlo", monospace;
    font-size: 16px; background: #fffaf0;
    padding: 6px 10px; border-radius: 6px;
    border: 1.5px solid #1e1e1e; margin-top: 8px;
  }
  /* 中间：Vue 引擎 */
  .node-vue {
    background: #42b883; color: #fffaf0; width: 200px;
    border-color: #2f9e44; position: relative;
  }
  .node-vue .logo { font-size: 40px; margin-bottom: 4px; }
  .node-vue .name { font-size: 22px; }
  .node-vue .sub { font-size: 13px; font-style: italic; margin-top: 6px; opacity: 0.9; }
  /* 右侧：UI */
  .node-ui {
    background: #a5d8ff; width: 200px;
  }
  .node-ui .btn-mock {
    background: #ffc9c9; border: 2.5px solid #1e1e1e;
    border-radius: 8px; padding: 10px 16px;
    font-size: 18px; margin-top: 10px;
    display: inline-block; transform: rotate(-2deg);
  }
  /* 箭头 */
  .arrow-block { text-align: center; }
  .arrow-flow {
    font-size: 36px; font-weight: bold; color: #1e1e1e;
  }
  .arrow-label {
    font-size: 15px; color: #5c5c5c; margin-top: 2px;
    font-weight: bold;
  }
  .equation { text-align: center; font-size: 20px; color: #5c5c5c; margin-top: 22px; font-style: italic; }
  .jitter { filter: url(#handDrawn); }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute;">
    <defs>
      <filter id="handDrawn">
        <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="13"/>
        <feDisplacementMap in="SourceGraphic" scale="2.5"/>
      </filter>
    </defs>
  </svg>

  <div id="capture">
    <div class="figure-title">图 1-2 &nbsp; Vue 时代你只需要"声明"，不用"操作"</div>

    <div class="canvas">
      <!-- 左侧：数据 -->
      <div class="node node-data jitter">
        <div style="font-size: 32px;">📊</div>
        <div style="font-size: 18px;">数据</div>
        <div class="code">const count = ref(0)</div>
      </div>

      <!-- 箭头 1：数据 → Vue -->
      <div class="arrow-block">
        <div class="arrow-flow">──→</div>
        <div class="arrow-label">声明依赖</div>
      </div>

      <!-- 中间：Vue 响应式引擎 -->
      <div class="node node-vue jitter">
        <div class="logo">▲</div>
        <div class="name">Vue 引擎</div>
        <div class="sub">响应式系统<br>Proxy 自动追踪</div>
      </div>

      <!-- 箭头 2：Vue → UI -->
      <div class="arrow-block">
        <div class="arrow-flow">──→</div>
        <div class="arrow-label">自动更新</div>
      </div>

      <!-- 右侧：UI -->
      <div class="node node-ui jitter">
        <div style="font-size: 32px;">🖼️</div>
        <div style="font-size: 18px;">UI（长相）</div>
        <div class="btn-mock">👍 {{ count }}</div>
      </div>
    </div>

    <div class="equation">你只改数据，<strong>UI 自动跟着变</strong></div>
  </div>
</body>
</html>
