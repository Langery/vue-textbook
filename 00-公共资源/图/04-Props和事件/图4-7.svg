<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" font-family="system-ui,PingFang SC,sans-serif"><rect width="720" height="280" fill="#fafafa"/><text x="360" y="30" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">v-model 的本质：Props + Emit 的语法糖</text><rect x="20" y="55" width="320" height="60" fill="#fff5f5" stroke="#e03131" stroke-width="1.5" rx="4"/><text x="180" y="80" font-weight="bold" fill="#c92a2a" font-size="14" text-anchor="middle">传统写法（麻烦）</text><text x="180" y="105"  fill="#c92a2a" font-size="9" text-anchor="middle"><Input :modelValue="text" @update:modelValue="text = $event" /></text><text x="360" y="130" font-weight="bold" fill="#2f9e44" font-size="14" text-anchor="middle">等价于</text><rect x="20" y="150" width="320" height="50" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/><text x="180" y="172" font-weight="bold" fill="#2f9e44" font-size="14" text-anchor="middle">v-model 写法（简洁）</text><text x="180" y="192" font-weight="bold" fill="#2f9e44" font-size="12" text-anchor="middle"><Input v-model="text" /></text><rect x="380" y="55" width="320" height="210" fill="#e7f3ff" stroke="#1971c2" stroke-width="1.5" rx="4"/><text x="540" y="80" font-weight="bold" fill="#1971c2" font-size="14" text-anchor="middle">v-model 修饰符</text><rect x="400" y="105" width="280" height="28" fill="#cce5ff" stroke="#74c0fc" stroke-width="1.5" rx="4"/><text x="540" y="123"  fill="#1971c2" font-size="11" text-anchor="middle">.lazy  — change 事件时才更新</text><rect x="400" y="140" width="280" height="28" fill="#cce5ff" stroke="#74c0fc" stroke-width="1.5" rx="4"/><text x="540" y="158"  fill="#1971c2" font-size="11" text-anchor="middle">.number  — 自动转为数字类型</text><rect x="400" y="175" width="280" height="28" fill="#cce5ff" stroke="#74c0fc" stroke-width="1.5" rx="4"/><text x="540" y="193"  fill="#1971c2" font-size="11" text-anchor="middle">.trim  — 自动去除首尾空格</text><rect x="400" y="210" width="280" height="28" fill="#cce5ff" stroke="#74c0fc" stroke-width="1.5" rx="4"/><text x="540" y="228"  fill="#1971c2" font-size="11" text-anchor="middle">v-model:title  — 自定义 model 参数</text></svg>