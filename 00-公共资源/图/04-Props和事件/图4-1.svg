<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" font-family="system-ui,PingFang SC,sans-serif"><rect width="720" height="320" fill="#fafafa"/><text x="360" y="30" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">Props 定义方式：数组语法 → 对象语法 → TypeScript</text><rect x="20" y="55" width="210" height="245" fill="#fff5f5" stroke="#e03131" stroke-width="1.5" rx="4"/><text x="125" y="80" font-weight="bold" fill="#e03131" font-size="13" text-anchor="middle">数组语法（简单）</text><rect x="35" y="100" width="180" height="45" fill="#ffe3e3" stroke="#ffa8a8" stroke-width="1.5" rx="4"/><text x="125" y="120"  fill="#c92a2a" font-size="12" text-anchor="middle">props: ['title']</text><text x="125" y="140"  fill="#c92a2a" font-size="11" text-anchor="middle">无类型约束</text><text x="125" y="175" font-weight="bold" fill="#e03131" font-size="13" text-anchor="middle">缺点</text><text x="125" y="200"  fill="#c92a2a" font-size="10" text-anchor="middle">不知道类型 / 不验证必填 / 无默认值</text><text x="125" y="235" font-weight="bold" fill="#e03131" font-size="11" text-anchor="middle">仅原型阶段</text><text x="125" y="260" font-weight="bold" fill="#e03131" font-size="12" text-anchor="middle">不推荐</text><rect x="252" y="55" width="216" height="245" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/><text x="360" y="80" font-weight="bold" fill="#2f9e44" font-size="13" text-anchor="middle">对象语法（推荐）</text><rect x="267" y="100" width="186" height="50" fill="#d8f5cc" stroke="#a9e095" stroke-width="1.5" rx="4"/><text x="360" y="118"  fill="#2f9e44" font-size="11" text-anchor="middle">props: { title: String,</text><text x="360" y="138"  fill="#2f9e44" font-size="11" text-anchor="middle">  count: { type: Number</text><text x="360" y="175"  fill="#2f9e44" font-size="12" text-anchor="middle">类型检查 / required</text><text x="360" y="200"  fill="#2f9e44" font-size="12" text-anchor="middle">default / validator</text><text x="360" y="235" font-weight="bold" fill="#2f9e44" font-size="12" text-anchor="middle">生产推荐</text><text x="360" y="260" font-weight="bold" fill="#2f9e44" font-size="12" text-anchor="middle">Vue 3 标准写法</text><rect x="490" y="55" width="210" height="245" fill="#e7f3ff" stroke="#1971c2" stroke-width="1.5" rx="4"/><text x="595" y="80" font-weight="bold" fill="#1971c2" font-size="13" text-anchor="middle">TypeScript（最佳）</text><rect x="505" y="100" width="180" height="50" fill="#cce5ff" stroke="#74c0fc" stroke-width="1.5" rx="4"/><text x="595" y="118"  fill="#1971c2" font-size="11" text-anchor="middle">defineProps<{</text><text x="595" y="138"  fill="#1971c2" font-size="11" text-anchor="middle">  title: string }>()</text><text x="595" y="175"  fill="#1971c2" font-size="12" text-anchor="middle">编译时类型安全</text><text x="595" y="200"  fill="#1971c2" font-size="12" text-anchor="middle">IDE 智能提示 & 重构安全</text><text x="595" y="235" font-weight="bold" fill="#1971c2" font-size="12" text-anchor="middle">Vue 3 + TS 推荐</text><text x="595" y="260" font-weight="bold" fill="#1971c2" font-size="12" text-anchor="middle">最佳体验</text></svg>