<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="system-ui,PingFang SC,sans-serif"><defs><marker id="a" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#666"/></marker></defs>
<rect width="720" height="300" fill="#fafafa"/>
<text x="360" y="30" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">v-model 的本质：Props + Emit 的语法糖</text>

<rect x="20" y="55" width="320" height="65" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1.5" rx="4"/>
<text x="180" y="80" font-weight="bold" fill="#495057" font-size="14" text-anchor="middle">传统写法（麻烦）</text>
<text x="180" y="105"  fill="#c92a2a" font-size="10" text-anchor="middle">&lt;Input :modelValue=&quot;text&quot; @update:modelValue=&quot;text = $event&quot; /&gt;</text>

<line x1="180" y1="130" x2="180" y2="160" stroke="#2f9e44" stroke-width="2" marker-end="url(#a)"/>
<text x="180" y="150" font-weight="bold" fill="#2f9e44" font-size="11" text-anchor="middle">等价于</text>

<rect x="20" y="165" width="320" height="50" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
<text x="180" y="190" font-weight="bold" fill="#2f9e44" font-size="14" text-anchor="middle">v-model 写法（简洁）</text>
<text x="180" y="210" font-weight="bold" fill="#2f9e44" font-size="12" text-anchor="middle">&lt;Input v-model=&quot;text&quot; /&gt;</text>

<rect x="380" y="55" width="320" height="225" fill="#e7f3ff" stroke="#1971c2" stroke-width="1.5" rx="4"/>
<text x="540" y="80" font-weight="bold" fill="#1971c2" font-size="14" text-anchor="middle">v-model 修饰符</text>
<rect x="400" y="100" width="280" height="30" fill="#cce5ff" stroke="#74c0fc" stroke-width="1.5" rx="4"/>
<text x="540" y="120"  fill="#1971c2" font-size="11" text-anchor="middle">.lazy — change 事件时更新</text>
<rect x="400" y="140" width="280" height="30" fill="#cce5ff" stroke="#74c0fc" stroke-width="1.5" rx="4"/>
<text x="540" y="160"  fill="#1971c2" font-size="11" text-anchor="middle">.number — 自动转数字</text>
<rect x="400" y="180" width="280" height="30" fill="#cce5ff" stroke="#74c0fc" stroke-width="1.5" rx="4"/>
<text x="540" y="200"  fill="#1971c2" font-size="11" text-anchor="middle">.trim — 自动去首尾空格</text>
<rect x="400" y="220" width="280" height="30" fill="#cce5ff" stroke="#74c0fc" stroke-width="1.5" rx="4"/>
<text x="540" y="240"  fill="#1971c2" font-size="11" text-anchor="middle">自定义 v-model 参数</text>
<text x="540" y="255" font-weight="bold" fill="#1971c2" font-size="11" text-anchor="middle">v-model:title</text>
</svg>