<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" font-family="system-ui,PingFang SC,sans-serif"><defs><marker id="a" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#666"/></marker></defs>
<rect width="720" height="340" fill="#fafafa"/>
<text x="360" y="28" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">Provide / Inject：跨层级数据传递</text>

<rect x="260" y="50" width="200" height="40" fill="#e7f3ff" stroke="#1971c2" stroke-width="1.5" rx="4"/>
<text x="360" y="76" font-weight="bold" fill="#1971c2" font-size="14" text-anchor="middle">根组件 (provide)</text>
<line x1="360" y1="95" x2="180" y2="130" stroke="#1971c2" stroke-width="2" marker-end="url(#a)"/>
<line x1="360" y1="95" x2="540" y2="130" stroke="#1971c2" stroke-width="2" marker-end="url(#a)"/>
<line x1="360" y1="95" x2="360" y2="145" stroke="#1971c2" stroke-width="2" marker-end="url(#a)"/>

<rect x="100" y="135" width="160" height="40" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
<text x="180" y="161" font-weight="bold" fill="#2f9e44" font-size="13" text-anchor="middle">Header</text>
<line x1="180" y1="180" x2="140" y2="215" stroke="#2f9e44" stroke-width="2" marker-end="url(#a)"/>

<rect x="310" y="150" width="100" height="40" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
<text x="360" y="176" font-weight="bold" fill="#2f9e44" font-size="12" text-anchor="middle">Main (inject)</text>
<line x1="360" y1="195" x2="360" y2="240" stroke="#2f9e44" stroke-width="2" marker-end="url(#a)"/>

<rect x="460" y="135" width="160" height="40" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/>
<text x="540" y="161" font-weight="bold" fill="#2f9e44" font-size="13" text-anchor="middle">Sidebar</text>
<line x1="540" y1="180" x2="500" y2="215" stroke="#2f9e44" stroke-width="2" marker-end="url(#a)"/>

<rect x="120" y="220" width="100" height="40" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5" rx="4"/>
<text x="170" y="246"  fill="#e8590c" font-size="11" text-anchor="middle">Logo (inject)</text>
<rect x="310" y="245" width="120" height="40" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5" rx="4"/>
<text x="370" y="271"  fill="#e8590c" font-size="11" text-anchor="middle">Card (inject)</text>
<rect x="480" y="220" width="100" height="40" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5" rx="4"/>
<text x="530" y="246"  fill="#e8590c" font-size="11" text-anchor="middle">Menu (inject)</text>

<text x="360" y="320" font-weight="bold" fill="#495057" font-size="12" text-anchor="middle">provide('key', value)  →  inject('key')  任意层级后代都可以拿到</text>
</svg>