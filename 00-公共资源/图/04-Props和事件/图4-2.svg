<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="system-ui,PingFang SC,sans-serif">
<defs>
    <marker id="arrow-good" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#2b8a3e"/></marker>
    <marker id="arrow-bad" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto-start-reverse">
        <polygon points="0 0, 10 3.5, 0 7" fill="#c92a2a"/></marker>
</defs>
<rect width="720" height="400" fill="#fafafa"/>
<text x="360" y="28" font-weight="bold" fill="#212529" font-size="17" text-anchor="middle">单向数据流：父 → 子（不能反向）</text>

<!-- 父组件 -->
<rect x="40" y="55" width="260" height="280" fill="#fff" stroke="#adb5bd" rx="4"/>
<text x="170" y="82" font-weight="bold" fill="#495057" font-size="13" text-anchor="middle">父组件（数据所有者）</text>
<rect x="56" y="100" width="228" height="32" fill="#f8f9fa" stroke="#dee2e6" rx="3"/>
<text x="170" y="121" fill="#495057" font-size="11" font-family="monospace" text-anchor="middle">data.user.name = "张三"</text>
<rect x="56" y="140" width="228" height="32" fill="#f8f9fa" stroke="#dee2e6" rx="3"/>
<text x="170" y="161" fill="#495057" font-size="11" font-family="monospace" text-anchor="middle">模板里绑定 prop</text>
<text x="170" y="208" fill="#2b8a3e" font-size="11" font-weight="bold" text-anchor="middle">可以：定义 + 修改</text>
<text x="170" y="228" fill="#868e96" font-size="10" text-anchor="middle">负责把数据"传下去"</text>
<rect x="56" y="270" width="228" height="32" fill="#ebfbee" stroke="#b2f2bb" rx="3"/>
<text x="170" y="291" fill="#2b8a3e" font-size="11" font-weight="bold" text-anchor="middle">👑 数据的"老板"</text>

<!-- 子组件 -->
<rect x="420" y="55" width="260" height="280" fill="#fff" stroke="#adb5bd" rx="4"/>
<text x="550" y="82" font-weight="bold" fill="#495057" font-size="13" text-anchor="middle">子组件（只读消费者）</text>
<rect x="436" y="100" width="228" height="32" fill="#f8f9fa" stroke="#dee2e6" rx="3"/>
<text x="550" y="121" fill="#495057" font-size="11" font-family="monospace" text-anchor="middle">defineProps({ name })</text>
<rect x="436" y="140" width="228" height="32" fill="#f8f9fa" stroke="#dee2e6" rx="3"/>
<text x="550" y="161" fill="#495057" font-size="11" font-family="monospace" text-anchor="middle">模板里用 {{ name }}</text>
<text x="550" y="208" fill="#2b8a3e" font-size="11" font-weight="bold" text-anchor="middle">可以：读取 + 渲染</text>
<text x="550" y="228" fill="#c92a2a" font-size="10" text-anchor="middle">不能：直接改 props.name</text>
<rect x="436" y="270" width="228" height="32" fill="#f8f9fa" stroke="#dee2e6" rx="3"/>
<text x="550" y="291" fill="#495057" font-size="11" font-weight="bold" text-anchor="middle">📖 数据的"用户"</text>

<!-- 正向箭头：父→子 -->
<line x1="305" y1="195" x2="395" y2="195" stroke="#2b8a3e" stroke-width="2" marker-end="url(#arrow-good)"/>
<text x="350" y="187" fill="#2b8a3e" font-size="11" font-weight="bold" text-anchor="middle">:name="user.name"</text>
<rect x="318" y="205" width="64" height="20" fill="#ebfbee" stroke="#b2f2bb" rx="3"/>
<text x="350" y="219" fill="#2b8a3e" font-size="10" font-weight="bold" text-anchor="middle">✓ 允许</text>

<!-- 反向箭头：子→父（禁止） -->
<line x1="395" y1="320" x2="305" y2="320" stroke="#c92a2a" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-bad)"/>
<text x="350" y="313" fill="#c92a2a" font-size="11" font-weight="bold" text-anchor="middle">props.name = "李四"</text>
<rect x="318" y="332" width="64" height="20" fill="#fff5f5" stroke="#ffc9c9" rx="3"/>
<text x="350" y="346" fill="#c92a2a" font-size="10" font-weight="bold" text-anchor="middle">✗ 禁止</text>
</svg>
