<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="system-ui,PingFang SC,sans-serif">
<rect width="720" height="400" fill="#fafafa"/>
<text x="360" y="28" font-weight="bold" fill="#212529" font-size="17" text-anchor="middle">模板里常用的 8 类 JS 表达式</text>

<!-- 第 1 行：4 个卡片 y=55 -->
<!-- 1. 变量 -->
<rect x="40" y="55" width="155" height="155" fill="#fff" stroke="#adb5bd" rx="4"/>
<text x="117" y="78" fill="#1971c2" font-size="11" font-weight="bold" text-anchor="middle">① 变量</text>
<rect x="55" y="88" width="125" height="28" fill="#f8f9fa" stroke="#dee2e6" rx="3"/>
<text x="117" y="107" fill="#495057" font-size="11" font-family="monospace" text-anchor="middle">{{ name }}</text>
<text x="117" y="140" fill="#868e96" font-size="10" text-anchor="middle">直接显示值</text>
<rect x="55" y="160" width="125" height="26" fill="#f1f3f5" stroke="#dee2e6" rx="3"/>
<text x="117" y="178" fill="#495057" font-size="11" text-anchor="middle">→ "张三"</text>

<!-- 2. 算术 -->
<rect x="205" y="55" width="155" height="155" fill="#fff" stroke="#adb5bd" rx="4"/>
<text x="282" y="78" fill="#1971c2" font-size="11" font-weight="bold" text-anchor="middle">② 算术运算</text>
<rect x="220" y="88" width="125" height="28" fill="#f8f9fa" stroke="#dee2e6" rx="3"/>
<text x="282" y="107" fill="#495057" font-size="11" font-family="monospace" text-anchor="middle">{{ price * count }}</text>
<text x="282" y="140" fill="#868e96" font-size="10" text-anchor="middle">±×÷ 都能写</text>
<rect x="220" y="160" width="125" height="26" fill="#f1f3f5" stroke="#dee2e6" rx="3"/>
<text x="282" y="178" fill="#495057" font-size="11" text-anchor="middle">→ 297</text>

<!-- 3. 比较 -->
<rect x="370" y="55" width="155" height="155" fill="#fff" stroke="#adb5bd" rx="4"/>
<text x="447" y="78" fill="#1971c2" font-size="11" font-weight="bold" text-anchor="middle">③ 比较运算</text>
<rect x="385" y="88" width="125" height="28" fill="#f8f9fa" stroke="#dee2e6" rx="3"/>
<text x="447" y="107" fill="#495057" font-size="11" font-family="monospace" text-anchor="middle">{{ age >= 18 }}</text>
<text x="447" y="140" fill="#868e96" font-size="10" text-anchor="middle">==  !=  &gt;  &lt;</text>
<rect x="385" y="160" width="125" height="26" fill="#f1f3f5" stroke="#dee2e6" rx="3"/>
<text x="447" y="178" fill="#495057" font-size="11" text-anchor="middle">→ true</text>

<!-- 4. 三元 -->
<rect x="535" y="55" width="155" height="155" fill="#fff" stroke="#adb5bd" rx="4"/>
<text x="612" y="78" fill="#1971c2" font-size="11" font-weight="bold" text-anchor="middle">④ 三元运算</text>
<rect x="550" y="88" width="125" height="28" fill="#f8f9fa" stroke="#dee2e6" rx="3"/>
<text x="612" y="107" fill="#495057" font-size="10" font-family="monospace" text-anchor="middle">{{ ok ? '是' : '否' }}</text>
<text x="612" y="140" fill="#868e96" font-size="10" text-anchor="middle">简单 if/else</text>
<rect x="550" y="160" width="125" height="26" fill="#f1f3f5" stroke="#dee2e6" rx="3"/>
<text x="612" y="178" fill="#495057" font-size="11" text-anchor="middle">→ "是"</text>

<!-- 第 2 行：4 个卡片 y=225 -->
<!-- 5. 逻辑 -->
<rect x="40" y="225" width="155" height="155" fill="#fff" stroke="#adb5bd" rx="4"/>
<text x="117" y="248" fill="#1971c2" font-size="11" font-weight="bold" text-anchor="middle">⑤ 逻辑运算</text>
<rect x="55" y="258" width="125" height="28" fill="#f8f9fa" stroke="#dee2e6" rx="3"/>
<text x="117" y="277" fill="#495057" font-size="11" font-family="monospace" text-anchor="middle">{{ a && b }}</text>
<text x="117" y="310" fill="#868e96" font-size="10" text-anchor="middle">&amp;&amp; || !</text>
<rect x="55" y="330" width="125" height="26" fill="#f1f3f5" stroke="#dee2e6" rx="3"/>
<text x="117" y="348" fill="#495057" font-size="11" text-anchor="middle">→ 结果</text>

<!-- 6. 字符串方法 -->
<rect x="205" y="225" width="155" height="155" fill="#fff" stroke="#adb5bd" rx="4"/>
<text x="282" y="248" fill="#1971c2" font-size="11" font-weight="bold" text-anchor="middle">⑥ 字符串方法</text>
<rect x="220" y="258" width="125" height="28" fill="#f8f9fa" stroke="#dee2e6" rx="3"/>
<text x="282" y="277" fill="#495057" font-size="10" font-family="monospace" text-anchor="middle">{{ s.toUpperCase() }}</text>
<text x="282" y="310" fill="#868e96" font-size="10" text-anchor="middle">.length .slice ...</text>
<rect x="220" y="330" width="125" height="26" fill="#f1f3f5" stroke="#dee2e6" rx="3"/>
<text x="282" y="348" fill="#495057" font-size="11" text-anchor="middle">→ "HI"</text>

<!-- 7. 数字方法 -->
<rect x="370" y="225" width="155" height="155" fill="#fff" stroke="#adb5bd" rx="4"/>
<text x="447" y="248" fill="#1971c2" font-size="11" font-weight="bold" text-anchor="middle">⑦ 数字方法</text>
<rect x="385" y="258" width="125" height="28" fill="#f8f9fa" stroke="#dee2e6" rx="3"/>
<text x="447" y="277" fill="#495057" font-size="11" font-family="monospace" text-anchor="middle">{{ n.toFixed(2) }}</text>
<text x="447" y="310" fill="#868e96" font-size="10" text-anchor="middle">.toFixed .round</text>
<rect x="385" y="330" width="125" height="26" fill="#f1f3f5" stroke="#dee2e6" rx="3"/>
<text x="447" y="348" fill="#495057" font-size="11" text-anchor="middle">→ 3.14</text>

<!-- 8. 调用方法 -->
<rect x="535" y="225" width="155" height="155" fill="#fff" stroke="#adb5bd" rx="4"/>
<text x="612" y="248" fill="#1971c2" font-size="11" font-weight="bold" text-anchor="middle">⑧ 调用方法</text>
<rect x="550" y="258" width="125" height="28" fill="#f8f9fa" stroke="#dee2e6" rx="3"/>
<text x="612" y="277" fill="#495057" font-size="11" font-family="monospace" text-anchor="middle">{{ format(d) }}</text>
<text x="612" y="310" fill="#868e96" font-size="10" text-anchor="middle">methods 里的函数</text>
<rect x="550" y="330" width="125" height="26" fill="#f1f3f5" stroke="#dee2e6" rx="3"/>
<text x="612" y="348" fill="#495057" font-size="11" text-anchor="middle">→ "格式化后"</text>
</svg>
