<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="system-ui,PingFang SC,sans-serif">
<rect width="720" height="400" fill="#fafafa"/>
<text x="360" y="28" font-weight="bold" fill="#212529" font-size="17" text-anchor="middle">插值 5 大常见用法（都能在 {{ }} 里写）</text>

<!-- 5 个卡片 -->
<!-- 1. 简单变量 -->
<rect x="40" y="60" width="125" height="290" fill="#fff" stroke="#adb5bd" rx="4"/>
<text x="102" y="84" fill="#1971c2" font-size="11" font-weight="bold" text-anchor="middle">① 简单变量</text>
<rect x="55" y="95" width="95" height="28" fill="#f8f9fa" stroke="#dee2e6" rx="3"/>
<text x="102" y="113" fill="#495057" font-size="11" font-family="monospace" text-anchor="middle">{{ name }}</text>
<text x="102" y="150" fill="#868e96" font-size="10" text-anchor="middle">直接显示</text>
<text x="102" y="167" fill="#868e96" font-size="10" text-anchor="middle">变量值</text>
<rect x="55" y="195" width="95" height="26" fill="#f1f3f5" stroke="#dee2e6" rx="3"/>
<text x="102" y="213" fill="#495057" font-size="11" text-anchor="middle">→ 张三</text>
<text x="102" y="245" fill="#868e96" font-size="10" text-anchor="middle">99% 场景</text>

<!-- 2. 算术 -->
<rect x="175" y="60" width="125" height="290" fill="#fff" stroke="#adb5bd" rx="4"/>
<text x="237" y="84" fill="#1971c2" font-size="11" font-weight="bold" text-anchor="middle">② 算术运算</text>
<rect x="190" y="95" width="95" height="28" fill="#f8f9fa" stroke="#dee2e6" rx="3"/>
<text x="237" y="113" fill="#495057" font-size="11" font-family="monospace" text-anchor="middle">{{ price * count }}</text>
<text x="237" y="150" fill="#868e96" font-size="10" text-anchor="middle">价格 × 数量</text>
<rect x="190" y="195" width="95" height="26" fill="#f1f3f5" stroke="#dee2e6" rx="3"/>
<text x="237" y="213" fill="#495057" font-size="11" text-anchor="middle">→ 297</text>

<!-- 3. 三元 -->
<rect x="310" y="60" width="125" height="290" fill="#fff" stroke="#adb5bd" rx="4"/>
<text x="372" y="84" fill="#1971c2" font-size="11" font-weight="bold" text-anchor="middle">③ 三元运算</text>
<rect x="325" y="95" width="95" height="28" fill="#f8f9fa" stroke="#dee2e6" rx="3"/>
<text x="372" y="108" fill="#495057" font-size="9" font-family="monospace" text-anchor="middle">count &gt; 0 ?</text>
<text x="372" y="119" fill="#495057" font-size="9" font-family="monospace" text-anchor="middle">'有' : '无'</text>
<text x="372" y="150" fill="#868e96" font-size="10" text-anchor="middle">简单 if/else</text>
<rect x="325" y="195" width="95" height="26" fill="#f1f3f5" stroke="#dee2e6" rx="3"/>
<text x="372" y="213" fill="#495057" font-size="11" text-anchor="middle">→ 有库存</text>

<!-- 4. 字符串方法 -->
<rect x="445" y="60" width="125" height="290" fill="#fff" stroke="#adb5bd" rx="4"/>
<text x="507" y="84" fill="#1971c2" font-size="11" font-weight="bold" text-anchor="middle">④ 字符串方法</text>
<rect x="460" y="95" width="95" height="28" fill="#f8f9fa" stroke="#dee2e6" rx="3"/>
<text x="507" y="113" fill="#495057" font-size="9" font-family="monospace" text-anchor="middle">{{ s.toUpperCase() }}</text>
<text x="507" y="150" fill="#868e96" font-size="10" text-anchor="middle">调用 JS 方法</text>
<rect x="460" y="195" width="95" height="26" fill="#f1f3f5" stroke="#dee2e6" rx="3"/>
<text x="507" y="213" fill="#495057" font-size="11" text-anchor="middle">→ XIAOMING</text>

<!-- 5. 调用方法 -->
<rect x="580" y="60" width="125" height="290" fill="#fff" stroke="#adb5bd" rx="4"/>
<text x="642" y="84" fill="#1971c2" font-size="11" font-weight="bold" text-anchor="middle">⑤ 调用方法</text>
<rect x="595" y="95" width="95" height="28" fill="#f8f9fa" stroke="#dee2e6" rx="3"/>
<text x="642" y="113" fill="#495057" font-size="9" font-family="monospace" text-anchor="middle">{{ format(d) }}</text>
<text x="642" y="150" fill="#868e96" font-size="10" text-anchor="middle">调用任意方法</text>
<rect x="595" y="195" width="95" height="26" fill="#f1f3f5" stroke="#dee2e6" rx="3"/>
<text x="642" y="213" fill="#495057" font-size="11" text-anchor="middle">→ 14:23:56</text>

<!-- 底部 -->
<rect x="40" y="370" width="640" height="20" fill="#f1f3f5" stroke="#dee2e6" rx="3"/>
<text x="360" y="384" fill="#495057" font-size="11" font-weight="bold" text-anchor="middle">💡 {{ }} 里就是一个 JS 表达式，最后一个值就是显示内容</text>
</svg>
