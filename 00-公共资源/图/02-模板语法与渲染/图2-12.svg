<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="system-ui,PingFang SC,sans-serif"><rect width="720" height="300" fill="#fafafa"/><text x="360" y="30" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">v-if vs v-show：渲染机制的根本差异</text><rect x="20" y="55" width="330" height="225" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/><text x="185" y="80" font-weight="bold" fill="#2f9e44" font-size="14" text-anchor="middle">v-if — 条件渲染</text><text x="185" y="110"  fill="#495057" font-size="12" text-anchor="middle">false 时元素从 DOM 中移除</text><text x="185" y="135"  fill="#495057" font-size="12" text-anchor="middle">切换开销大（重建/销毁组件）</text><text x="185" y="160"  fill="#495057" font-size="12" text-anchor="middle">首次渲染开销小（只渲染 true 的）</text><text x="185" y="190" font-weight="bold" fill="#2f9e44" font-size="11" text-anchor="middle">适用：切换不频繁</text><text x="185" y="215" font-weight="bold" fill="#2f9e44" font-size="11" text-anchor="middle">      v-if / v-else-if / v-else 分支</text><text x="185" y="245" font-weight="bold" fill="#2f9e44" font-size="11" text-anchor="middle">编译时条件渲染</text><rect x="370" y="55" width="330" height="225" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5" rx="4"/><text x="535" y="80" font-weight="bold" fill="#e8590c" font-size="14" text-anchor="middle">v-show — 显示/隐藏</text><text x="535" y="110"  fill="#495057" font-size="12" text-anchor="middle">始终渲染到 DOM</text><text x="535" y="135"  fill="#495057" font-size="12" text-anchor="middle">false 时 display: none （CSS）</text><text x="535" y="160"  fill="#495057" font-size="12" text-anchor="middle">切换开销小（只改 CSS）</text><text x="535" y="190" font-weight="bold" fill="#e8590c" font-size="11" text-anchor="middle">适用：切换频繁</text><text x="535" y="215" font-weight="bold" fill="#e8590c" font-size="11" text-anchor="middle">      Tab 切换 / 弹窗显隐</text><text x="535" y="245" font-weight="bold" fill="#e8590c" font-size="11" text-anchor="middle">运行时显隐切换</text></svg>