<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="system-ui,PingFang SC,sans-serif"><rect width="720" height="360" fill="#fafafa"/><text x="360" y="28" font-weight="bold" fill="#333" font-size="18" text-anchor="middle">key 的作用：有 key vs 无 key 的 diff 差异</text><rect x="20" y="55" width="330" height="285" fill="#fff5f5" stroke="#e03131" stroke-width="1.5" rx="4"/><text x="185" y="80" font-weight="bold" fill="#e03131" font-size="14" text-anchor="middle">没有 key（就地复用）</text><rect x="40" y="105" width="120" height="40" fill="#ffe3e3" stroke="#ffa8a8" stroke-width="1.5" rx="4"/><text x="100" y="130" font-weight="bold" fill="#c92a2a" font-size="16" text-anchor="middle">A</text><rect x="180" y="105" width="120" height="40" fill="#ffe3e3" stroke="#ffa8a8" stroke-width="1.5" rx="4"/><text x="240" y="130" font-weight="bold" fill="#c92a2a" font-size="16" text-anchor="middle">B</text><text x="185" y="165" font-weight="bold" fill="#e03131" font-size="12" text-anchor="middle">删除 A(头部)</text><rect x="40" y="180" width="120" height="40" fill="#ffe3e3" stroke="#ffa8a8" stroke-width="1.5" rx="4"/><text x="100" y="205" font-weight="bold" fill="#c92a2a" font-size="16" text-anchor="middle">B</text><rect x="180" y="180" width="120" height="40" fill="#ffe3e3" stroke="#ffa8a8" stroke-width="1.5" rx="4"/><text x="240" y="205" font-weight="bold" fill="#c92a2a" font-size="16" text-anchor="middle">C</text><text x="185" y="245"  fill="#c92a2a" font-size="11" text-anchor="middle">复用 A 的 DOM 放 B 的内容</text><text x="185" y="265"  fill="#c92a2a" font-size="11" text-anchor="middle">导致输入框内容错乱！</text><text x="185" y="290" font-weight="bold" fill="#e03131" font-size="12" text-anchor="middle">Bug：状态串位</text><rect x="370" y="55" width="330" height="285" fill="#f0f9e8" stroke="#2f9e44" stroke-width="1.5" rx="4"/><text x="535" y="80" font-weight="bold" fill="#2f9e44" font-size="14" text-anchor="middle">有 key（精确匹配）</text><rect x="390" y="105" width="80" height="40" fill="#d8f5cc" stroke="#a9e095" stroke-width="1.5" rx="4"/><text x="430" y="130" font-weight="bold" fill="#2f9e44" font-size="16" text-anchor="middle">A</text><text x="430" y="115"  fill="#868e96" font-size="9" text-anchor="middle">key:a</text><rect x="490" y="105" width="80" height="40" fill="#d8f5cc" stroke="#a9e095" stroke-width="1.5" rx="4"/><text x="530" y="130" font-weight="bold" fill="#2f9e44" font-size="16" text-anchor="middle">B</text><text x="530" y="115"  fill="#868e96" font-size="9" text-anchor="middle">key:b</text><rect x="580" y="105" width="80" height="40" fill="#d8f5cc" stroke="#a9e095" stroke-width="1.5" rx="4"/><text x="620" y="130" font-weight="bold" fill="#2f9e44" font-size="16" text-anchor="middle">C</text><text x="620" y="115"  fill="#868e96" font-size="9" text-anchor="middle">key:c</text><text x="535" y="165" font-weight="bold" fill="#2f9e44" font-size="12" text-anchor="middle">删除 key:a</text><text x="535" y="185"  fill="#2f9e44" font-size="11" text-anchor="middle">只移除 A，B 和 C 保持不变</text><rect x="430" y="210" width="80" height="40" fill="#d8f5cc" stroke="#a9e095" stroke-width="1.5" rx="4"/><text x="470" y="235" font-weight="bold" fill="#2f9e44" font-size="16" text-anchor="middle">B</text><text x="470" y="220"  fill="#868e96" font-size="9" text-anchor="middle">key:b</text><rect x="530" y="210" width="80" height="40" fill="#d8f5cc" stroke="#a9e095" stroke-width="1.5" rx="4"/><text x="570" y="235" font-weight="bold" fill="#2f9e44" font-size="16" text-anchor="middle">C</text><text x="570" y="220"  fill="#868e96" font-size="9" text-anchor="middle">key:c</text><text x="535" y="280"  fill="#2f9e44" font-size="11" text-anchor="middle">通过 key 精确识别，避免状态错乱</text><text x="535" y="305" font-weight="bold" fill="#2f9e44" font-size="12" text-anchor="middle">规则：永远用唯一 ID 作 key</text><text x="535" y="325" font-weight="bold" fill="#c92a2a" font-size="11" text-anchor="middle">禁止用 index 作 key！</text></svg>